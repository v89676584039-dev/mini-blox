<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1026;font-family:Arial,sans-serif}

@keyframes fl{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.15)}}

input{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:16px;outline:none}

#codebox{display:flex;gap:10px;margin-top:10px;align-items:center}
#roomcode{flex:1;text-align:center;letter-spacing:6px;font-size:20px;padding:12px;border-radius:12px;border:2px dashed rgba(255,210,60,.7);color:#ffd84d;background:rgba(0,0,0,.25)}
#copybtn{padding:12px 14px;border:none;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-size:16px}
#err{display:none;margin-top:14px;padding:10px;border-radius:10px;border:1px solid rgba(255,90,90,.6);background:rgba(120,20,30,.35);color:#ff9a9a;font-size:13px}
#hud{display:none}
#top{position:fixed;top:8px;left:10px;right:10px;z-index:20;display:flex;align-items:center;gap:10px}
#kills{color:#fff;font-weight:bold;font-size:18px;text-shadow:0 1px 3px #000}

.icobtn{width:40px;height:40px;border:none;border-radius:12px;background:rgba(20,25,50,.65);color:#fff;font-size:18px}
#codeHud{position:fixed;top:56px;left:10px;z-index:20;color:rgba(255,255,255,.55);font-size:13px}
#hint{position:fixed;top:92px;left:10px;z-index:19;color:rgba(255,255,255,.45);font-size:12px;line-height:1.7}
#hotbar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:8px}
.slot{width:52px;height:52px;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:rgba(20,25,50,.6);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
.slot.sel{border-color:#ffd84d;background:rgba(60,50,10,.7)}
#atk{position:fixed;bottom:26px;right:24px;width:76px;height:76px;border-radius:50%;border:none;background:rgba(160,30,30,.75);color:#fff;font-size:28px;z-index:20}
#jmp{position:fixed;bottom:120px;right:32px;width:56px;height:56px;border-radius:50%;border:none;background:rgba(90,140,220,.8);color:#fff;font-size:22px;z-index:20}
#joy{position:fixed;z-index:20;display:none}
#joyBase{width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.4);position:absolute;left:-55px;top:-55px;background:rgba(255,255,255,.06)}
#joyKnob{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.55);position:absolute;left:-23px;top:-23px}
#chatbox{position:fixed;left:10px;bottom:110px;width:min(60vw,300px);z-index:19;display:flex;flex-direction:column;gap:4px;max-height:38vh;overflow:hidden;justify-content:flex-end}
.cmsg{background:rgba(0,0,0,.45);color:#fff;padding:4px 8px;border-radius:8px;font-size:13px;word-break:break-word}
#chatin{display:none;position:fixed;left:10px;bottom:80px;width:min(60vw,300px);padding:8px;border-radius:10px;border:none;z-index:22}
#panel{display:none;position:fixed;right:10px;top:60px;z-index:30;background:rgba(15,18,40,.88);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px;width:190px;color:#fff}
#panel h3{font-size:14px;margin-bottom:6px}
.pbtn{display:block;width:100%;margin-top:6px;padding:8px;border:none;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:13px}
#cross{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;z-index:15;pointer-events:none}
#cross:before,#cross:after{content:'';position:absolute;background:rgba(255,255,255,.85)}
#cross:before{left:6px;top:0;width:2px;height:14px}
#cross:after{left:0;top:6px;width:14px;height:2px}
#dead{position:fixed;inset:0;z-index:25;background:rgba(120,0,0,.35);color:#fff;font-size:36px;font-weight:bold;display:none;align-items:center;justify-content:center}
</style>

<script>
'use strict';
var ERR=document.getElementById('err');
window.onerror=function(m){try{if(ERR){ERR.style.display='block';ERR.textContent='\u26a0 Error: '+m;}}catch(e){}return false;};
function $(id){return document.getElementById(id);}
function showErr(t){if(ERR){ERR.style.display='block';ERR.textContent='\u26a0 '+t;}}
var CODE='',MODE='solo',PEER=null,CONNS=[],HOST=false,MYID='p'+Math.floor(Math.random()*99999),TC=0x1f6dd8;
function genCode(){var A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',s='';for(var i=0;i<4;i++)s+=A[Math.floor(Math.random()*A.length)];return s;}
function nickV(){var v=($('nick').value||'').trim();return v||('Noob'+Math.floor(Math.random()*99));}
$('btnSolo').onclick=function(){MODE='solo';HOST=false;enter();};
$('btnCreate').onclick=function(){CODE=genCode();MODE='mp';HOST=true;enter();};
$('btnJoin').onclick=function(){var c=($('joincode').value||'').trim().toUpperCase();if(c.length!==4){showErr('Enter 4-symbol room code');return;}CODE=c;MODE='mp';HOST=false;enter();};
$('copybtn').onclick=function(){try{if(navigator.clipboard)navigator.clipboard.writeText(CODE);}catch(e){}};
function enter(){
 if(MODE==='mp'){$('roomcode').textContent=CODE.split('').join(' ');}
 $('menu').style.display='none';$('hud').style.display='block';
 $('codeHud').textContent=MODE==='mp'?('Room code: '+CODE+' \u2014 friends can JOIN'):'';
 initWorld();
 if(MODE==='mp')initNet();
 sys('Welcome! Type ;help for commands.');
}
// ---------- player state
var P={x:0,y:5,z:20,vy:0,yaw:0,pitch:0.35,hp:100,alive:true,fly:false,god:false,spd:1,jmp:1,w:1,kills:0,big:1,onG:false};
var OTHERS={},DUMMIES={},COLS=[],ROCKETS=[],FX=[],clouds=[],rainPts=null,raining=false,night=false,discoOn=false,discoL=null;
var ZOOM=9,MOV={x:0,y:0},keys={},chatOpen=false,walkPh=0,swingT=0,jmpReq=false,flagDone=false,myModel=null,flag=null;
var scene,camera,renderer,hemi,sun;
// ---------- collision helpers
function addCylCol(x,z,r,y0,y1){COLS.push({t:0,x:x,z:z,r:r,y0:y0,y1:y1});}
function addBoxCol(x1,z1,x2,z2,y0,y1){COLS.push({t:1,x1:Math.min(x1,x2),x2:Math.max(x1,x2),z1:Math.min(z1,z2),z2:Math.max(z1,z2),y0:y0,y1:y1});}
function groundTop(x,z,refY){var g=0;for(var i=0;i<COLS.length;i++){var c=COLS[i];if(c.y1>refY+0.75)continue;
 if(c.t===0){var dx=x-c.x,dz=z-c.z;if(dx*dx+dz*dz<c.r*c.r)g=Math.max(g,c.y1);}
 else{if(x>=c.x1-0.4&&x<=c.x2+0.4&&z>=c.z1-0.4&&z<=c.z2+0.4)g=Math.max(g,c.y1);}}return g;}
function hitXZ(x,z,refY){var y0=refY+0.65,y1=refY+1.5;
 for(var i=0;i<COLS.length;i++){var c=COLS[i];if(c.y1<=y0||c.y0>=y1)continue;
 if(c.t===0){var dx=x-c.x,dz=z-c.z,rr=c.r+0.42;if(dx*dx+dz*dz<rr*rr)return true;}
 else{var cx=Math.max(c.x1,Math.min(x,c.x2)),cz=Math.max(c.z1,Math.min(z,c.z2));var ddx=x-cx,ddz=z-cz;if(ddx*ddx+ddz*ddz<0.176)return true;}}return false;}
// ---------- world init
function initWorld(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x9fd8ff);
 scene.fog=new THREE.Fog(0x9fd8ff,70,260);
 camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,600);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 document.body.appendChild(renderer.domElement);
 hemi=new THREE.HemisphereLight(0xffffff,0x88aa66,0.9);scene.add(hemi);
 sun=new THREE.DirectionalLight(0xffffff,0.7);sun.position.set(40,80,20);scene.add(sun);
 buildMap();buildHouse();buildParkour();
 myModel=makeNoob(TC);scene.add(myModel);
 for(var i=0;i<4;i++)spawnDummy(null);
 addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
 requestAnimationFrame(loop);
 setInterval(netTick,50);
}
function mbox(w,h,d,c,x,y,z,ry){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);if(ry)m.rotation.y=ry;scene.add(m);return m;}
function mcyl(r,h,c,x,y,z){var m=new THREE.Mesh(new THREE.CylinderGeometry(r,r*0.92,h,7),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);scene.add(m);return m;}
function zoneFree(x,z){if(Math.abs(x)<10&&Math.abs(z-20)<12)return false;if(x>-22&&x<-6&&z>-17&&z<-3)return false;if(x>10&&x<48&&z>-4&&z<12)return false;return true;}
function sr(n){var x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function buildMap(){
 var g=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshLambertMaterial({color:0x69a84f}));
 g.rotation.x=-Math.PI/2;scene.add(g);
 mbox(90,0.08,4,0xd8c9a3,-5,0.05,20);
 mbox(4,0.08,70,0xd8c9a3,0,0.05,-15);
 var i,x,z,s;
 for(i=0;i<70;i++){
  x=sr(i)*170-85;z=sr(i+99)*170-85;
  if(!zoneFree(x,z))continue;
  s=0.8+sr(i+7)*0.9;
  mcyl(0.35*s,3*s,0x7a4b23,x,1.5*s,z);addCylCol(x,z,0.55*s,0,3*s);
  var f1=new THREE.Mesh(new THREE.SphereGeometry(1.7*s,7,6),new THREE.MeshLambertMaterial({color:0x2f8f2f}));
  f1.position.set(x,3.2*s+0.8,z);scene.add(f1);
  var f2=new THREE.Mesh(new THREE.SphereGeometry(1.2*s,7,6),new THREE.MeshLambertMaterial({color:0x35a02c}));
  f2.position.set(x+0.6*s,4.1*s,z+0.3);scene.add(f2);
 }
 for(i=0;i<16;i++){x=sr(i+500)*160-80;z=sr(i+777)*160-80;if(!zoneFree(x,z))continue;s=0.5+sr(i+13)*1.3;
  var r=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),new THREE.MeshLambertMaterial({color:0x9a9a94}));
  r.position.set(x,s*0.6,z);r.rotation.set(sr(i)*3,sr(i+1)*3,0);scene.add(r);
  if(s>0.7)addCylCol(x,z,s*0.8,0,s*1.2);}
 for(i=0;i<24;i++){x=sr(i+900)*160-80;z=sr(i+505)*160-80;if(!zoneFree(x,z))continue;
  var b=new THREE.Mesh(new THREE.SphereGeometry(0.7+sr(i)*0.5,6,5),new THREE.MeshLambertMaterial({color:0x2d7a2d}));
  b.position.set(x,0.4,z);scene.add(b);}
 var fcol=[0xff5b9a,0xffd84d,0xffffff,0xff8c42,0x7bb2ff];
 for(i=0;i<60;i++){x=sr(i+2000)*150-75;z=sr(i+3000)*150-75;if(!zoneFree(x,z))continue;
  mcyl(0.03,0.35,0x2d7a2d,x,0.17,z);
  var fl=new THREE.Mesh(new THREE.SphereGeometry(0.14,6,5),new THREE.MeshLambertMaterial({color:fcol[i%5]}));
  fl.position.set(x,0.42,z);scene.add(fl);}
 for(i=0;i<10;i++){var cg=new THREE.Group();
  var w1=new THREE.Mesh(new THREE.BoxGeometry(6+rnd(0,4),1.2,2.4),new THREE.MeshLambertMaterial({color:0xffffff}));
  var w2=new THREE.Mesh(new THREE.BoxGeometry(3,1.1,2),new THREE.MeshLambertMaterial({color:0xf4f9ff}));
  w2.position.set(2.5,0.6,0);cg.add(w1);cg.add(w2);
  cg.position.set(sr(i+41)*200-100,42+sr(i)*14,sr(i+52)*200-100);
  scene.add(cg);clouds.push({g:cg,v:0.4+sr(i)*0.5});}
}
function buildHouse(){
 var hx=-14,hz=-10,W=10,D=8,H=3,T=0.4,wall=0xcfa876;
 mbox(W+1.4,0.25,D+1.4,0xb0aa9c,hx,0.125,hz);
 mbox(W,0.14,D,0x9a7b53,hx,0.2,hz);
 mbox(W,H,T,wall,hx,H/2,hz-D/2);addBoxCol(hx-W/2,hz-D/2-T/2,hx+W/2,hz-D/2+T/2,0,H);
 mbox(T,H,D,wall,hx-W/2,H/2,hz);addBoxCol(hx-W/2-T/2,hz-D/2,hx-W/2+T/2,hz+D/2,0,H);
 mbox(T,H,D,wall,hx+W/2,H/2,hz);addBoxCol(hx+W/2-T/2,hz-D/2,hx+W/2+T/2,hz+D/2,0,H);
 mbox((W/2-0.9),H,T,wall,hx-(0.9+(W/2-0.9)/2),H/2,hz+D/2);addBoxCol(hx-W/2,hz+D/2-T/2,hx-0.9,hz+D/2+T/2,0,H);
 mbox((W/2-0.9),H,T,wall,hx+(0.9+(W/2-0.9)/2),H/2,hz+D/2);addBoxCol(hx+0.9,hz+D/2-T/2,hx+W/2,hz+D/2+T/2,0,H);
 mbox(1.8,H-2.2,T,0xcfa876,hx,2.2+(H-2.2)/2,hz+D/2);addBoxCol(hx-0.9,hz+D/2-T/2,hx+0.9,hz+D/2+T/2,2.2,H);
 mbox(0.16,2.2,0.5,0x6b4226,hx-0.95,1.1,hz+D/2+0.05);
 mbox(0.16,2.2,0.5,0x6b4226,hx+0.95,1.1,hz+D/2+0.05);
 mbox(2.1,0.16,0.5,0x6b4226,hx,2.25,hz+D/2+0.05);
 var door=new THREE.Mesh(new THREE.BoxGeometry(1.5,2.1,0.09),new THREE.MeshLambertMaterial({color:0x6b4226}));
 door.position.set(hx-0.75,1.05,hz+D/2+0.1);door.rotation.y=-1.9;scene.add(door);
 var knob=new THREE.Mesh(new THREE.SphereGeometry(0.07,6,6),new THREE.MeshLambertMaterial({color:0xffd84d}));
 knob.position.set(hx-0.15,1.05,hz+D/2+0.35);scene.add(knob);
 function win(x,y,z,side){var ry=side==='x'?Math.PI/2:0;
  var fr=new THREE.Mesh(new THREE.BoxGeometry(side==='x'?0.1:1.4,1.4,side==='x'?1.4:0.1),new THREE.MeshLambertMaterial({color:0x6b4226}));
  fr.position.set(x,y,z);scene.add(fr);
  var gl=new THREE.Mesh(new THREE.BoxGeometry(side==='x'?0.08:1.15,1.15,side==='x'?1.15:0.08),new THREE.MeshLambertMaterial({color:0x9fd4ff,transparent:true,opacity:0.55}));
  gl.position.set(x,y,z);scene.add(gl);
  var m1=new THREE.Mesh(new THREE.BoxGeometry(side==='x'?0.12:0.08,1.15,side==='x'?0.08:0.12),new THREE.MeshLambertMaterial({color:0x6b4226}));
  m1.position.set(x,y,z);scene.add(m1);
  var m2=new THREE.Mesh(new THREE.BoxGeometry(side==='x'?0.08:1.15,0.12,side==='x'?1.15:0.08),new THREE.MeshLambertMaterial({color:0x6b4226}));
  m2.position.set(x,y,z);scene.add(m2);}
 win(hx-3.2,1.8,hz+D/2+0.02,'z');win(hx+3.2,1.8,hz+D/2+0.02,'z');
 win(hx-2.6,1.8,hz-D/2-0.02,'z');win(hx+2.6,1.8,hz-D/2-0.02,'z');

function tracer(a,b,c){var d=tmpV.subVectors(b,a);var L=d.length();if(L<0.05)return;
 var m=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,L,4),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0.8}));
 m.position.copy(a).addScaledVector(d,0.5);

function findHit(o,dir,maxD){var best=null,bd=maxD;
 function test(px,py,pz,kind,id){var cx=px-o.x,cy=py-o.y,cz=pz-o.z;
  var tca=cx*dir.x+cy*dir.y+cz*dir.z;if(tca<0)return;
  var d2=cx*cx+cy*cy+cz*cz-tca*tca;if(d2>0.81)return;
  var thc=Math.sqrt(0.81-d2),t=tca-thc;if(t<0)t=tca+thc;
  if(t>0&&t<bd){bd=t;best={d:t,kind:kind,id:id};}}
 for(var k in DUMMIES){var g=DUMMIES[k].g;test(g.position.x,g.position.y+1.2,g.position.z,'d',k);}
 for(var o2 in OTHERS){var g2=OTHERS[o2].m;test(g2.position.x,g2.position.y+1.2,g2.position.z,'o',o2);}
 return best;}

  var h=findHit(o,dirV,80);

var canvas=null,joyId=null,camTouch={},pinchD=0;
function setupInput(){
 canvas=renderer.domElement;
 canvas.addEventListener('touchstart',function(e){e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
   if(t.clientX<innerWidth*0.45&&t.clientY>innerHeight*0.3&&joyId===null){
    joyId=t.identifier;joyShow(t.clientX,t.clientY);
   }else{camTouch[t.identifier]={x:t.clientX,y:t.clientY};}
   if(Object.keys(camTouch).length===2){var ks=Object.keys(camTouch);
    var a=camTouch[ks[0]],b=camTouch[ks[1]];pinchD=Math.hypot(a.x-b.x,a.y-b.y);}}},{passive:false});
 canvas.addEventListener('touchmove',function(e){e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
   if(t.identifier===joyId){joyMove(t.clientX,t.clientY);}
   else if(camTouch[t.identifier]){
    if(Object.keys(camTouch).length===2){
     var old=camTouch[t.identifier];
     old.x=t.clientX;old.y=t.clientY;
     var ks=Object.keys(camTouch);
     var a=camTouch[ks[0]],b=camTouch[ks[1]];
     var nd=Math.hypot(a.x-b.x,a.y-b.y);
     if(pinchD>0){ZOOM=Math.max(3,Math.min(26,ZOOM*(pinchD/nd)));}pinchD=nd;
    }else{
     var o=camTouch[t.identifier];
     P.yaw-=(t.clientX-o.x)*0.006;
     P.pitch=Math.max(-0.4,Math.min(1.2,P.pitch+(t.clientY-o.y)*0.005));
     o.x=t.clientX;o.y=t.clientY;}}}},{passive:false});
 var endT=function(e){for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
  if(t.identifier===joyId){joyId=null;$('joy').style.display='none';MOV.x=0;MOV.y=0;}
  delete camTouch[t.identifier];pinchD=0;}};
 canvas.addEventListener('touchend',endT);canvas.addEventListener('touchcancel',endT);
 canvas.addEventListener('mousedown',function(e){camTouch['m']={x:e.clientX,y:e.clientY};});
 canvas.addEventListener('mousemove',function(e){var o=camTouch['m'];if(!o||chatOpen)return;
  P.yaw-=(e.clientX-o.x)*0.005;P.pitch=Math.max(-0.4,Math.min(1.2,P.pitch+(e.clientY-o.y)*0.005));
  o.x=e.clientX;o.y=e.clientY;});
 addEventListener('mouseup',function(){delete camTouch['m'];});
 addEventListener('wheel',function(e){ZOOM=Math.max(3,Math.min(26,ZOOM+e.deltaY*0.01));});
 addEventListener('keydown',function(e){
  if(chatOpen){if(e.code==='Enter'){sendChat();}if(e.code==='Escape'){chatClose();}return;}
  keys[e.code]=true;
  if(e.code==='KeyT'){e.preventDefault();chatOpenF();}
  if(e.code==='KeyF'){P.fly=!P.fly;sys('Fly '+(P.fly?'ON':'OFF'));}
  if(e.code==='Digit1')setW(1);if(e.code==='Digit2')setW(2);if(e.code==='Digit3')setW(3);

// ---------- chat & commands
function chatOpenF(){chatOpen=true;$('chatin').style.display='block';$('chatin').focus();}
function chatClose(){chatOpen=false;$('chatin').style.display='none';$('chatin').blur();}
function sendChat(){
 var v=$('chatin').value.trim();$('chatin').value='';
 if(!v){chatClose();return;}
 if(v.charAt(0)===';'){doCommand(v);}
 else{addChat(nickV(),v,'#ffffff');netSend({t:'ch',n:nickV(),m:v});}

function doCommand(line){
 var p=line.slice(1).trim().split(/\s+/),c=p[0],a=p.slice(1);
 if(c==='help')sys('Commands: ;fly ;god ;speed ;jump ;reset ;dummy ;killall ;rain ;night ;disco ;tp X Z ;home');
 else if(c==='fly'){P.fly=!P.fly;sys('Fly '+(P.fly?'ON':'OFF'));}
 else if(c==='god'){P.god=!P.god;sys('God mode '+(P.god?'ON':'OFF'));}
 else if(c==='speed'){P.spd=P.spd>1?1:2;sys('Speed x'+P.spd);}
 else if(c==='jump'){P.jmp=P.jmp>1?1:2;sys('Jump x'+P.jmp);}
 else if(c==='reset'){P.spd=1;P.jmp=1;P.god=false;P.big=1;P.fly=false;sys('Reset done');}
 else if(c==='dummy'){spawnDummy(null);netSend({t:'dm2'});sys('Dummy spawned');}
 else if(c==='killall'){killAllLocal();netSend({t:'ka'});sys('All dummies removed');}
 else if(c==='rain'){setRain(!raining);netSend({t:'wx',k:'rain'});}
 else if(c==='night'){setNight(!night);netSend({t:'wx',k:'night'});}
 else if(c==='disco'){discoOn=!discoOn;netSend({t:'wx',k:'disco'});sys('Disco '+(discoOn?'ON':'OFF'));}
 else if(c==='home'){P.x=0;P.z=20;P.y=5;P.vy=0;sys('Home');}
 else if(c==='tp'){P.x=parseFloat(a[0])||0;P.z=parseFloat(a[1])||0;P.y=groundTop(P.x,P.z,50)+0.5;sys('Teleported to '+P.x+' '+P.z);}
 else sys('Unknown command. ;help');}
function adminAct(a){
 if(a==='fly')P.fly=!P.fly;
 else if(a==='god')P.god=!P.god;
 else if(a==='speed')P.spd=P.spd>1?1:2;
 else if(a==='jump')P.jmp=P.jmp>1?1:2;
 else if(a==='reset'){P.spd=1;P.jmp=1;P.god=false;P.fly=false;}
 else if(a==='dummy'){spawnDummy(null);netSend({t:'dm2'});}
 else if(a==='killall'){killAllLocal();netSend({t:'ka'});}
 else if(a==='rain'){setRain(!raining);netSend({t:'wx',k:'rain'});}
 else if(a==='night'){setNight(!night);netSend({t:'wx',k:'night'});}
 else if(a==='disco'){discoOn=!discoOn;netSend({t:'wx',k:'disco'});}
 else if(a==='home'){P.x=0;P.z=20;P.y=5;P.vy=0;}
 updKills();}

function initNet(){
 try{PEER=new Peer(HOST?('mbx'+CODE+'host'):undefined,{debug:1});}
 catch(e){showErr('Net init: '+e);return;}
 PEER.on('open',function(pid){MYID=pid;
  if(!HOST){var c=PEER.connect('mbx'+CODE+'host',{reliable:true});wire(c);}
  sys('Connected as '+nickV());});
 PEER.on('connection',function(c){wire(c);});
 PEER.on('error',function(e){showErr('Net: '+e.type+' (check code / internet)');});}
function wire(c){
 c.on('open',function(){if(CONNS.indexOf(c)<0)CONNS.push(c);
  c.send({t:'hi',id:MYID,n:nickV(),tc:TC});});
 c.on('data',function(d){try{handleNet(d,c);}catch(e){}});
 c.on('close',function(){CONNS=CONNS.filter(function(x){return x!==c;});
  for(var id in OTHERS){if(OTHERS[id].conn===c){removeOther(id);if(HOST)netSend({t:'bye',id:id});}}});
 c.on('error',function(){});}
function netSend(d){for(var i=0;i<CONNS.length;i++){try{CONNS[i].send(d);}catch(e){}}}
function relay(d,except){for(var i=0;i<CONNS.length;i++){var c=CONNS[i];
 if(c!==except){try{c.send(d);}catch(e){}}}}
function handleNet(d,from){
 if(!d||!d.t)return;
 if(d.t==='hi'){OTHERS[d.id]=OTHERS[d.id]||{};OTHERS[d.id].conn=from;addOther(d.id,d.n,d.tc);}
 else if(d.t==='st'){var o=OTHERS[d.id];if(o&&o.m){o.m.position.set(d.x,d.y,d.z);o.m.rotation.y=d.ry;
  o.mov=(Math.abs(o.lx-d.x)+Math.abs(o.lz-d.z))>0.02;o.lx=d.x;o.lz=d.z;}}
 else if(d.t==='sw'){if(OTHERS[d.id])OTHERS[d.id].swingT=0.35;}
 else if(d.t==='sh'){tracer(new THREE.Vector3(d.x,d.y,d.z),
  new THREE.Vector3(d.x+d.dx*60,d.y+d.dy*60,d.z+d.dz*60),0xffee66);}
 else if(d.t==='rk'){var m=new THREE.Mesh(new THREE.ConeGeometry(0.22,0.8,7),new THREE.MeshBasicMaterial({color:0xff5533}));
  m.position.set(d.x,d.y,d.z);scene.add(m);
  ROCKETS.push({m:m,v:new THREE.Vector3(d.dx,d.dy,d.dz).multiplyScalar(18),ttl:4.5,foreign:true});}
 else if(d.t==='dm'){if(d.to===MYID){takeDamage(d.d,d.by);}
  else if(String(d.to).charAt(0)==='d'){dummyDmgLocal(d.to,d.d,false);}}
 else if(d.t==='die'){if(d.by===MYID){P.kills++;updKills();}}
 else if(d.t==='ch'){addChat(d.n,d.m,'#ffffff');}
 else if(d.t==='wx'){if(d.k==='rain')setRain(!raining);else if(d.k==='night')setNight(!night);else if(d.k==='disco')discoOn=!discoOn;}
 else if(d.t==='dm2'){spawnDummy(d.id);}
 else if(d.t==='ka'){killAllLocal();}
 else if(d.t==='bye'){removeOther(d.id);}
 if(HOST)relay(d,from);}
function netTick(){
 if(MODE!=='mp'||!PEER)return;
 netSend({t:'st',id:MYID,x:P.x,y:P.y,z:P.z,ry:P.yaw});}
// ---------- physics & loop
function updatePlayer(dt){
 if(!P.alive)return;
 var f=(keys['KeyW']?1:0)-(keys['KeyS']?1:0);
 var s=(keys['KeyD']?1:0)-(keys['KeyA']?1:0);
 f+=-MOV.y;s+=MOV.x;
 var len=Math.hypot(f,s);if(len>1){f/=len;s/=len;}
 var sp=6*P.spd*(P.fly?1.6:1);
 var fx=Math.sin(P.yaw),fz=Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
 var mx=(fx*f+rx*s)*sp*dt,mz=(fz*f+rz*s)*sp*dt;
 if(P.fly){var u=(keys['Space']?1:0)-(keys['ShiftLeft']?1:0);P.y+=u*8*dt;}
 else{if(jmpReq&&P.onG){P.vy=9.5*P.jmp;P.onG=false;}
  P.vy-=25*dt;P.y+=P.vy*dt;}
 var nx=P.x+mx;if(!hitXZ(nx,P.z,P.y))P.x=nx;
 var nz=P.z+mz;if(!hitXZ(P.x,nz,P.y))P.z=nz;
 P.x=Math.max(-140,Math.min(140,P.x));P.z=Math.max(-140,Math.min(140,P.z));
 if(!P.fly){
  var sup=groundTop(P.x,P.z,P.y+0.6);
  if(P.y<=sup+0.01&&P.vy<=0){P.y=sup;P.vy=0;P.onG=true;}
  else P.onG=false;
  if(P.y<-10){P.x=0;P.z=20;P.y=5;P.vy=0;}}
 if(jmpReq)jmpReq=false;
 if(len>0.05&&P.onG)walkPh+=dt*9;else walkPh*=0.8;
 // flag of parkour
 if(!flagDone&&flag&&Math.hypot(P.x-40.5,P.z-4.5)<3.5&&P.y>6){
  flagDone=true;sys('\ud83c\udfc6 PARKOUR COMPLETE! \ud83c\udf89');}
 // model & limbs
 myModel.position.set(P.x,P.y,P.z);
 myModel.rotation.y=P.yaw;
 var u=myModel.userData;
 var sw=Math.sin(walkPh)*0.7;
 if(swingT>0){swingT-=dt;u.armR.rotation.x=-2.3*Math.sin(Math.max(0,1-swingT/0.35)*Math.PI);}
 else u.armR.rotation.x=sw*0.6;
 u.armL.rotation.x=sw*0.6;
 u.legL.rotation.x=sw;u.legR.rotation.x=-sw;
 applyWeapon(myModel,P.w);}
function updateOthers(dt){
 for(var id in OTHERS){var o=OTHERS[id];var u=o.m.userData;
  var sw2=o.mov?Math.sin(performance.now()*0.012)*0.6:0;
  if(o.swingT>0){o.swingT-=dt;u.armR.rotation.x=-2.3*Math.sin(Math.max(0,1-o.swingT/0.35)*Math.PI);}
  else u.armR.rotation.x=sw2*0.6;
  u.armL.rotation.x=sw2*0.6;u.legL.rotation.x=sw2;u.legR.rotation.x=-sw2;}}
function updateDummies(dt){
 for(var k in DUMMIES){var dm=DUMMIES[k];dm.t-=dt;
  if(dm.t<=0){dm.t=2+Math.random()*3;dm.dir=Math.random()*6.28;}
  var sp2=1.2,dx=Math.sin(dm.dir)*sp2*dt,dz=Math.cos(dm.dir)*sp2*dt;
  var nx=dm.g.position.x+dx,nz=dm.g.position.z+dz;
  if(!hitXZ(nx,nz,dm.g.position.y+0.5)){dm.g.position.x=nx;dm.g.position.z=nz;
   dm.g.position.y=groundTop(nx,nz,dm.g.position.y+0.6);}
  else dm.dir+=2.5;
  dm.g.rotation.y=dm.dir;
  dm.bar.position.set(dm.g.position.x,dm.g.position.y+2.5,dm.g.position.z);
  dm.bar.quaternion.copy(camera.quaternion);
  var u=dm.g.userData;var w2=Math.sin(performance.now()*0.01)*0.4;
  u.legL.rotation.x=w2;u.legR.rotation.x=-w2;}}
function updateFX(dt){
 for(var i=FX.length-1;i>=0;i--){var e=FX[i];e.ttl-=dt;
  if(e.boom){e.m.scale.multiplyScalar(1+dt*14);e.m.material.opacity=Math.max(0,e.ttl*1.8);}
  else e.m.material.opacity=Math.max(0,e.ttl*6);
  if(e.ttl<=0){scene.remove(e.m);FX.splice(i,1);}}}
function updateRockets(dt){
 for(var i=ROCKETS.length-1;i>=0;i--){var r=ROCKETS[i];r.ttl-=dt;
  r.v.y-=4*dt;r.m.position.addScaledVector(r.v,dt);
  r.m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),r.v.clone().normalize());
  var gt=groundTop(r.m.position.x,r.m.position.z,r.m.position.y+2);
  var hitNow=r.m.position.y<=gt+0.25||r.ttl<=0;
  if(!hitNow&&r.ttl<4.4){
   for(var k in DUMMIES){var g=DUMMIES[k].g;
    if(r.m.position.distanceTo(g.position)<1.2){hitNow=true;break;}}}
  if(hitNow){
   boom(r.m.position);
   if(!r.foreign){
    for(var k2 in DUMMIES){var g2=DUMMIES[k2].g;
     var dd=r.m.position.distanceTo(g2.position);
     if(dd<5)dummyDmgLocal(k2,Math.round(90*(1-dd/5)),true);}
    for(var o2 in OTHERS){var g3=OTHERS[o2].m;
     var dd2=r.m.position.distanceTo(g3.position);
     if(dd2<5)netSend({t:'dm',to:o2,d:Math.round(90*(1-dd2/5)),by:MYID});}}
   scene.remove(r.m);ROCKETS.splice(i,1);}}}
function updateWeather(dt){
 if(raining&&rainPts){var pos=rainPts.geometry.attributes.position;
  for(var i=0;i<pos.count;i++){var y=pos.getY(i)-28*dt;
   if(y<0)y=50;pos.setY(i,y);}pos.needsUpdate=true;}
 if(discoOn&&discoL){var t=performance.now()*0.001;
  discoL.position.set(P.x,P.y+3,P.z);
  discoL.color.setHSL((t*0.3)%1,0.9,0.55);discoL.intensity=1.2;}
 else if(discoL)discoL.intensity=0;
 if(flag)flag.rotation.y=Math.sin(performance.now()*0.003)*0.3;
 for(var c=0;c<clouds.length;c++){clouds[c].g.position.x+=clouds[c].v*dt;
  if(clouds[c].g.position.x>110)clouds[c].g.position.x=-110;}}
var lastT=performance.now();
function loop(t){
 requestAnimationFrame(loop);
 var dt=Math.min((t-lastT)/1000,0.05);lastT=t;
 updatePlayer(dt);updateOthers(dt);updateDummies(dt);updateFX(dt);updateRockets(dt);updateWeather(dt);
 var cp=Math.cos(P.pitch),spt=Math.sin(P.pitch);
 camera.position.set(P.x-Math.sin(P.yaw)*cp*ZOOM,P.y+2+ZOOM*spt,P.z-Math.cos(P.yaw)*cp*ZOOM);
 camera.lookAt(P.x,P.y+1.6,P.z);
 renderer.render(scene,camera);}
wireUI();
</script>
