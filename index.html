<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Моя игра</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;touch-action:none;font-family:Arial,sans-serif;-webkit-user-select:none;user-select:none}
canvas{display:block}
#feed{position:fixed;left:8px;bottom:58px;max-width:62%;pointer-events:none;z-index:5}
.m{background:rgba(0,0,0,.45);color:#fff;padding:4px 9px;margin-top:4px;border-radius:8px;font-size:13px;transition:opacity .5s;word-break:break-word}
#chatbar{position:fixed;left:8px;bottom:10px;width:min(300px,58%);z-index:6}
#chat{width:100%;box-sizing:border-box;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.35);border-radius:10px;color:#fff;padding:8px 10px;font-size:14px;outline:none}
.btn{position:fixed;width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.55);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;z-index:6;touch-action:none}
#bJump{right:16px;bottom:24px}
#bFly{right:86px;bottom:24px}
#bAttack{right:156px;bottom:24px}
#bUp{right:16px;bottom:96px;display:none}
#bDown{right:86px;bottom:96px;display:none}
#wlbl{position:fixed;top:8px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.45);padding:5px 12px;border-radius:10px;font-size:14px;z-index:5}
#joyBase{position:fixed;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.2);display:none;z-index:4;pointer-events:none}
#joyStick{position:fixed;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.55);display:none;z-index:4;pointer-events:none}
</style>
</head>
<body>
<div id="feed"></div>
<div id="chatbar"><input id="chat" placeholder="Сообщение или /help" maxlength="120" autocomplete="off"></div>
<div id="wlbl">Оружие: кулаки</div>
<div id="joyBase"></div><div id="joyStick"></div>
<div class="btn" id="bJump">⤒</div>
<div class="btn" id="bFly">✈</div>
<div class="btn" id="bAttack">⚔</div>
<div class="btn" id="bUp">⬆</div>
<div class="btn" id="bDown">⬇</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 45, 130);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const canvas = renderer.domElement;

scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x3a7d2c, 0.95));
const sun = new THREE.DirectionalLight(0xfff2cc, 1.1);
sun.position.set(20,35,12);
sun.castShadow = true;
sun.shadow.camera.left=-45; sun.shadow.camera.right=45; sun.shadow.camera.top=45; sun.shadow.camera.bottom=-45; sun.shadow.camera.far=120;
scene.add(sun);

// ===== земля =====
const ground = new THREE.Mesh(new THREE.PlaneGeometry(300,300), new THREE.MeshLambertMaterial({color:0x4c9a3f}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// ===== коллизии =====
const colliders = [];
function addCol(px,py,pz,w,h,d){
  colliders.push({x0:px-w/2,x1:px+w/2,y0:py-h/2,y1:py+h/2,z0:pz-d/2,z1:pz+d/2});
}
function addBox(px,py,pz,w,h,d,color,collide=true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshLambertMaterial({color}));
  m.position.set(px,py,pz); m.castShadow=true; m.receiveShadow=true; scene.add(m);
  if(collide) addCol(px,py,pz,w,h,d);
  return m;
}
function collideAt(x,y,z){
  const r=0.35, h=1.9;
  for(const c of colliders){
    if(x+r>c.x0 && x-r<c.x1 && y+h>c.y0 && y<c.y1 && z+r>c.z0 && z-r<c.z1) return true;
  }
  return false;
}

// ===== дом =====
const hx=14, hz=-10, T=0.3, HW=4;
const WHITE=0xf4efe0, WOOD=0x8b5a2b, ROOF=0x7a3b2e, H2=0xd9c39a;
addBox(hx,0.1,hz,8.4,0.2,8.4,WOOD,false); // пол
// передняя стена с проёмом двери
addBox(hx-2.3,1.5,hz+HW,3.4,3,T,WHITE);
addBox(hx+2.3,1.5,hz+HW,3.4,3,T,WHITE);
addBox(hx,2.6,hz+HW,1.2,0.8,T,WHITE);
// рама двери
addBox(hx-0.7,1.1,hz+HW,0.12,2.2,0.44,WOOD,false);
addBox(hx+0.7,1.1,hz+HW,0.12,2.2,0.44,WOOD,false);
addBox(hx,2.2,hz+HW,1.52,0.12,0.44,WOOD,false);
// открытая дверь
const doorG = new THREE.Group(); doorG.position.set(hx-0.65,0,hz+HW);
const door = new THREE.Mesh(new THREE.BoxGeometry(1.3,2.1,0.1), new THREE.MeshLambertMaterial({color:0x6b3e1e}));
door.position.set(0.65,1.05,0.06); door.castShadow=true; doorG.add(door); doorG.rotation.y=-1.15; scene.add(doorG);
// задняя стена
addBox(hx,1.5,hz-HW,8,3,T,WHITE);
// боковые стены с окнами
[-1,1].forEach(s=>{
  const wx = hx + s*HW;
  addBox(wx,0.6,hz,T,1.2,8,WHITE);
  addBox(wx,2.55,hz,T,0.9,8,WHITE);
  addBox(wx,1.65,hz-2.5,T,0.9,3,WHITE);
  addBox(wx,1.65,hz+2.5,T,0.9,3,WHITE);
  const glass = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.9,2), new THREE.MeshLambertMaterial({color:0x9fd8ff,transparent:true,opacity:0.35}));
  glass.position.set(wx,1.65,hz); scene.add(glass);
  addBox(wx,2.1,hz,T+0.06,0.08,2.1,0xfafafa,false);
  addBox(wx,1.2,hz,T+0.06,0.08,2.1,0xfafafa,false);
});
// фронтоны и крыша
addBox(hx,3.5,hz+3.8,8,1.4,0.3,H2,false);
addBox(hx,3.5,hz-3.8,8,1.4,0.3,H2,false);
const r1 = new THREE.Mesh(new THREE.BoxGeometry(9,0.25,4.4), new THREE.MeshLambertMaterial({color:ROOF}));
r1.position.set(hx,3.7,hz+2.1); r1.rotation.x=0.34; r1.castShadow=true; scene.add(r1);
const r2 = r1.clone(); r2.position.z=hz-2.1; r2.rotation.x=-0.34; scene.add(r2);
addBox(hx,4.42,hz,9.2,0.3,0.55,0x5e2d23,false);
addBox(hx+2,4.2,hz-1,0.8,1.6,0.8,0x9c4a3a,false); // труба
addCol(hx,3.75,hz,9,1.7,9); // нельзя влететь в дом через крышу
// крыльцо
addBox(hx,0.09,hz+4.8,2.4,0.18,1.4,WOOD,false);
// ===== интерьер =====
const rug = new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,0.04,24), new THREE.MeshLambertMaterial({color:0xa63b32}));
rug.position.set(hx,0.24,hz+1); rug.receiveShadow=true; scene.add(rug);
// стол
addBox(hx-2.5,0.78,hz+1,1.6,0.1,1,WOOD,false);
[[-0.65,-0.35],[0.65,-0.35],[-0.65,0.35],[0.65,0.35]].forEach(o=>{
  addBox(hx-2.5+o[0],0.51,hz+1+o[1],0.1,0.44,0.1,0x6b3e1e,false);
});
addCol(hx-2.5,0.7,hz+1,1.8,1.1,1.2);
// кровать
addBox(hx+2.9,0.45,hz-2.4,1.2,0.5,2.2,WOOD,false);
addBox(hx+2.9,0.72,hz-2.4,1.1,0.2,2.1,0xe8e2d0,false);
addBox(hx+2.9,0.85,hz-1.55,1,0.18,0.5,0xffffff,false);
addCol(hx+2.9,0.6,hz-2.4,1.4,1.2,2.4);
// шкаф с книгами
addBox(hx+1,1.3,hz-3.55,1.6,2.2,0.4,WOOD,false);
[0x9c3a2e,0x2e6b9c,0x3a9c4e,0xb0892e].forEach((c,i)=>{ addBox(hx+0.4+i*0.4,1.9,hz-3.3,0.22,0.5,0.12,c,false); });
addCol(hx+1,1.3,hz-3.55,1.8,2.4,0.6);
// лампа
addBox(hx-3,1.1,hz-3,0.08,1.7,0.08,0x444444,false);
const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.28,12,10), new THREE.MeshBasicMaterial({color:0xffe9a8}));
bulb.position.set(hx-3,2.05,hz-3); scene.add(bulb);
const lampLight = new THREE.PointLight(0xffd28a,1.2,9); lampLight.position.set(hx-3,2,hz-3); scene.add(lampLight);
addCol(hx-3,0.9,hz-3,0.4,1.9,0.4);

// ===== забор, дорожка, деревья =====
function fence(x1,z1,x2,z2){
  const dx=x2-x1, dz=z2-z1, len=Math.hypot(dx,dz), n=Math.floor(len/2);
  for(let i=0;i<=n;i++){ addBox(x1+dx*i/n,0.5,z1+dz*i/n,0.16,1,0.16,0x8a6b4a,false); }
  const rail=new THREE.Mesh(new THREE.BoxGeometry(Math.max(Math.abs(dx),0.2),0.1,Math.max(Math.abs(dz),0.2)+0.02), new THREE.MeshLambertMaterial({color:0x8a6b4a}));
  if(Math.abs(dz)>Math.abs(dx)){ rail.geometry = new THREE.BoxGeometry(0.1,0.1,len); }
  rail.position.set((x1+x2)/2,0.75,(z1+z2)/2); rail.castShadow=true; scene.add(rail);
  addCol((x1+x2)/2,0.6,(z1+z2)/2, Math.max(Math.abs(dx),0.3),1.2,Math.max(Math.abs(dz),0.3));
}
fence(4,2,13,2); fence(16,2,26,2); fence(4,2,4,-20); fence(26,2,26,-20); fence(4,-20,26,-20);
for(let z=2.6;z<hz+4.4;z+=1.3){ const c=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.06,1.1), new THREE.MeshLambertMaterial({color:(Math.round(z*10)%2?0x9a9a94:0xb9b9b0)})); c.position.set(hx,0.05,z); c.receiveShadow=true; scene.add(c); }
function tree(tx,tz){
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.4,2.6,8), new THREE.MeshLambertMaterial({color:0x6b4a2b}));
  tr.position.set(tx,1.3,tz); tr.castShadow=true; scene.add(tr);
  const f=new THREE.Mesh(new THREE.ConeGeometry(1.9,3.6,9), new THREE.MeshLambertMaterial({color:0x2f7d2f}));
  f.position.set(tx,4.2,tz); f.castShadow=true; scene.add(f);
  addCol(tx,1.3,tz,0.8,2.6,0.8);
}
[[6,6],[24,5],[27,-16],[4,-14],[22,-19],[0,-4]].forEach(p=>tree(p[0],p[1]));
[[-3,3],[19,8],[28,-6],[8,-16]].forEach(p=>{ const r=new THREE.Mesh(new THREE.BoxGeometry(1,0.7,0.9), new THREE.MeshLambertMaterial({color:0x8d8d86})); r.position.set(p[0],0.3,p[1]); r.rotation.y=Math.random(); r.castShadow=true; scene.add(r); });

// ===== нубик (Roblox-стиль) =====
const YEL=0xf5cd30, BLU=0x0f5cc0, GRN=0x7db83a;
function makeNoob(torsoC=BLU, legC=GRN){
  const g = new THREE.Group();
  const mat = c => new THREE.MeshLambertMaterial({color:c});
  function part(w,h,d,c,x,y,z,parent){
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c));
    m.position.set(x,y,z); m.castShadow=true; parent.add(m); return m;
  }
  const legL = new THREE.Group(); legL.position.set(-0.18,0.8,0);
  part(0.34,0.8,0.34,legC,0,-0.4,0,legL);
  const legR = new THREE.Group(); legR.position.set(0.18,0.8,0);
  part(0.34,0.8,0.34,legC,0,-0.4,0,legR);
  part(0.8,0.8,0.45,torsoC,0,1.2,0,g);
  const armL = new THREE.Group(); armL.position.set(-0.55,1.55,0);
  part(0.28,0.75,0.28,YEL,0,-0.35,0,armL);
  const armR = new THREE.Group(); armR.position.set(0.55,1.55,0);
  part(0.28,0.75,0.28,YEL,0,-0.35,0,armR);
  const head = part(0.62,0.62,0.62,YEL,0,1.93,0,g);
  part(0.09,0.13,0.03,0x222222,-0.14,1.98,0.32,g);
  part(0.09,0.13,0.03,0x222222,0.14,1.98,0.32,g);
  part(0.3,0.05,0.03,0x222222,0,1.78,0.32,g);
  g.add(legL,legR,armL,armR);
  return {g,legL,legR,armL,armR};
}

// игрок
const noob = makeNoob();
scene.add(noob.g);
const player = {x:0,y:0,z:8};
let camYaw = Math.atan2(hx-0, hz-8), pitch=0.5;
let vy=0, grounded=true, flyMode=false, speed=5;
let weapon=null, attackT=0, attackCd=0, walkT=0;

// NPC-нубики
const npcs=[];
const n1 = makeNoob(); n1.g.position.set(4,0,6); n1.g.rotation.y=2.2; scene.add(n1.g); npcs.push({o:n1,t:Math.random()*9});
const n2 = makeNoob(0xb03a2e,0x555a63); n2.g.position.set(20,0,7); n2.g.rotation.y=-1.4; scene.add(n2.g); npcs.push({o:n2,t:2});

// ===== оружие в мире =====
function makeSwordModel(){
  const g=new THREE.Group();
  const m=c=>new THREE.MeshLambertMaterial({color:c});
  const blade=new THREE.Mesh(new THREE.BoxGeometry(0.09,1.0,0.03), m(0xdfe6ee)); blade.position.y=0.75; blade.castShadow=true; g.add(blade);
  const guard=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.08,0.09), m(0xcfa63a)); guard.position.y=0.26; g.add(guard);
  const grip=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.3,0.08), m(0x4a2c14)); grip.position.y=0.08; g.add(grip);
  return g;
}
function makePistolModel(){
  const g=new THREE.Group();
  const m=c=>new THREE.MeshLambertMaterial({color:c});
  const body=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.16,0.4), m(0x3a3f45)); body.position.set(0,0.1,0.05); body.castShadow=true; g.add(body);
  const grip=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.26,0.12), m(0x2b2f33)); grip.position.set(0,-0.08,-0.12); grip.rotation.x=0.3; g.add(grip);
  return g;
}
const worldWeapons=[];
function spawnWeapon(type,x,z){
  const g = type==='sword'?makeSwordModel():makePistolModel();
  g.position.set(x,0.55,z); scene.add(g);
  worldWeapons.push({type,g,x,z,ph:Math.random()*6});
}
spawnWeapon('sword', 8, 2);
spawnWeapon('pistol', 18, 4);

// рукоять в руке
let handItem=null;
function attachWeapon(type){
  if(handItem){ noob.armR.remove(handItem); handItem=null; }
  if(!type) return;
  const g = type==='sword'?makeSwordModel():makePistolModel();
  g.position.set(0,-0.7,0.18);
  noob.armR.add(g);
  handItem=g;
}

// ===== чат и команды =====
const feed=document.getElementById('feed');
function msg(t){
  const d=document.createElement('div'); d.className='m'; d.textContent=t;
  feed.appendChild(d);
  while(feed.children.length>8) feed.firstChild.remove();
  setTimeout(()=>{ d.style.opacity='0'; setTimeout(()=>d.remove(),500); },7000);
}
const inp=document.getElementById('chat');
function send(){
  const text=inp.value.trim(); inp.value=''; inp.blur();
  if(!text) return;
  if(text[0]==='/'){ command(text); } else { msg('Вы: '+text); }
}
inp.addEventListener('keydown', e=>{
  e.stopPropagation();
  if(e.key==='Enter') send();
  if(e.key==='Escape') inp.blur();
});
function toggleFly(){
  flyMode=!flyMode; vy=0;
  msg(flyMode?'✈ Полёт включён':'Полёт выключен');
  document.getElementById('bUp').style.display = flyMode?'flex':'none';
  document.getElementById('bDown').style.display = flyMode?'flex':'none';
  document.getElementById('bJump').style.display = flyMode?'none':'flex';
}
function command(t){
  const parts=t.slice(1).split(/\s+/);
  const cmd=parts[0].toLowerCase();
  if(cmd==='help'){
    msg('/fly — полёт | /tp x z — телепорт | /speed 1-20 — скорость');
    msg('/give sword|pistol — выдать оружие | /clear — очистить чат');
  } else if(cmd==='fly'){ toggleFly(); }
  else if(cmd==='tp'){
    const x=parseFloat(parts[1]), z=parseFloat(parts[2]);
    if(isNaN(x)||isNaN(z)){ msg('/tp x z — пример: /tp 10 5'); return; }
    player.x=x; player.z=z; player.y=0; vy=0; msg('Телепорт: '+x+', '+z);
  } else if(cmd==='speed'){
    const s=parseFloat(parts[1]);
    if(isNaN(s)){ msg('/speed 1-20'); return; }
    speed=Math.max(1,Math.min(20,s)); msg('Скорость: '+speed);
  } else if(cmd==='give'){
    const w=parts[1]&&parts[1].toLowerCase();
    if(w==='sword'||w==='pistol'){ weapon=w; attachWeapon(w); document.getElementById('wlbl').textContent='Оружие: '+(w==='sword'?'меч':'пистолет'); msg('Выдано: '+w); }
    else msg('/give sword или /give pistol');
  } else if(cmd==='clear'){ feed.innerHTML=''; }
  else msg('Неизвестная команда. Напиши /help');
}

// ===== управление =====
const keys={};
addEventListener('keydown', e=>{
  if(document.activeElement===inp) return;
  if(e.code==='Enter'){ inp.focus(); e.preventDefault(); return; }
  keys[e.code]=true;
  if(e.code==='Space') e.preventDefault();
  if(e.code==='KeyF') toggleFly();
});
addEventListener('keyup', e=>{ keys[e.code]=false; });

let joyId=null, lookId=null, joy={ox:0,oy:0,dx:0,dy:0}, lx=0, ly=0;
const joyBase=document.getElementById('joyBase'), joyStick=document.getElementById('joyStick');
canvas.addEventListener('pointerdown', e=>{
  if(e.clientX<innerWidth/2 && joyId===null){
    joyId=e.pointerId; joy={ox:e.clientX,oy:e.clientY,dx:0,dy:0};
    joyBase.style.display='block'; joyStick.style.display='block';
    joyBase.style.left=(e.clientX-55)+'px'; joyBase.style.top=(e.clientY-55)+'px';
    joyStick.style.left=(e.clientX-24)+'px'; joyStick.style.top=(e.clientY-24)+'px';
  } else if(lookId===null){ lookId=e.pointerId; lx=e.clientX; ly=e.clientY; }
});
addEventListener('pointermove', e=>{
  if(e.pointerId===joyId){
    let dx=e.clientX-joy.ox, dy=e.clientY-joy.oy;
    const l=Math.hypot(dx,dy); if(l>55){ dx*=55/l; dy*=55/l; }
    joy.dx=dx; joy.dy=dy;
    joyStick.style.left=(joy.ox+dx-24)+'px'; joyStick.style.top=(joy.oy+dy-24)+'px';
  }
  if(e.pointerId===lookId){
    camYaw -= (e.clientX-lx)*0.006;
    pitch = Math.max(-0.15, Math.min(1.25, pitch + (e.clientY-ly)*0.004));
    lx=e.clientX; ly=e.clientY;
  }
});
function endPtr(e){ if(e.pointerId===joyId){ joyId=null; joy.dx=0; joy.dy=0; joyBase.style.display='none'; joyStick.style.display='none'; } if(e.pointerId===lookId) lookId=null; }
addEventListener('pointerup', endPtr); addEventListener('pointercancel', endPtr);

let flyUp=false, flyDown=false;
function bindBtn(id,down,up){
  const b=document.getElementById(id);
  b.addEventListener('pointerdown', e=>{ e.preventDefault(); down(); });
  if(up) b.addEventListener('pointerup', up), b.addEventListener('pointercancel', up), b.addEventListener('pointerleave', up);
}
bindBtn('bJump', ()=>{ if(!flyMode && grounded){ vy=6.5; grounded=false; } });
bindBtn('bFly', toggleFly);
bindBtn('bAttack', ()=>{ attack(); });
bindBtn('bUp', ()=>{ flyUp=true; }, ()=>{ flyUp=false; });
bindBtn('bDown', ()=>{ flyDown=true; }, ()=>{ flyDown=false; });

function attack(){
  if(attackCd>0) return;
  attackCd=0.4; attackT=0.35;
}

// приветствие
msg('Добро пожаловать! Вертись как хочешь — работает и вертикально, и горизонтально 🙂');
msg('WASD или джойстик — ходьба, Space — прыжок, F или ✈ — полёт');
msg('Подойди к оружию на карте, чтобы взять его. Enter — чат, /help — команды');

// ===== цикл =====
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);

  // ввод движения
  let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  let iz=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
  if(joyId!==null){ ix+=joy.dx/55; iz+=-joy.dy/55; }
  const il=Math.hypot(ix,iz); if(il>1){ ix/=il; iz/=il; }

  const fx=Math.sin(camYaw), fz=Math.cos(camYaw);
  const rx=-Math.cos(camYaw), rz=Math.sin(camYaw);
  const wx=fx*iz+rx*ix, wz=fz*iz+rz*ix;

  // ходьба с коллизиями (по осям)
  const nx=player.x+wx*speed*dt;
  if(!collideAt(nx,player.y,player.z)) player.x=nx;
  const nz=player.z+wz*speed*dt;
  if(!collideAt(player.x,player.y,nz)) player.z=nz;

  // вертикаль
  if(flyMode){
    let ud=(keys.Space?1:0)-(keys.ShiftLeft||keys.KeyC?1:0);
    if(flyUp) ud=1; if(flyDown) ud=-1;
    player.y=Math.max(0,Math.min(60,player.y+ud*7*dt));
    grounded=false;
  } else {
    vy-=18*dt;
    const ny=player.y+vy*dt;
    if(ny<=0){ player.y=0; vy=0; grounded=true; }
    else if(collideAt(player.x,ny,player.z)){ if(vy<0){ grounded=true; } vy=0; }
    else player.y=ny;
  }

  // анимация нубика
  const moving=il>0.1;
  walkT += dt*(moving?9:0);
  const sw=moving?Math.sin(walkT)*0.7:0;
  noob.legL.rotation.x=sw; noob.legR.rotation.x=-sw;
  noob.armL.rotation.x=-sw*0.8;
  if(attackT>0){ attackT-=dt; noob.armR.rotation.x=Math.sin((1-attackT/0.35)*Math.PI)*2.0; }
  else noob.armR.rotation.x=sw*0.8;
  noob.g.position.set(player.x,player.y,player.z);
  noob.g.rotation.y=camYaw;

  // NPC машут
  for(const n of npcs){ n.t+=dt; n.o.armR.rotation.x=Math.sin(n.t*2)*0.9+1.2; }

  // оружие в мире: вращение и подбор
  for(let i=worldWeapons.length-1;i>=0;i--){
    const w=worldWeapons[i];
    w.ph+=dt*2; w.g.rotation.y+=dt*2;
    w.g.position.y=0.55+Math.sin(w.ph)*0.1;
    const d=Math.hypot(player.x-w.x,player.z-w.z);
    if(d<1.5 && Math.abs(player.y-w.g.position.y)<2.5){
      scene.remove(w.g); worldWeapons.splice(i,1);
      weapon=w.type; attachWeapon(w.type);
      document.getElementById('wlbl').textContent='Оружие: '+(w.type==='sword'?'меч':'пистолет');
      msg('Взял: '+(w.type==='sword'?'⚔ меч':'🔫 пистолет'));
    }
  }

  if(attackCd>0) attackCd-=dt;

  // камера
  const cy=Math.cos(pitch), sy=Math.sin(pitch);
  camera.position.set(player.x-Math.sin(camYaw)*cy*6, player.y+1.7+sy*6, player.z-Math.cos(camYaw)*cy*6);
  camera.lookAt(player.x, player.y+1.5, player.z);

  renderer.render(scene,camera);
}
addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
animate();
</script>
</body>
</html>
