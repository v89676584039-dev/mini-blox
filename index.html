<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Blox</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#87ceeb;font-family:Arial,Helvetica,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;}
  canvas{display:block;}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}
  #ui *{pointer-events:auto;}
  #topbar{position:absolute;top:8px;left:8px;display:flex;gap:8px;align-items:center;}
  #kills{background:rgba(0,0,0,.45);color:#fff;padding:6px 12px;border-radius:10px;font-weight:bold;font-size:16px;}
  #badge{background:linear-gradient(135deg,#ffd700,#ff9d00);color:#5a3a00;padding:6px 12px;border-radius:10px;font-weight:bold;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.3);}
  #topbtns{position:absolute;top:8px;right:8px;display:flex;gap:8px;}
  .topbtn{width:44px;height:44px;border:none;border-radius:12px;font-size:20px;background:rgba(0,0,0,.5);color:#fff;cursor:pointer;}
  #hint{position:absolute;top:60px;left:8px;background:rgba(0,0,0,.45);color:#fff;padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.5;max-width:240px;transition:opacity .5s;}
  #hotbar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;}
  .slot{width:56px;height:56px;border-radius:12px;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;cursor:pointer;transition:transform .1s;}
  .slot span{position:absolute;top:2px;left:6px;font-size:11px;color:#fff;opacity:.8;}
  .slot.sel{border-color:#ffd700;background:rgba(60,50,0,.6);transform:scale(1.12);}
  #adminPanel{position:absolute;top:60px;right:8px;background:rgba(20,20,30,.92);border-radius:14px;padding:10px;display:none;grid-template-columns:1fr 1fr;gap:6px;width:230px;box-shadow:0 4px 16px rgba(0,0,0,.4);}
  #adminPanel.open{display:grid;}
  #adminPanel h4{grid-column:1/3;margin:0 0 4px;color:#ffd700;font-size:13px;text-align:center;}
  .abtn{padding:8px 4px;border:none;border-radius:8px;background:#3a4a6a;color:#fff;font-size:12px;cursor:pointer;}
  .abtn:active{background:#5a7aaa;}
  .abtn.on{background:#2e9e4f;}
  #chatLog{position:absolute;left:8px;bottom:150px;display:flex;flex-direction:column;gap:3px;max-width:70vw;}
  .cmsg{background:rgba(0,0,0,.5);color:#fff;padding:4px 10px;border-radius:8px;font-size:13px;opacity:1;transition:opacity .6s;}
  #chatInput{position:absolute;left:8px;bottom:118px;width:220px;padding:8px;border-radius:8px;border:none;display:none;font-size:14px;}
  /* мобильное управление */
  #mobileUI{display:none;}
  body.touch #mobileUI{display:block;}
  body.touch #hint{max-width:200px;font-size:11px;}
  #joyZone{position:absolute;left:0;bottom:0;width:45vw;height:45vh;max-width:340px;pointer-events:auto;}
  #joyBase{position:absolute;left:28px;bottom:28px;width:120px;height:120px;border-radius:50%;background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.35);}
  #joyKnob{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.6);}
  #btnJump,#btnDown,#btnAttack{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.4);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;}
  #btnJump{right:24px;bottom:96px;}
  #btnDown{right:24px;bottom:24px;display:none;}
  #btnAttack{right:104px;bottom:40px;background:rgba(200,40,40,.55);}
  body.touch #hotbar{bottom:130px;}
  body.touch #chatLog{bottom:210px;}
  body.touch #chatInput{bottom:180px;}

  /* ---------- МЕНЮ ---------- */
  #menu{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 800px at 20% 10%,#1b2a55 0%,#0b1020 55%,#05070f 100%);overflow:hidden;}
  #menu .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;}
  #menu .b1{width:340px;height:340px;background:#2f6bff;top:-80px;left:-60px;animation:fl 9s ease-in-out infinite alternate;}
  #menu .b2{width:280px;height:280px;background:#8a3cff;bottom:-70px;right:-40px;animation:fl 11s ease-in-out infinite alternate-reverse;}
  #menu .b3{width:220px;height:220px;background:#00c2a8;top:55%;left:60%;animation:fl 13s ease-in-out infinite alternate;}
  @keyframes fl{from{transform:translate(0,0) scale(1);}to{transform:translate(40px,-30px) scale(1.15);}}
  #card{position:relative;width:min(400px,92vw);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
    border-radius:24px;padding:28px 26px;backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(0,0,0,.5);}
  #card h1{margin:0 0 4px;color:#fff;font-size:30px;letter-spacing:1px;text-align:center;}
  #card h1 span{background:linear-gradient(90deg,#4d8dff,#a45bff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #card p.sub{margin:0 0 20px;color:#9aa7c7;font-size:13px;text-align:center;}
  #card label{display:block;color:#9aa7c7;font-size:12px;margin:0 0 6px 4px;}
  .fld{width:100%;box-sizing:border-box;padding:13px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.06);color:#fff;font-size:15px;outline:none;margin-bottom:12px;}
  .fld:focus{border-color:#4d8dff;background:rgba(255,255,255,.09);}
  .mbtn{width:100%;box-sizing:border-box;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:bold;
    cursor:pointer;margin-bottom:10px;transition:transform .08s, filter .15s;}
  .mbtn:active{transform:scale(.97);}
  .mbtn.primary{background:linear-gradient(90deg,#2f6bff,#5a4dff);color:#fff;box-shadow:0 6px 18px rgba(47,107,255,.4);}
  .mbtn.good{background:linear-gradient(90deg,#1fa855,#2ecc71);color:#fff;box-shadow:0 6px 18px rgba(46,204,113,.35);}
  .mbtn.ghost{background:rgba(255,255,255,.08);color:#dbe4ff;border:1px solid rgba(255,255,255,.18);}
  #codeRow{display:flex;gap:8px;align-items:center;}
  #roomCodeBox{display:none;margin-top:4px;}
  #roomCode{flex:1;text-align:center;font-size:24px;font-weight:bold;letter-spacing:6px;color:#ffd75b;
    background:rgba(255,215,91,.08);border:1px dashed rgba(255,215,91,.5);border-radius:12px;padding:10px;}
  #copyBtn{width:46px;height:46px;border:none;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-size:18px;cursor:pointer;}
  #menuErr{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(255,70,70,.15);
    border:1px solid rgba(255,90,90,.45);color:#ffb3b3;font-size:12.5px;word-break:break-word;}
  #buildTag{position:absolute;top:12px;right:14px;color:#5f6f96;font-size:11px;letter-spacing:1px;}
  #playersRow{display:none;margin:2px 0 12px;color:#9fd8ff;font-size:13px;text-align:center;}
</style>
</head>
<body>
<div id="menu">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div id="buildTag">BUILD 3.5</div>
  <div id="card">
    <h1>MINI <span>BLOX</span></h1>
    <p class="sub">sandbox multiplayer &middot; free admin</p>
    <label for="nick">Nickname</label>
    <input class="fld" id="nick" maxlength="12" placeholder="Noob123" autocomplete="off">
    <button class="mbtn primary" id="btnSolo">▶&nbsp; PLAY SOLO</button>
    <button class="mbtn good" id="btnCreate">👥&nbsp; CREATE ROOM</button>
    <div id="playersRow"></div>
    <div class="fld" id="roomCodeBox" style="display:flex;gap:8px;align-items:center;">
      <div id="roomCode" style="flex:1;">----</div>
      <button id="copyBtn" title="Copy code">📋</button>
    </div>
    <label for="joinCode">Room code (to join a friend)</label>
    <div id="codeRow">
      <input class="fld" id="joinCode" maxlength="4" placeholder="e.g. 7KQ2" style="margin-bottom:0;text-transform:uppercase;letter-spacing:4px;">
    </div>
    <button class="mbtn ghost" id="btnJoin">🔗&nbsp; JOIN ROOM</button>
    <div id="menuErr"></div>
  </div>
</div>
<div id="ui">
  <div id="topbar"><div id="kills">💀 Kills: 0</div><div id="badge">FREE ADMIN 💎</div><div id="pcount" style="background:rgba(0,0,0,.45);color:#9fd8ff;padding:6px 12px;border-radius:10px;font-weight:bold;font-size:16px;">👤 1</div></div>
  <div id="topbtns">
    <button class="topbtn" id="btnChat" title="Chat (T)">💬</button>
    <button class="topbtn" id="btnAdmin" title="Admin panel (K)">⚙️</button>
  </div>
  <div id="hint"></div>
  <div id="hotbar">
    <div class="slot sel" data-w="0"><span>1</span>🗡️</div>
    <div class="slot" data-w="1"><span>2</span>🔫</div>
    <div class="slot" data-w="2"><span>3</span>🚀</div>
  </div>
  <div id="adminPanel">
    <h4>FREE ADMIN PANEL 💎</h4>
    <button class="abtn" id="aFly">✈️ Fly</button>
    <button class="abtn" id="aGod">🛡️ Godmode</button>
    <button class="abtn" id="aSpeed">🏃 Speed ×2</button>
    <button class="abtn" id="aJump">🦘 Jump ×2</button>
    <button class="abtn" id="aBig">➕ Bigger</button>
    <button class="abtn" id="aReset">↩️ Reset</button>
    <button class="abtn" id="aSpawn">🧟 Dummies</button>
    <button class="abtn" id="aKillall">☠️ Kill all</button>
    <button class="abtn" id="aRain">🌧️ Rain</button>
    <button class="abtn" id="aNight">🌙 Night</button>
    <button class="abtn" id="aDisco">🪩 Disco</button>
    <button class="abtn" id="aTp">📍 Spawn</button>
  </div>
  <div id="chatLog"></div>
  <input id="chatInput" placeholder="Message or ;help" maxlength="100">
  <div id="mobileUI">
    <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
    <div id="btnAttack">⚔️</div>
    <div id="btnJump">⬆️</div>
    <div id="btnDown">⬇️</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
// ================== МИНИ-РОБЛОКС ==================
const W = () => window.innerWidth, H = () => window.innerHeight;
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouch) document.body.classList.add('touch');

let scene, camera, renderer, clock, sun, ambient;
let kills = 0;
let disco = false, nightOn = false, rainOn = false, rainPts = null;
const discoMats = [];

// ---------- игрок ----------
const player = {
  g: null, armR: null, armL: null, legR: null, legL: null,
  pos: new THREE.Vector3(0, 0, 0), vel: new THREE.Vector3(),
  yaw: 0, onGround: true, speed: 8, jumpVel: 9, size: 1,
  god: false, fly: false, walkPhase: 0
};
let camYaw = 0, camPitch = 0.35, camDist = 9;
let weapons = [], curWeapon = 0, atkCd = 0, atkAnim = 0;
let dummies = [], bullets = [], fx = [];

// ---------- сцена ----------
function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 80, 220);
  camera = new THREE.PerspectiveCamera(70, W()/H(), 0.1, 500);
  renderer = new THREE.WebGLRenderer({ antialias: !isTouch });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(W(), H());
  document.body.appendChild(renderer.domElement);
  clock = new THREE.Clock();

  ambient = new THREE.AmbientLight(0xffffff, 0.55); scene.add(ambient);
  sun = new THREE.DirectionalLight(0xfff2cc, 0.9);
  sun.position.set(40, 60, 20);
  if (!isTouch) { sun.castShadow = true; sun.shadow.mapSize.set(1024,1024);
    const s=60; sun.shadow.camera.left=-s; sun.shadow.camera.right=s; sun.shadow.camera.top=s; sun.shadow.camera.bottom=-s; }
  scene.add(sun);
  window.addEventListener('resize', () => {
    camera.aspect = W()/H(); camera.updateProjectionMatrix();
    renderer.setSize(W(), H());
  });
}

function studTex(base, stud) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0,0,128,128);
  x.fillStyle = stud;
  for (let i=0;i<2;i++) for (let j=0;j<2;j++) {
    x.beginPath(); x.arc(32+i*64, 32+j*64, 20, 0, 7); x.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

const groundMat = new THREE.MeshLambertMaterial({ color: 0x58b04a });
const plateMat  = new THREE.MeshLambertMaterial({ color: 0x9aa3a8 });

function buildWorld() {
  // земля-трава
  const grass = new THREE.Mesh(new THREE.BoxGeometry(220, 2, 220), groundMat);
  grass.position.y = -1; scene.add(grass);
  discoMats.push(groundMat);
  // серая базплейт со шпильками
  const tex = studTex('#9aa3a8', '#aeb6bb'); tex.repeat.set(20, 20);
  plateMat.map = tex;
  const plate = new THREE.Mesh(new THREE.BoxGeometry(64, 0.6, 64), plateMat);
  plate.position.y = 0.01; scene.add(plate);
  discoMats.push(plateMat);
  // дорожки
  const pathM = new THREE.MeshLambertMaterial({ color: 0xb9a27c });
  [[0,0,36,3],[0,0,3,36]].forEach((p,i) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(p[2],0.12,p[3]), pathM);
    m.position.set(0, 0.32, 0); scene.add(m);
  });

  // домик (детализированный, с коллизией)
  const house = new THREE.Group();
  const wallM = new THREE.MeshLambertMaterial({ color: 0xe8d5a3 });
  [[0,2,3.2,0.4,6],[0,2,-3.2,0.4,6],[3.2,2,0,6,0.4],[-3.2,2,0,6,0.4]].forEach(w => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w[3],4,w[4]), wallM);
    m.position.set(w[0],2,w[2]); house.add(m);
  });
  // окна с рамами и стеклом
  const winM = new THREE.MeshLambertMaterial({ color: 0x9fd8ff });
  const frameM = new THREE.MeshLambertMaterial({ color: 0x6b4326 });
  [[2,1.8,3.16],[-2,1.8,3.16],[-3.16,1.8,1.2],[-3.16,1.8,-1.2]].forEach(p => {
    const onSide = Math.abs(p[0]) > 3;
    const w = new THREE.Mesh(new THREE.BoxGeometry(1,1,0.1), winM);
    w.position.set(p[0],p[1],p[2]); house.add(w);
    const hbar = new THREE.Mesh(new THREE.BoxGeometry(onSide?0.14:1.15, 0.1, onSide?1.15:0.14), frameM);
    hbar.position.set(p[0],p[1],p[2]); house.add(hbar);
    const vbar = new THREE.Mesh(new THREE.BoxGeometry(onSide?0.1:0.12, 1.15, onSide?1.15:0.1), frameM);
    vbar.position.set(p[0],p[1],p[2]); house.add(vbar);
  });
  const doorM = new THREE.MeshLambertMaterial({ color: 0x6b4326 });
  const door = new THREE.Mesh(new THREE.BoxGeometry(1.2,2.4,0.15), doorM);
  door.position.set(0,1.2,3.15); house.add(door);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.06,8,6), new THREE.MeshLambertMaterial({color:0xffd75b}));
  knob.position.set(0.4,1.2,3.25); house.add(knob);
  // двускатная крыша с коньком и фронтонами
  const roofM = new THREE.MeshLambertMaterial({ color: 0xb03a2e });
  const r1 = new THREE.Mesh(new THREE.BoxGeometry(4.6,0.35,7.6), roofM);
  r1.position.set(-1.7,4.6,0); r1.rotation.z = 0.62; house.add(r1);
  const r2 = r1.clone(); r2.position.x = 1.7; r2.rotation.z = -0.62; house.add(r2);
  const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.35,7.7), new THREE.MeshLambertMaterial({color:0x8a2b21}));
  ridge.position.y = 5.75; house.add(ridge);
  const g1 = new THREE.Mesh(new THREE.BoxGeometry(0.3,1.4,6), wallM);
  g1.position.set(-3.05,5.2,0); g1.rotation.z = 0.62; house.add(g1);
  const g2 = g1.clone(); g2.position.x = 3.05; g2.rotation.z = -0.62; house.add(g2);
  // труба
  const chim = new THREE.Mesh(new THREE.BoxGeometry(0.7,1.4,0.7), new THREE.MeshLambertMaterial({color:0x9a5a3a}));
  chim.position.set(1.6,6.2,-1.5); house.add(chim);
  const chimTop = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.2,0.9), new THREE.MeshLambertMaterial({color:0x6e4026}));
  chimTop.position.set(1.6,6.95,-1.5); house.add(chimTop);
  // крыльцо: площадка, столбы, навес, ступеньки
  const porchM = new THREE.MeshLambertMaterial({ color: 0xa8845a });
  const porch = new THREE.Mesh(new THREE.BoxGeometry(3.2,0.3,2), porchM);
  porch.position.set(0,0.65,4.2); house.add(porch);
  [[-1.3,4.95],[1.3,4.95]].forEach(p => {
    const col = new THREE.Mesh(new THREE.BoxGeometry(0.25,2.6,0.25), porchM);
    col.position.set(p[0],1.9,p[1]); house.add(col);
  });
  const awn = new THREE.Mesh(new THREE.BoxGeometry(3.4,0.2,2.4), new THREE.MeshLambertMaterial({color:0xb03a2e}));
  awn.position.set(0,3.3,4.2); awn.rotation.x = -0.18; house.add(awn);
  const st1 = new THREE.Mesh(new THREE.BoxGeometry(2.4,0.2,0.7), porchM);
  st1.position.set(0,0.4,5.4); house.add(st1);
  const st2 = st1.clone(); st2.position.set(0,0.2,5.95); house.add(st2);
  house.position.set(20, 0.3, -16); house.rotation.y = -0.5;
  scene.add(house);
  house.updateMatrixWorld(true);
  // коллайдеры стен (с проёмом двери) — в мировых координатах
  hw.forEach(w => {
    if (w[2] === 3.2) { // передняя стена: два сегмента с проёмом двери
      addBoxCollider(house, new THREE.Box3(new THREE.Vector3(-3.6,0,2.9), new THREE.Vector3(-0.7,4,3.5)));
      addBoxCollider(house, new THREE.Box3(new THREE.Vector3(0.7,0,2.9), new THREE.Vector3(3.6,4,3.5)));
    } else {
      const tmp = new THREE.Mesh(new THREE.BoxGeometry(w[3],4,w[4]));
      tmp.position.set(w[0],2,w[2]);
      tmp.updateMatrixWorld(true);
      addBoxCollider(house, new THREE.Box3().setFromObject(tmp));
    }
  });
  // крыльцо — по нему можно ходить
  const porchBB = new THREE.Box3(new THREE.Vector3(-1.6,0,3.2), new THREE.Vector3(1.6,0.8,5.2));
  addBoxCollider(house, porchBB);

  // ПАРКУР вместо пруда: полоса препятствий
  buildParkour();

  // лес
  const trunkM = new THREE.MeshLambertMaterial({ color: 0x7a4f28 });
  const leafM  = new THREE.MeshLambertMaterial({ color: 0x2f8f36 });
  for (let i=0;i<48;i++) {
    const a = Math.random()*Math.PI*2;
    const r = 42 + Math.random()*55;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    const s = 0.8 + Math.random()*1.2;
    const t = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.7,2.6,0.7), trunkM);
    trunk.position.y = 1.3; t.add(trunk);
    const l1 = new THREE.Mesh(new THREE.BoxGeometry(3,2.4,3), leafM);
    l1.position.y = 3.6; t.add(l1);
    const l2 = new THREE.Mesh(new THREE.BoxGeometry(2,1.8,2), leafM);
    l2.position.y = 5.4; t.add(l2);
    t.position.set(x,0,z); t.scale.setScalar(s);
    t.rotation.y = Math.random()*Math.PI;
    scene.add(t);
    colliders.push({ x1:x-0.45*s, x2:x+0.45*s, z1:z-0.45*s, z2:z+0.45*s, y1:0, y2:2.6*s });
  }
  // камни, кусты, цветы
  for (let i=0;i<14;i++) addRock((Math.random()-0.5)*160, (Math.random()-0.5)*160, 0.4+Math.random()*1.2);
  const bushM = new THREE.MeshLambertMaterial({ color: 0x3aa045 });
  for (let i=0;i<20;i++) {
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.7+Math.random()*0.6,8,6), bushM);
    const a = Math.random()*7, r = 20+Math.random()*70;
    b.position.set(Math.cos(a)*r, 0.4, Math.sin(a)*r);
    b.scale.y = 0.7; scene.add(b);
  }
  const colM = [0xff5b5b,0xffd75b,0xc95bff,0xff9ad5,0xfff86b];
  for (let i=0;i<30;i++) {
    const f = new THREE.Group();
    const st = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.5), new THREE.MeshLambertMaterial({color:0x2f8f36}));
    st.position.y = 0.25; f.add(st);

  const mouth = mk(0.3,0.05,0.02, 0x111111); mouth.position.set(0,2.0,0.39); g.add(mouth);

function makeHealthBar() {

  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  sp.scale.set(1.4, 0.22, 1);
  sp.userData = { canvas: c, tex };
  return sp;
}
function updateBar(d) {
  const c = d.bar.userData.canvas, x = c.getContext('2d');
  x.fillStyle = '#222'; x.fillRect(0,0,64,8);
  const r = Math.max(0, d.hp/d.maxHp);
  x.fillStyle = r > 0.5 ? '#3f3' : (r > 0.25 ? '#fd3' : '#f44');
  x.fillRect(1,1,62*r,6);
  d.bar.userData.tex.needsUpdate = true;
}

function spawnDummy(x, z) {
  const h = buildHumanoid({ head:0x9d9d9d, torso:0x6f6f6f, arms:0x9d9d9d, legs:0x555555 });
  h.armR.rotation.x = Math.PI; h.armL.rotation.x = Math.PI; // руки вверх, классика
  const bar = makeHealthBar(); bar.position.y = 2.9; h.g.add(bar);
  const d = { ...h, hp:100, maxHp:100, bar, dead:false, deadT:0, dir:Math.random()*7, t:1+Math.random()*3,
    kv: new THREE.Vector3(), pos: new THREE.Vector3(x||((Math.random()-0.5)*70), 0, z||((Math.random()-0.5)*70)) };
  h.g.position.copy(d.pos);
  scene.add(h.g); dummies.push(d); updateBar(d);
  return d;
}

function damageDummy(d, dmg, from) {
  if (d.dead) return;
  d.hp -= dmg;
  const kb = d.pos.clone().sub(from).setY(0).normalize().multiplyScalar(6);
  d.kv.copy(kb);
  updateBar(d);
  if (d.hp <= 0) {
    d.dead = true; d.deadT = 3; kills++;
    document.getElementById('kills').textContent = '💀 Kills: ' + kills;
  }
}

function updateDummies(dt) {
  dummies.forEach(d => {
    if (d.dead) {
      d.deadT -= dt;
      d.g.rotation.x = Math.min(d.g.rotation.x + dt*3, Math.PI/2);
      if (d.deadT <= 0) {
        d.dead = false; d.hp = d.maxHp; d.g.rotation.x = 0;
        d.pos.set((Math.random()-0.5)*70, 0, (Math.random()-0.5)*70);
        updateBar(d);
      }
    } else {
      d.t -= dt;
      if (d.t <= 0) { d.dir = Math.random()*Math.PI*2; d.t = 2 + Math.random()*4; d.walk = Math.random() < 0.7; }
      if (d.walk !== false) {
        const sp = 2;
        d.pos.x += Math.sin(d.dir)*sp*dt;
        d.pos.z += Math.cos(d.dir)*sp*dt;
        d.g.rotation.y = d.dir;
        d.walkPhase = (d.walkPhase||0) + dt*8;
      }
      d.pos.clampScalar(-95, 95);
      d.pos.add(d.kv.clone().multiplyScalar(dt*2));
      d.kv.multiplyScalar(0.9);
      d.g.position.copy(d.pos);
    }
  });
}

function attack() {
  if (atkCd > 0 || chatOpen) return;
  atkAnim = 0.4;
  const fwd = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
  player.yaw = Math.atan2(fwd.x, fwd.z);
  const w = weapons[curWeapon].name;
  if (w === 'sword') {
    atkCd = 0.5;
    dummies.forEach(d => {
      if (d.dead) return;
      const to = d.pos.clone().sub(player.pos).setY(0);
      if (to.length() < 3.4 && to.normalize().dot(fwd) > 0.25) damageDummy(d, 40, player.pos);
    });
    netPlayers.forEach(rp => {
      if (rp.dead) return;
      const to = rp.pos.clone().sub(player.pos).setY(0);
      if (to.length() < 3.4 && to.normalize().dot(fwd) > 0.25) hitRemote(rp.id, 40, player.pos);
    });
  } else if (w === 'pistol') {
    atkCd = 0.25;
    fireBullet(fwd, 0.12, 45, 25, 0xffe25b);
  } else {
    atkCd = 1.2;
    fireBullet(fwd, 0.2, 22, 0, 0xd94a3a, true);
  }
}

function fireBullet(fwd, s, spd, dmg, color, isRocket) {
  const mesh = isRocket
    ? new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.5,8), new THREE.MeshLambertMaterial({color}))
    : new THREE.Mesh(new THREE.BoxGeometry(s,s,s*2), new THREE.MeshLambertMaterial({color}));
  const start = player.pos.clone().add(new THREE.Vector3(0, 1.5, 0)).add(fwd.clone().multiplyScalar(1));
  mesh.position.copy(start);
  if (isRocket) mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), fwd);
  scene.add(mesh);
  bullets.push({ mesh, vel: fwd.clone().multiplyScalar(spd).add(new THREE.Vector3(0, isRocket?3:0, 0)), dmg, rocket: !!isRocket, life: 3, from: player.pos.clone() });
}

function explode(pos, fromPlayer) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(1,12,10),
    new THREE.MeshBasicMaterial({ color: 0xffa640, transparent: true, opacity: 0.85 }));
  m.position.copy(pos); scene.add(m);
  fx.push({ mesh: m, t: 0 });
  dummies.forEach(d => {
    if (d.dead) return;
    const dist = d.pos.distanceTo(pos);
    if (dist < 5.5) damageDummy(d, Math.round(70*(1-dist/6)), pos);
  });
  netPlayers.forEach(rp => {
    if (rp.dead) return;
    const rd = rp.pos.distanceTo(pos);
    if (rd < 5.5) hitRemote(rp.id, Math.round(70*(1-rd/6)), pos);
  });
  const pd = player.pos.distanceTo(pos);
  if (pd < 6 && !player.god) {
    const kb = player.pos.clone().sub(pos).setY(0).normalize().multiplyScalar(10);
    player.vel.x += kb.x; player.vel.z += kb.z; player.vel.y = Math.max(player.vel.y, 7);
  } else if (pd < 6) {
    const kb = player.pos.clone().sub(pos).setY(0).normalize().multiplyScalar(10);
    player.vel.x += kb.x; player.vel.z += kb.z;
  }
}

function updateBullets(dt) {
  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;
    b.mesh.position.add(b.vel.clone().multiplyScalar(dt));
    if (!b.rocket) b.vel.y -= 12*dt;
    let hit = false;
    for (const d of dummies) {
      if (d.dead) continue;
      if (b.mesh.position.distanceTo(d.pos.clone().add(new THREE.Vector3(0,1.4,0))) < (b.rocket?1.4:0.9)) {
        if (b.rocket) explode(b.mesh.position.clone(), false);
        else damageDummy(d, b.dmg, b.from);
        hit = true; break;
      }
    }
    if (!hit) {
      for (const [id, rp] of netPlayers) {
        if (rp.dead) continue;
        if (b.mesh.position.distanceTo(rp.pos.clone().add(new THREE.Vector3(0,1.4,0))) < (b.rocket?1.4:0.9)) {
          if (b.rocket) explode(b.mesh.position.clone(), false);
          else hitRemote(id, b.dmg, b.from);
          hit = true; break;
        }
      }
    }
    if (!hit && b.mesh.position.y < 0.05 && b.rocket) { explode(b.mesh.position.clone(), false); hit = true; }
    if (hit || b.life <= 0) { scene.remove(b.mesh); bullets.splice(i,1); }
  }
  for (let i = fx.length-1; i >= 0; i--) {
    const e = fx[i]; e.t += dt;
    e.mesh.scale.setScalar(1 + e.t*8);
    e.mesh.material.opacity = Math.max(0, 0.85 - e.t*1.4);
    if (e.t > 0.6) { scene.remove(e.mesh); fx.splice(i,1); }
  }
}

function setupMouse() {
  const el = renderer.domElement;
  el.addEventListener('mousedown', e => { mouseDown = true; mouseMoved = 0; mx = e.clientX; my = e.clientY; });
  window.addEventListener('mousemove', e => {
    if (!mouseDown) return;
    const dx = e.clientX - mx, dy = e.clientY - my;
    mouseMoved += Math.abs(dx) + Math.abs(dy);
    camYaw += dx*0.005; camPitch = Math.min(1.2, Math.max(0.05, camPitch + dy*0.005));
    mx = e.clientX; my = e.clientY;
  });
  window.addEventListener('mouseup', () => {
    if (mouseDown && mouseMoved < 6) attack();
    mouseDown = false;
  });
  // тач-камера: один палец — поворот, два — поворот + зум (как в Roblox)
  const camPts = new Map();
  el.addEventListener('touchstart', e => {
    for (const t of e.changedTouches) {
      if (t.clientX > W()*0.3 && camPts.size < 2) {
        camPts.set(t.identifier, { x: t.clientX, y: t.clientY });
      }
    }
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      const p = camPts.get(t.identifier);
      if (!p) continue;
      p.nx = t.clientX; p.ny = t.clientY;
    }
    if (camPts.size === 2) {
      const pts = [...camPts.values()];
      if (pts[0].nx === undefined || pts[1].nx === undefined) return;
      const before = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const after  = Math.hypot(pts[0].nx - pts[1].nx, pts[0].ny - pts[1].ny);
      if (before > 0) camDist = Math.min(26, Math.max(3, camDist * before/after));
      const mx0 = (pts[0].x+pts[1].x)/2, my0 = (pts[0].y+pts[1].y)/2;
      const mx1 = (pts[0].nx+pts[1].nx)/2, my1 = (pts[0].ny+pts[1].ny)/2;
      camYaw += (mx1 - mx0)*0.006;
      camPitch = Math.min(1.2, Math.max(0.05, camPitch + (my1 - my0)*0.006));
    } else {
      const p = camPts.values().next().value;
      if (p.nx !== undefined) {
        camYaw += (p.nx - p.x)*0.006;
        camPitch = Math.min(1.2, Math.max(0.05, camPitch + (p.ny - p.y)*0.006));
        p.x = p.nx; p.y = p.ny;
      }
    }
    for (const p of camPts.values()) { p.x = p.nx ?? p.x; p.y = p.ny ?? p.y; }
  }, { passive: true });
  const camEnd = e => {
    for (const t of e.changedTouches) camPts.delete(t.identifier);
  };
  el.addEventListener('touchend', camEnd);
  el.addEventListener('touchcancel', camEnd);
  // колесо мыши — зум на ПК
  el.addEventListener('wheel', e => {
    e.preventDefault();
    camDist = Math.min(26, Math.max(3, camDist + Math.sign(e.deltaY)*0.9));
  }, { passive: false });
}

function setupJoystick() {
  const zone = document.getElementById('joyZone');
  const base = document.getElementById('joyBase');
  const knob = document.getElementById('joyKnob');
  let bid = null;
  const setKnob = (dx, dy) => {
    const max = 44;
    const len = Math.min(max, Math.hypot(dx, dy));
    const a = Math.atan2(dy, dx);
    knob.style.left = (38 + Math.cos(a)*len) + 'px';
    knob.style.top  = (38 + Math.sin(a)*len) + 'px';
    joystick.x = Math.cos(a)*len/max;
    joystick.y = Math.sin(a)*len/max;
  };
  const getXY = t => {
    const r = base.getBoundingClientRect();
    return [t.clientX - (r.left + r.width/2), t.clientY - (r.top + r.height/2)];
  };
  const placeBase = t => {
    const zx = zone.getBoundingClientRect();
    const cx = Math.max(zx.left + 64, Math.min(t.clientX, zx.right - 64));
    const cy = Math.max(zx.top + 64, Math.min(t.clientY, zx.bottom - 64));
    base.style.left = (cx - 64) + 'px';
    base.style.bottom = 'auto';
    base.style.top = (cy - 64) + 'px';
  };
  zone.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    bid = t.identifier; joystick.active = true;
    placeBase(t);
    setKnob(...getXY(t));
  });
  zone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === bid) setKnob(...getXY(t));
  });
  const end = e => {
    for (const t of e.changedTouches) if (t.identifier === bid) {
      bid = null; joystick.active = false; joystick.x = joystick.y = 0;
      base.style.left = '28px'; base.style.top = 'auto'; base.style.bottom = '28px';
      knob.style.left = '38px'; knob.style.top = '38px';
    }
  };
  zone.addEventListener('touchend', end);
  zone.addEventListener('touchcancel', end);

  const bind = (id, down, up) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); down(); }, { passive: false });
    if (up) { el.addEventListener('touchend', up); el.addEventListener('touchcancel', up); }
  };
  bind('btnJump', () => keys['Space'] = true, () => keys['Space'] = false);
  bind('btnDown', () => keys['ShiftLeft'] = true, () => keys['ShiftLeft'] = false);
  bind('btnAttack', () => attack());
}

function closeChat() {

function runCmd(s) {
  const parts = s.slice(1).trim().split(/\s+/);
  const c = parts[0].toLowerCase();
  const n = parseFloat(parts[1]);
  const cl = (v,a,b) => Math.min(b, Math.max(a, v));
  switch (c) {
    case 'help':
      chatMsg('Commands: ;fly ;god ;speed N ;jump N ;size N ;tp X Z ;rain ;night ;day ;disco ;killall ;spawn N ;reset', '#ffd700');
      break;
    case 'fly': setFly(!player.fly); break;
    case 'god': player.god = !player.god; syncAdmin(); chatMsg('Godmode: ' + (player.god ? 'ON' : 'off')); break;
    case 'speed': if (n) { player.speed = cl(n, 0.5, 12); chatMsg('Speed: ' + player.speed); } break;
    case 'jump': if (n) { player.jumpVel = cl(n, 4, 25); chatMsg('Jump: ' + player.jumpVel); } break;
    case 'size': if (n) setSize(cl(n, 0.4, 3)); break;
    case 'tp': if (!isNaN(n)) player.pos.set(cl(n, -90, 90), 0, cl(parseFloat(parts[2])||0, -90, 90)); break;
    case 'rain': if (!rainOn) toggleRain(); chatMsg('Rain enabled 🌧️'); break;
    case 'night': if (!nightOn) toggleNight(); break;
    case 'day': if (nightOn) toggleNight(); break;
    case 'disco': setDisco(!disco); break;
    case 'killall': dummies.forEach(d => damageDummy(d, 9999, player.pos)); chatMsg('Kill all done ☠️'); break;
    case 'spawn': { const k = cl(Math.round(n||1), 1, 10); for (let i=0;i<k;i++) if (dummies.length < 30) spawnDummy(); chatMsg('Spawned dummies: ' + k); break; }
    case 'reset': player.speed = 8; player.jumpVel = 9; setSize(1); setFly(false); player.god = false; syncAdmin(); chatMsg('Settings reset'); break;
    default: chatMsg('Unknown command. Type ;help');
  }
}
document.getElementById('chatInput').addEventListener('keydown', e => {

    const v = e.target.value.trim();
    if (v) {

// ---------- обновление игрока ----------
function updatePlayer(dt) {
  let ix = 0, iy = 0;
  if (!chatOpen) {
    if (keys['KeyW'] || keys['ArrowUp']) iy += 1;
    if (keys['KeyS'] || keys['ArrowDown']) iy -= 1;
    if (keys['KeyA'] || keys['ArrowLeft']) ix -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) ix += 1;
    if (joystick.active) { ix = joystick.x; iy = -joystick.y; }
  }
  const len = Math.hypot(ix, iy);
  if (len > 1) { ix /= len; iy /= len; }

  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw);
  const rx = -fz, rz = fx;
  const spd = player.speed * player.size;
  player.vel.x = (fx*iy + rx*ix) * spd;
  player.vel.z = (fz*iy + rz*ix) * spd;

  if (player.fly) {
    let vy = 0;
    if (keys['Space']) vy = spd;
    if (keys['ShiftLeft'] || keys['ShiftRight']) vy = -spd;
    player.vel.y = vy;
    player.pos.y += player.vel.y * dt;
    if (player.pos.y < 0) { player.pos.y = 0; }
  } else {
    if (keys['Space'] && player.onGround) {
      player.vel.y = player.jumpVel * Math.sqrt(player.size);
      player.onGround = false;
    }
    player.vel.y -= 25*dt;
    player.pos.y += player.vel.y*dt;
    if (player.pos.y <= groundY) { player.pos.y = groundY; player.vel.y = 0; player.onGround = true; }
  }
  // --- коллизии с декорациями и платформами ---
  const R = 0.45*player.size, head = player.pos.y + 1.95*player.size;
  const feet = player.pos.y;
  const hitsAt = (px, pz) => colliders.some(c =>
    px + R > c.x1 && px - R < c.x2 && pz + R > c.z1 && pz - R < c.z2 &&
    c.y1 < head - 0.05 && c.y2 > feet + 0.35);
  const tryX = player.pos.x + player.vel.x*dt;
  if (!hitsAt(tryX, player.pos.z)) player.pos.x = tryX;
  const tryZ = player.pos.z + player.vel.z*dt;
  if (!hitsAt(player.pos.x, tryZ)) player.pos.z = tryZ;
  player.pos.x = Math.min(95, Math.max(-95, player.pos.x));
  player.pos.z = Math.min(95, Math.max(-95, player.pos.z));
  // земля: самая высокая платформа под ногами (или 0)
  let groundY = 0;
  for (const c of colliders) {
    if (player.pos.x + R > c.x1 && player.pos.x - R < c.x2 &&
        player.pos.z + R > c.z1 && player.pos.z - R < c.z2 &&
        c.y2 <= feet + 0.35 && c.y2 > groundY) groundY = c.y2;
  }

  if (len > 0.05) {
    const target = Math.atan2(player.vel.x, player.vel.z);
    let d = target - player.yaw;
    while (d > Math.PI) d -= Math.PI*2;
    while (d < -Math.PI) d += Math.PI*2;
    player.yaw += d * Math.min(1, dt*12);
    player.walkPhase += dt * 10 * Math.min(1.5, len);
  } else player.walkPhase *= 0.8;

  player.g.position.copy(player.pos);
  player.g.rotation.y = player.yaw;

  // анимация
  const sw = Math.sin(player.walkPhase) * Math.min(1, len+0.01);
  if (!player.onGround && !player.fly) {
    player.legR.rotation.x = -0.7; player.legL.rotation.x = 0.4;
    player.armL.rotation.x = -0.8;
    if (atkAnim <= 0) player.armR.rotation.x = -2.6;
  } else {
    player.legR.rotation.x = sw*0.8; player.legL.rotation.x = -sw*0.8;
    player.armL.rotation.x = -sw*0.7;
    if (atkAnim <= 0) player.armR.rotation.x = sw*0.7;
  }
  if (atkAnim > 0) {
    atkAnim -= dt;
    const t = 1 - Math.max(0, atkAnim)/0.4;
    player.armR.rotation.x = -2.8 * Math.sin(t*Math.PI);
  }
  if (atkCd > 0) atkCd -= dt;

  // камера
  const cp = Math.cos(camPitch);
  camera.position.set(
    player.pos.x + Math.sin(camYaw)*camDist*cp,
    player.pos.y + 2.2 + Math.sin(camPitch)*camDist,
    player.pos.z + Math.cos(camYaw)*camDist*cp
  );
  camera.lookAt(player.pos.x, player.pos.y + 2*player.size, player.pos.z);
}

// ---------- сеть ----------
let myId = 'HOST';
const netPlayers = new Map();
function netSend(msg, exceptConn) {
  if (!peer) return;
  conns.forEach(c => { if (c.open && c !== exceptConn) c.send(msg); });
}
function colorFor(name) {
  let h = 0; for (let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  return [0xd94a3a,0x3a7bd5,0x2ecc71,0xc95bff,0xff9d3a,0x2fb3c9,0xe84393][h % 7];
}
function makeNameplate(name) {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
  const x = cv.getContext('2d');
  x.fillStyle = 'rgba(0,0,0,0.45)'; x.fillRect(48,4,160,52);
  x.font = 'bold 30px Arial'; x.fillStyle = '#fff'; x.textAlign = 'center';
  x.fillText(name.slice(0,12), 128, 41);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false }));
  sp.scale.set(2.6, 0.65, 1);
  return sp;
}
function addRemotePlayer(id, name, shirt) {
  if (netPlayers.has(id) || id === myId) return;
  const h = buildHumanoid({ head:0xf5cf30, torso:shirt || colorFor(name), arms:0xf5cf30, legs:0x3aa346 });
  const np = makeNameplate(name); np.position.y = 3.0; h.g.add(np);
  const bar = makeHealthBar(); bar.position.y = 3.4; h.g.add(bar);
  const rp = { id, name, g: h.g, armR: h.armR, armL: h.armL, legR: h.legR, legL: h.legL,
    pos: new THREE.Vector3(0,0,0), yaw: 0, ph: 0, len: 0, hp: 100, bar, dead: false };
  scene.add(h.g);
  netPlayers.set(id, rp);
  updateBar({ bar, hp: 100, maxHp: 100 });
  document.getElementById('pcount').textContent = '👤 ' + (1 + netPlayers.size);
  chatMsg(name + ' joined the game', '#9fd8ff');
}
function removeRemotePlayer(id) {
  const rp = netPlayers.get(id);
  if (rp) { scene.remove(rp.g); netPlayers.delete(id);
    document.getElementById('pcount').textContent = '👤 ' + (1 + netPlayers.size);
    chatMsg(rp.name + ' left the game', '#ff9d9d'); }
}
function broadcastState() {
  if (menuOpen || !peer) return;
  netSend({ t:'state', id:myId, name:myName, x:+player.pos.x.toFixed(2), y:+player.pos.y.toFixed(2),
    z:+player.pos.z.toFixed(2), yaw:+player.yaw.toFixed(2), ph:+player.walkPhase.toFixed(1),
    len:+(Math.hypot(player.vel.x, player.vel.z)/player.speed).toFixed(2), w:curWeapon,
    hp:player.hp, dead:player.dead });
}
setInterval(broadcastState, 100);

function hitRemote(id, dmg, from) {
  const rp = netPlayers.get(id);
  if (rp) { rp.hp -= dmg; updateBar({ bar: rp.bar, hp: Math.max(0,rp.hp), maxHp: 100 }); }
  netSend({ t:'hit', target:id, dmg, fx:from.x, fz:from.z, by:myId });
}
function damageLocal(dmg, from) {
  if (player.god || player.dead) return;
  player.hp -= dmg;
  updateBar({ bar: player.myBar, hp: Math.max(0, player.hp), maxHp: player.maxHp });
  if (from) {
    const kb = player.pos.clone().sub(new THREE.Vector3(from.x, 0, from.z)).setY(0).normalize().multiplyScalar(6);
    player.vel.x += kb.x; player.vel.z += kb.z;
  }
  if (player.hp <= 0) {
    player.dead = true; player.deaths++; player.deadT = 3;
    player.g.visible = false;
    netSend({ t:'dead', id:myId, by:arguments[2] || '' });
    chatMsg(myName + ' died 💀', '#ff9d9d');
  }
}
function broadcastChat(msg) {
  netSend({ t:'chat', name:myName, msg });
}

function wireConn(conn) {
  conn.on('open', () => {
    conns.push(conn);
    if (netMode() === 'host') {
      conn.send({ t:'hello', name:myName });
      conn.send({ t:'world', night:nightOn, rain:rainOn });
    } else conn.send({ t:'hello', name:myName });
  });
  conn.on('data', d => onData(d, conn));
  conn.on('close', () => {
    const idx = conns.indexOf(conn); if (idx >= 0) conns.splice(idx,1);
    for (const id of netPlayers.keys()) if (id === conn.peer) removeRemotePlayer(id);
    document.getElementById('pcount').textContent = '👤 ' + (1 + netPlayers.size);
  });
}
function netMode() { return peer && peer.id && peer.id.startsWith('mbx-') ? 'host' : (peer ? 'guest' : 'off'); }

function onData(d, conn) {
  if (!d || !d.t) return;
  switch (d.t) {
    case 'hello':
      if (netMode() === 'host') addRemotePlayer(conn.peer, d.name || 'Guest');
      break;
    case 'state': {
      if (d.id === myId) break;
      if (!netPlayers.has(d.id)) addRemotePlayer(d.id, d.name || 'Player');
      const rp = netPlayers.get(d.id);
      if (rp) {
        rp.pos.set(d.x, d.y, d.z); rp.yaw = d.yaw; rp.ph = d.ph; rp.len = d.len;
        if (!rp.dead && rp.hp !== d.hp) { rp.hp = d.hp; updateBar({ bar: rp.bar, hp: Math.max(0,d.hp), maxHp: 100 }); }
        if (rp.dead !== d.dead) { rp.dead = d.dead; rp.g.visible = !d.dead; }
        rp.g.position.copy(rp.pos); rp.g.rotation.y = rp.yaw;
        if (d.w !== undefined && rp.w !== d.w) { rp.w = d.w; setRemoteWeapon(rp, d.w); }
      }
      if (netMode() === 'host' && d.id !== myId) netSend(d, conn);
      break; }
    case 'chat':
      chatMsg((d.name || '?') + ': ' + d.msg, '#ffffff');
      if (netMode() === 'host') netSend(d, conn);
      break;
    case 'hit':
      if (d.target === myId) damageLocal(d.dmg, { x:d.fx, z:d.fz }, d.by || conn.peer);
      if (netMode() === 'host') netSend(d, conn);
      break;
    case 'dead': {
      const victim = netPlayers.get(d.id);
      if (victim) { victim.dead = true; victim.g.visible = false;
        setTimeout(() => { if (netPlayers.has(d.id)) { victim.dead = false; victim.g.visible = true; victim.pos.set(0,0,0); } }, 3000); }
      if (d.by === myId) { kills++; document.getElementById('kills').textContent = '💀 Kills: ' + kills; }
      if (netMode() === 'host') netSend(d, conn);
      break; }
    case 'wep': {
      const wp = netPlayers.get(d.id);
      if (wp) setRemoteWeapon(wp, d.w);
      if (netMode() === 'host') netSend(d, conn);
      break; }
    case 'world':
      if (netMode() === 'guest') {
        if (d.night !== nightOn) toggleNight();
        if (d.rain !== rainOn) toggleRain();
      }
      break;
  }
}
function setRemoteWeapon(rp, w) {
  // у удалённых игроков просто анимация руки при смене — визуальное оружие не синхронизируем для простоты
}
// анимация удалённых игроков без своих состояний
setInterval(() => {
  netPlayers.forEach(rp => {
    if (rp.dead) return;
    rp.ph += 0.25;
    const sw = Math.sin(rp.ph) * Math.min(1, Math.abs(rp.len)+0.01);
    rp.legR.rotation.x = sw*0.8; rp.legL.rotation.x = -sw*0.8;
    rp.armL.rotation.x = -sw*0.7; rp.armR.rotation.x = sw*0.7;
  });
}, 80);

// ---------- синхронизация оружия/мира ----------
const _origSetWeapon = setWeapon;
setWeapon = function(i) { _origSetWeapon(i); if (peer) netSend({ t:'wep', id:myId, w:i }); };
const _origToggleRain = toggleRain;
toggleRain = function() { _origToggleRain(); if (netMode() === 'host') netSend({ t:'world', night:nightOn, rain:rainOn }); };
const _origToggleNight = toggleNight;
toggleNight = function() { _origToggleNight(); if (netMode() === 'host') netSend({ t:'world', night:nightOn, rain:rainOn }); };

(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, clock.getDelta());
  updatePlayer(dt);
  updateDummies(dt);
  updateBullets(dt);
  updateRain(dt);
  updateDisco(dt);
  clouds.forEach(c => { c.position.x += c.userData.spd*dt; if (c.position.x > 110) c.position.x = -110; });
  renderer.render(scene, camera);
})();
</script>
