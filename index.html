<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MINI BLOX</title>
<style>
:root{--acc:#00a2ff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#0b0f1a;}
canvas{display:block;touch-action:none;}
#menu{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;overflow:hidden;
background:linear-gradient(160deg,#0b1224 0%,#101b36 55%,#0b1224 100%);}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:fl 12s ease-in-out infinite alternate;}
.b1{width:420px;height:420px;background:#0066ff;top:-140px;left:-120px;}
.b2{width:380px;height:380px;background:#00c3a5;bottom:-140px;right:-100px;animation-delay:-6s;}
@keyframes fl{from{transform:translate(0,0) scale(1);}to{transform:translate(60px,40px) scale(1.15);}}
.card{position:relative;z-index:2;background:rgba(255,255,255,.07);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);
border-radius:26px;padding:32px 28px;width:min(92vw,380px);color:#fff;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.55);}
.logo{font-size:42px;font-weight:900;letter-spacing:3px;}
.logo span{color:var(--acc);}
.sub{color:#9fb3d1;font-size:13px;margin:6px 0 22px;letter-spacing:.5px;}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.35);
color:#fff;font-size:15px;outline:none;margin-bottom:10px;text-align:center;font-family:inherit;}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(0,162,255,.25);}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;
color:#fff;font-family:inherit;letter-spacing:.5px;transition:transform .12s,filter .12s;margin-bottom:10px;}
.btn:active{transform:scale(.96);}
.primary{background:linear-gradient(135deg,#00a2ff,#0057ff);}
.ghost{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)!important;}
.row{display:flex;gap:8px;}
.row input{margin-bottom:10px;}
.row .btn{width:auto;padding:13px 18px;margin:0;}
.hr{color:#5c6f8d;font-size:11px;letter-spacing:2px;margin:8px 0 10px;text-transform:uppercase;}
#menuStatus{min-height:20px;color:#ffd76a;font-size:13px;margin-top:6px;}
.hint{color:#6d81a3;font-size:11px;margin-top:14px;line-height:1.7;}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99;background:rgba(0,0,0,.75);color:#fff;
padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:80vw;}
#toast.show{opacity:1;}
#hud{display:none;position:fixed;inset:0;z-index:10;pointer-events:none;}
#hud>*{pointer-events:auto;}
.chip{position:fixed;background:rgba(10,16,30,.65);backdrop-filter:blur(8px);color:#fff;border-radius:12px;
padding:8px 14px;font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.12);}
#frags{top:12px;left:12px;}
#roomChip{top:12px;left:50%;transform:translateX(-50%);cursor:pointer;display:none;}
#btnChat{top:12px;right:68px;width:44px;height:44px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
#btnAdmin{top:12px;right:12px;width:44px;height:44px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(0,162,255,.75);}
#cross{position:fixed;top:50%;left:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.4);pointer-events:none;}
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:#dfe8f5;font-size:12px;background:rgba(10,16,30,.55);
padding:6px 14px;border-radius:10px;animation:fade 1s 8s forwards;pointer-events:none;white-space:nowrap;}
@keyframes fade{to{opacity:0;}}
#hotbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;}
.slot{width:56px;height:56px;border-radius:14px;background:rgba(10,16,30,.65);border:2px solid rgba(255,255,255,.15);
display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:22px;cursor:pointer;backdrop-filter:blur(8px);}
.slot small{font-size:9px;color:#9fb3d1;margin-top:2px;}
.slot.active{border-color:var(--acc);background:rgba(0,162,255,.28);transform:translateY(-4px);}
#chatLog{position:fixed;left:12px;bottom:86px;width:270px;max-height:150px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;font-size:13px;}
#chatLog div{background:rgba(10,16,30,.6);color:#fff;padding:4px 10px;border-radius:8px;width:fit-content;max-width:100%;word-break:break-word;}
.csys{color:#ffd76a!important;}.ckill{color:#ff8f6b!important;}
#chatWrap{display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:min(90vw,420px);}
#chatInput{width:100%;padding:12px 16px;border-radius:12px;border:2px solid var(--acc);background:rgba(0,0,0,.7);color:#fff;font-size:14px;text-align:left;}
#adminPanel{display:none;position:fixed;right:12px;top:70px;width:216px;background:rgba(10,16,30,.85);backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:12px;z-index:20;}
#adminPanel h4{color:#fff;font-size:13px;letter-spacing:1px;margin-bottom:10px;display:flex;justify-content:space-between;}
#adminPanel h4 span{cursor:pointer;color:#9fb3d1;}
.abtn{display:block;width:100%;padding:9px;margin-bottom:7px;border:none;border-radius:10px;background:rgba(255,255,255,.1);
color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
.abtn.on{background:var(--acc);}
.abtn.warn{background:rgba(255,80,80,.55);}
.mbtn{position:fixed;width:64px;height:64px;border-radius:50%;background:rgba(10,16,30,.6);border:2px solid rgba(255,255,255,.25);
color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;touch-action:none;}
#btnJump{right:22px;bottom:104px;}
#btnAttack{right:100px;bottom:26px;width:76px;height:76px;background:rgba(220,60,60,.65);font-size:30px;}
#btnUp,#btnDown{display:none;}
#btnUp{right:22px;bottom:190px;}
#btnDown{right:22px;bottom:34px;}
#joy{position:fixed;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.3);display:none;z-index:5;pointer-events:none;}
#joyKnob{position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.5);left:32px;top:32px;}
@media (max-width:760px){#hint{display:none;}#chatLog{width:220px;bottom:150px;}}
</style>
</head>
<body>
<div id="menu">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="card">
    <div class="logo">MINI <span>BLOX</span></div>
    <div class="sub">online blocky sandbox &middot; free admin</div>
    <input id="nickInput" maxlength="14" placeholder="Nickname">
    <button id="btnSolo" class="btn ghost">PLAY SOLO</button>
    <div class="hr">or multiplayer</div>
    <button id="btnCreate" class="btn primary">CREATE ROOM</button>
    <div class="row">
      <input id="codeInput" maxlength="4" placeholder="ROOM CODE" style="text-transform:uppercase">
      <button id="btnJoin" class="btn primary">JOIN</button>
    </div>
    <div id="menuStatus"></div>
    <div class="hint" id="menuHint">WASD move &middot; drag mouse look &middot; click attack<br>T chat &middot; K admin &middot; 1-3 weapons</div>
  </div>
</div>
<div id="toast"></div>
<div id="hud">
  <div class="chip" id="frags">FRAGS: 0</div>
  <div class="chip" id="roomChip">ROOM</div>
  <div class="chip" id="btnChat">&#128172;</div>
  <div class="chip" id="btnAdmin">&#9881;</div>
  <div id="cross"></div>
  <div id="hint">WASD move &middot; drag mouse to look &middot; click to attack &middot; T chat &middot; K admin</div>
  <div id="hotbar">
    <div class="slot" data-w="0">&#128737;<small>1</small></div>
    <div class="slot" data-w="1">&#128299;<small>2</small></div>
    <div class="slot" data-w="2">&#128640;<small>3</small></div>
  </div>
  <div id="chatLog"></div>
  <div id="chatWrap"><input id="chatInput" placeholder="Message or ;help for commands" maxlength="120"></div>
  <div id="adminPanel">
    <h4>FREE ADMIN <span id="admClose">&#10005;</span></h4>
    <button class="abtn" id="aFly">FLY</button>
    <button class="abtn" id="aGod">GOD MODE</button>
    <button class="abtn" id="aSpeed">SPEED x2</button>
    <button class="abtn" id="aJump">JUMP x2</button>
    <button class="abtn" id="aGrow">GROW +</button>
    <button class="abtn" id="aShrink">SHRINK -</button>
    <button class="abtn" id="aSpawn">SPAWN DUMMY</button>
    <button class="abtn warn" id="aKill">KILL ALL DUMMIES</button>
    <button class="abtn" id="aRain">RAIN</button>
    <button class="abtn" id="aNight">NIGHT</button>
    <button class="abtn" id="aDisco">DISCO</button>
    <button class="abtn" id="aTp">TP TO SPAWN</button>
  </div>
  <div id="joy"><div id="joyKnob"></div></div>
  <div class="mbtn" id="btnJump">&#11014;</div>
  <div class="mbtn" id="btnAttack">&#9876;</div>
  <div class="mbtn" id="btnUp">&#11014;</div>
  <div class="mbtn" id="btnDown">&#11015;</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

'use strict';
/* ============ helpers ============ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const isMobile=/Android|iPhone|iPad|Mobi/i.test(navigator.userAgent);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600);}
function menuStatus(s,ok){const el=$('menuStatus');if(!el)return;el.textContent=s;el.style.color=ok?'#7cfc9b':'#ffd76a';}

/* ============ global state ============ */
const net={mode:'solo',host:false,peer:null,conn:null,conns:[],states:{},myId:'',room:''};
let scene,camera,renderer,clock,T=0;
const view={yaw:0,pitch:5};
const player={pos:null,vy:0,hp:100,frags:0,dead:false,deadT:0,weapon:0,lastAtk:0,atkT:0,swing:0,grounded:true,speed:1,jumpMul:1,scale:1,walkPhase:0,lastHurt:-99};
const admin={fly:false,god:false,speedStep:0,jumpStep:0};
const colliders=[],dummies=[],projectiles=[],tracers=[],booms=[],clouds=[];
let rainGroup=null,discoInt=null,nightOn=false,rainOn=false;
const keys={};
const joy={active:false,id:null,cx:0,cy:0,x:0,y:0};
const look={id:null,x:0,y:0};
let chatOpen=false;
const REMOTE_COLORS=[0xe74c3c,0x2ecc71,0xf1c40f,0x9b59b6,0xe67e22,0x1abc9c,0xfd79a8];

/* ============ menu wiring (attached FIRST so buttons always work) ============ */
function launchGame(mode,room){
  try{
    nick=($('nickInput').value||'').trim().slice(0,14)||('Player'+Math.floor(rand(100,999)));
    net.mode=mode;net.room=room||'';
    $('menu').style.display='none';$('hud').style.display='block';
    if(!isMobile){$('menuHint').innerHTML='WASD move &middot; drag mouse look &middot; click attack<br>T chat &middot; K admin &middot; 1-3 weapons';}
    initGame();
    if(mode==='host')initHost(room);
    else if(mode==='client')initClient();
  }catch(e){menuStatus('Error: '+e.message,false);$('menu').style.display='flex';}
}
$('btnSolo').onclick=()=>{if(!window.THREE)return menuStatus('3D engine not loaded - check internet',false);launchGame('solo');};
function loadPeerJS(cb){
  if(window.Peer)return cb();
  menuStatus('Loading network library...',true);
  const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
  s.onload=()=>cb();s.onerror=()=>menuStatus('Could not load PeerJS - check internet',false);
  document.head.appendChild(s);
}
$('btnCreate').onclick=()=>{
  if(!window.THREE)return menuStatus('3D engine not loaded - check internet',false);
  loadPeerJS(()=>tryHost());
};
$('btnJoin').onclick=()=>{
  if(!window.THREE)return menuStatus('3D engine not loaded - check internet',false);
  const code=($('codeInput').value||'').trim().toUpperCase();
  if(code.length!==4)return menuStatus('Enter the 4-symbol room code',false);
  loadPeerJS(()=>tryJoin(code));
};
let hostRetries=0;
function makeRoomCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:4},()=>c[Math.floor(Math.random()*c.length)]).join('');}
function tryHost(){
  hostRetries=0;tryHostOnce();
}
function tryHostOnce(){
  menuStatus('Creating room...',true);
  const code=makeRoomCode();
  let p;
  try{p=new Peer(code);}catch(e){return menuStatus('Network error',false);}
  net.peer=p;
  p.on('open',()=>launchGame('host',code));
  p.on('error',e=>{
    if(e&&e.type==='unavailable-id'&&hostRetries<5){hostRetries++;tryHostOnce();}
    else menuStatus('Network error: '+(e&&e.type||'unknown'),false);
  });
}
function tryJoin(code){
  menuStatus('Connecting to '+code+'...',true);
  let p;
  try{p=new Peer();}catch(e){return menuStatus('Network error',false);}
  net.peer=p;
  const to=setTimeout(()=>{if(net.mode!=='client')menuStatus('Room not found - check the code',false);},9000);
  p.on('open',()=>{
    const c=p.connect(code);
    net.conn=c;
    c.on('data',handleClientData);
    c.on('open',()=>{clearTimeout(to);launchGame('client',code);});
  });
  p.on('error',e=>{
    if(e&&e.type==='peer-unavailable'){clearTimeout(to);menuStatus('Room not found - check the code',false);}
    else menuStatus('Network error: '+(e&&e.type||'unknown'),false);
  });
}

/* ============ game init ============ */
function initGame(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x87ceeb);
  scene.fog=new THREE.Fog(0x87ceeb,70,240);
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,500);
  renderer=new THREE.WebGLRenderer({antialias:!isMobile});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,isMobile?1.5:2));
  renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);
  if(!isMobile){renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;}
  clock=new THREE.Clock();
  const hemi=new THREE.HemisphereLight(0xffffff,0x668833,0.95);scene.add(hemi);
  const dir=new THREE.DirectionalLight(0xffffff,0.9);dir.position.set(40,70,25);
  if(!isMobile){dir.castShadow=true;dir.shadow.camera.left=-70;dir.shadow.camera.right=70;dir.shadow.camera.top=70;dir.shadow.camera.bottom=-70;}
  scene.add(dir);
  window.__hemi=hemi;window.__dir=dir;
  buildWorld();
  buildPlayer();
  for(let i=0;i<10;i++)spawnDummy();
  bindInput();
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  if(net.mode==='solo'){$('roomChip').style.display='none';toast('Solo mode - enjoy!');}
  else{$('roomChip').style.display='block';$('roomChip').textContent='ROOM '+net.room+' (tap to copy)';}
  if(isMobile)$('hint').style.display='none';
  addChat('System','Welcome, '+nick+'! Type ;help for commands.');
  animate();
}
function updFrags(){$('frags').textContent='FRAGS: '+player.frags;}

/* ============ world ============ */
function studTexture(){
  const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  g.fillStyle='#63b74a';g.fillRect(0,0,64,64);
  g.fillStyle='rgba(255,255,255,0.18)';g.beginPath();g.arc(32,32,14,0,7);g.fill();
  g.fillStyle='rgba(0,0,0,0.07)';g.beginPath();g.arc(34,35,14,0,7);g.fill();
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(60,60);return t;
}
function buildWorld(){
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),new THREE.MeshLambertMaterial({map:studTexture()}));
  ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
  const pad=new THREE.Mesh(new THREE.CylinderGeometry(6,6,0.3,32),new THREE.MeshLambertMaterial({color:0xf2f2f2}));
  pad.position.y=0.15;pad.receiveShadow=true;scene.add(pad);
  const ring=new THREE.Mesh(new THREE.CylinderGeometry(6.4,6.4,0.15,32),new THREE.MeshLambertMaterial({color:0x00a2ff}));
  ring.position.y=0.08;scene.add(ring);
  for(let i=0;i<48;i++){
    const a=rand(0,Math.PI*2),r=rand(28,105),x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(Math.hypot(x-30,z+25)<14||Math.hypot(x+38,z-22)<15)continue;
    buildTree(x,z);
  }
  for(let i=0;i<18;i++){
    const a=rand(0,Math.PI*2),r=rand(20,105),x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(Math.hypot(x-30,z+25)<12||Math.hypot(x+38,z-22)<14)continue;
    const s=rand(0.6,1.8);
    const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),new THREE.MeshLambertMaterial({color:0x8d939b}));
    rock.position.set(x,s*0.4,z);rock.rotation.set(rand(0,3),rand(0,3),rand(0,3));
    if(!isMobile)rock.castShadow=true;scene.add(rock);
    colliders.push({type:'c',x:x,z:z,r:s*0.9});
  }
  for(let i=0;i<26;i++){
    const a=rand(0,Math.PI*2),r=rand(15,105),x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(Math.hypot(x-30,z+25)<12||Math.hypot(x+38,z-22)<14)continue;
    const s=rand(0.5,1.1);
    const bush=new THREE.Mesh(new THREE.SphereGeometry(s,7,6),new THREE.MeshLambertMaterial({color:0x3f9b46}));
    bush.position.set(x,s*0.55,z);scene.add(bush);
  }
  for(let i=0;i<40;i++){
    const a=rand(0,Math.PI*2),r=rand(10,105),x=Math.cos(a)*r,z=Math.sin(a)*r;
    const st=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.4),new THREE.MeshLambertMaterial({color:0x3f9b46}));
    st.position.set(x,0.2,z);scene.add(st);
    const fl=new THREE.Mesh(new THREE.SphereGeometry(0.14,6,6),new THREE.MeshLambertMaterial({color:[0xff5f7e,0xffd23e,0xff8fd6,0xffffff][i%4]}));
    fl.position.set(x,0.45,z);scene.add(fl);
  }
  const pond=new THREE.Mesh(new THREE.CircleGeometry(9,28),new THREE.MeshLambertMaterial({color:0x3a86ff,transparent:true,opacity:0.85}));
  pond.rotation.x=-Math.PI/2;pond.position.set(-38,0.04,22);scene.add(pond);
  for(let i=0;i<12;i++){
    const a=i/12*Math.PI*2;
    const st=new THREE.Mesh(new THREE.DodecahedronGeometry(0.5,0),new THREE.MeshLambertMaterial({color:0x9aa0a6}));
    st.position.set(-38+Math.cos(a)*9.4,0.2,22+Math.sin(a)*9.4);scene.add(st);
  }
  const path=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.06,26),new THREE.MeshLambertMaterial({color:0xb9a27b}));
  path.position.set(15,0.04,-13);scene.add(path);
  buildHouse(30,-25);
  for(let i=0;i<7;i++)buildCloud(rand(-100,100),rand(32,48),rand(-100,100));
}
function buildTree(x,z){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.6,4,8),new THREE.MeshLambertMaterial({color:0x7a5230}));
  trunk.position.y=2;if(!isMobile)trunk.castShadow=true;g.add(trunk);
  const c1=new THREE.Mesh(new THREE.ConeGeometry(2.6,4.5,8),new THREE.MeshLambertMaterial({color:0x2e8b3d}));
  c1.position.y=5.4;if(!isMobile)c1.castShadow=true;g.add(c1);
  const c2=new THREE.Mesh(new THREE.ConeGeometry(1.9,3.5,8),new THREE.MeshLambertMaterial({color:0x36a349}));
  c2.position.y=7.6;g.add(c2);
  g.position.set(x,0,z);scene.add(g);
  colliders.push({type:'c',x:x,z:z,r:0.8});
}
function buildHouse(x,z){
  const g=new THREE.Group();
  const wm=new THREE.MeshLambertMaterial({color:0xd9b98c});
  const wall=(w,h,d,px,py,pz,col)=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),col||wm);
    m.position.set(px,py,pz);if(!isMobile)m.castShadow=true;m.receiveShadow=true;g.add(m);
    if(col===undefined)colliders.push({type:'b',x:x+px,z:z+pz,hx:w/2+0.1,hz:d/2+0.1});
  };
  wall(12,5,0.6,0,2.5,-4);
  wall(12,5,0.6,0,2.5,4);
  wall(0.6,5,7.4,-5.7,2.5,0);
  wall(0.6,5,7.4,5.7,2.5,0);
  wall(4,5,0.6,-4,2.5,4);
  wall(4,5,0.6,4,2.5,4);

/* ============ input ============ */
function bindInput(){
  document.addEventListener('keydown',e=>{
    if(chatOpen)return;
    keys[e.code]=true;
    if(e.code==='Space')e.preventDefault();
    if(e.code==='Digit1')selectWeapon(0);
    if(e.code==='Digit2')selectWeapon(1);
    if(e.code==='Digit3')selectWeapon(2);
    if(e.code==='KeyT'){openChat();e.preventDefault();}
    if(e.code==='KeyK')toggleAdmin();
    if(e.code==='Escape')$('adminPanel').style.display='none';
  });
  document.addEventListener('keyup',e=>{keys[e.code]=false;});
  const cv=renderer.domElement;
  let mDown=false,mStart={x:0,y:0},mDrag=false;
  cv.addEventListener('mousedown',e=>{if(chatOpen)return;mDown=true;mStart={x:e.clientX,y:e.clientY};mDrag=false;});
  addEventListener('mousemove',e=>{
    if(!mDown)return;
    const dx=e.clientX-mStart.x,dy=e.clientY-mStart.y;
    if(Math.abs(dx)+Math.abs(dy)>6)mDrag=true;
    if(mDrag){view.yaw-=dx*0.0045;view.pitch=clamp(view.pitch-dy*0.03,1.5,14);mStart={x:e.clientX,y:e.clientY};}
  });
  addEventListener('mouseup',e=>{
    if(mDown&&!mDrag&&!chatOpen&&e.target===cv)attack();
    mDown=false;
  });
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  /* touch: left half = joystick, right half = look */
  cv.addEventListener('touchstart',e=>{
    if(chatOpen)return;
    for(const t of e.changedTouches){
      if(t.clientX<innerWidth*0.45&&!joy.active){
        joy.active=true;joy.id=t.identifier;joy.cx=t.clientX;joy.cy=t.clientY;
        const j=$('joy');j.style.display='block';j.style.left=(t.clientX-55)+'px';j.style.top=(t.clientY-55)+'px';
        $('joyKnob').style.left='32px';$('joyKnob').style.top='32px';
      }else if(look.id===null){look.id=t.identifier;look.x=t.clientX;look.y=t.clientY;}
    }
    e.preventDefault();
  },{passive:false});
  cv.addEventListener('touchmove',e=>{
    for(const t of e.changedTouches){
      if(joy.active&&t.identifier===joy.id){
        let dx=(t.clientX-joy.cx)/45,dy=(t.clientY-joy.cy)/45;
        const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}
        joy.x=dx;joy.y=-dy;
        $('joyKnob').style.left=(32+dx*32)+'px';$('joyKnob').style.top=(32-dy*32)+'px';
      }else if(t.identifier===look.id){
        view.yaw-=(t.clientX-look.x)*0.006;
        view.pitch=clamp(view.pitch-(t.clientY-look.y)*0.05,1.5,14);
        look.x=t.clientX;look.y=t.clientY;
      }
    }
    e.preventDefault();
  },{passive:false});
  const endTouch=e=>{
    for(const t of e.changedTouches){
      if(t.identifier===joy.id){joy.active=false;joy.id=null;joy.x=joy.y=0;$('joy').style.display='none';}
      if(t.identifier===look.id)look.id=null;
    }
  };
  cv.addEventListener('touchend',endTouch);cv.addEventListener('touchcancel',endTouch);
  /* HUD buttons */
  document.querySelectorAll('.slot').forEach(s=>s.onclick=()=>selectWeapon(+s.dataset.w));
  const hold=(el,down,up)=>{
    el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();down();},{passive:false});
    el.addEventListener('touchend',e=>{e.preventDefault();if(up)up();},{passive:false});
    el.addEventListener('mousedown',e=>{e.stopPropagation();down();});
    if(up)el.addEventListener('mouseup',up);
  };
  hold($('btnJump'),()=>{keys.Space=true;},()=>{keys.Space=false;});
  hold($('btnAttack'),()=>attack());
  hold($('btnUp'),()=>{keys.ArrowUp2=true;},()=>{keys.ArrowUp2=false;});
  hold($('btnDown'),()=>{keys.ArrowDown2=true;},()=>{keys.ArrowDown2=false;});
  $('btnChat').onclick=()=>openChat();
  $('btnAdmin').onclick=()=>toggleAdmin();
  $('admClose').onclick=()=>toggleAdmin();
  $('roomChip').onclick=()=>{
    const c=net.room;
    const done=()=>toast('Room code copied: '+c);
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(c).then(done).catch(()=>{prompt('Room code:',c);});

}

/* ============ movement ============ */
function collide(){
  const p=player.pos,R=0.55*player.scale;
  for(const c of colliders){
    if(c.type==='c'){
      const dx=p.x-c.x,dz=p.z-c.z,d=Math.hypot(dx,dz);
      if(d<c.r+R&&d>0.001){const push=(c.r+R-d);p.x+=dx/d*push;p.z+=dz/d*push;}
    }else{
      const cx=clamp(p.x,c.x-c.hx,c.x+c.hx),cz=clamp(p.z,c.z-c.hz,c.z+c.hz);
      const dx=p.x-cx,dz=p.z-cz,d=Math.hypot(dx,dz);
      if(d<R){
        if(d>0.001){p.x+=dx/d*(R-d);p.z+=dz/d*(R-d);}
        else{
          const lx=c.hx-Math.abs(p.x-c.x),lz=c.hz-Math.abs(p.z-c.z);
          if(lx<lz)p.x+=Math.sign(p.x-c.x||1)*(lx+R);else p.z+=Math.sign(p.z-c.z||1)*(lz+R);
        }
      }
    }
  }
  const d=Math.hypot(p.x,p.z);
  if(d>115){p.x*=115/d;p.z*=115/d;}
}
function updatePlayer(dt){
  if(player.dead){
    player.deadT-=dt;
    player.g.rotation.x=Math.min(Math.PI/2,player.g.rotation.x+dt*4);
    if(player.deadT<=0)respawnPlayer();
    return;
  }
  if(player.g.rotation.x!==0)player.g.rotation.x=Math.max(0,player.g.rotation.x-dt*6);
  let mx=joy.x,mz=joy.y;
  if(!chatOpen){
    mx+=(keys.KeyD?1:0)-(keys.KeyA?1:0);
    mz+=(keys.KeyW?1:0)-(keys.KeyS?1:0);
  }
  const len=Math.hypot(mx,mz);
  if(len>1){mx/=len;mz/=len;}
  const s=Math.sin(view.yaw),c=Math.cos(view.yaw);
  const wx=mx*c+mz*s,wz=-mx*s+mz*c;
  const moving=len>0.1;
  if(moving){player.pos.x+=wx*16*player.speed*dt;player.pos.z+=wz*16*player.speed*dt;player.walkPhase+=dt*11;}
  if(admin.fly){
    let vy=0;
    if(keys.Space||keys.ArrowUp2)vy=13;
    if(keys.ShiftLeft||keys.ShiftRight||keys.ArrowDown2)vy=-13;
    player.pos.y+=vy*dt;
  }else{
    player.vy-=32*dt;
    if(keys.Space&&player.grounded){player.vy=13*player.jumpMul;player.grounded=false;}
    player.pos.y+=player.vy*dt;
    if(player.pos.y<=0){player.pos.y=0;player.vy=0;player.grounded=true;}
  }
  collide();
  player.g.position.copy(player.pos);
  player.g.rotation.y=view.yaw;
  const sw=player.swing>0;
  player.swing=Math.max(0,player.swing-dt);
  const armSwing=moving?Math.sin(player.walkPhase)*0.7:0;
  if(sw){player.parts.armR.rotation.x=-2.3;}else{player.parts.armR.rotation.x=-armSwing*0.8;}
  player.parts.armL.rotation.x=armSwing*0.8;
  if(!player.grounded&&!admin.fly){
    player.parts.legL.rotation.x=-0.5;player.parts.legR.rotation.x=0.4;
  }else if(moving){
    player.parts.legL.rotation.x=Math.sin(player.walkPhase)*0.8;
    player.parts.legR.rotation.x=-Math.sin(player.walkPhase)*0.8;
  }else{
    player.parts.legL.rotation.x*=0.8;player.parts.legR.rotation.x*=0.8;
  }
  if(T-player.lastHurt>5&&player.hp<100)player.hp=Math.min(100,player.hp+8*dt);
}
function respawnPlayer(){
  player.dead=false;player.hp=100;player.vy=0;
  player.pos.set(0,3,6);player.g.rotation.x=0;
}
function damagePlayer(amt,fromId,fromName){
  if(admin.god||player.dead)return;
  player.hp=Math.max(0,player.hp-amt);player.lastHurt=T;
  if(player.hp<=0){
    player.dead=true;player.deadT=3;
    if(net.mode!=='solo'&&fromId)sendFrag(fromId,fromName);
    addChat('System',nick+' was knocked out'+(fromName?' by '+fromName:'')+'!');
  }
}
function updateCamera(){

  const px=player.pos.x-s*8,pz=player.pos.z-c*8;

/* ============ dummies ============ */
function spawnDummy(x,z){
  if(x===undefined){
    let tries=0;
    do{const a=rand(0,Math.PI*2),r=rand(18,80);x=Math.cos(a)*r;z=Math.sin(a)*r;tries++;}
    while(tries<8&&(Math.hypot(x-30,z+25)<12||Math.hypot(x+38,z-22)<14));
  }
  const ch=makeCharacter('Dummy',{head:0x9aa0a6,shirt:0x6b7075,arm:0x9aa0a6,pants:0x565b60,armsUp:true,tagColor:'#d0d6dd'});
  ch.group.position.set(x,0,z);scene.add(ch.group);
  dummies.push({g:ch.group,parts:ch.parts,hp:ch.hp,hpV:100,dead:false,t:rand(0,3),home:{x:x,z:z},tx:x,tz:z,phase:rand(0,6)});
}
function damageDummy(d,amt){
  if(d.dead)return;
  d.hpV=Math.max(0,d.hpV-amt);d.hp.set(d.hpV);
  if(d.hpV<=0){
    d.dead=true;d.t=4;player.frags++;updFrags();
  }
}
function updateDummies(dt){
  for(const d of dummies){
    if(d.dead){
      d.t-=dt;
      d.g.rotation.x=Math.min(Math.PI/2,d.g.rotation.x+dt*3);
      if(d.t<=0){
        d.dead=false;d.hpV=100;d.hp.set(100);
        d.g.rotation.x=0;
        d.g.position.set(d.home.x+rand(-8,8),0,d.home.z+rand(-8,8));
        d.tx=d.g.position.x;d.tz=d.g.position.z;
      }
      continue;
    }
    d.t-=dt;
    const dx=d.tx-d.g.position.x,dz=d.tz-d.g.position.z,dist=Math.hypot(dx,dz);
    if(d.t<=0||dist<0.8){
      d.t=rand(2.5,5.5);
      d.tx=clamp(d.home.x+rand(-16,16),-110,110);
      d.tz=clamp(d.home.z+rand(-16,16),-110,110);
    }else{
      d.g.position.x+=dx/dist*2.2*dt;d.g.position.z+=dz/dist*2.2*dt;
      d.g.rotation.y=Math.atan2(dx,dz);
      d.phase+=dt*7;
      d.parts.legL.rotation.x=Math.sin(d.phase)*0.7;
      d.parts.legR.rotation.x=-Math.sin(d.phase)*0.7;
    }
  }
}

/* ============ weapons & fx ============ */
function fwd(){return new THREE.Vector3(Math.sin(view.yaw),0,Math.cos(view.yaw));}
function attack(){
  if(chatOpen||player.dead)return;
  const now=performance.now();
  const cds=[500,260,1200];
  if(now-player.lastAtk<cds[player.weapon])return;
  player.lastAtk=now;player.atkT=now;player.swing=0.35;
  const f=fwd();
  if(player.weapon===0){
    for(const d of dummies){
      if(d.dead)continue;
      const to=d.g.position.clone().sub(player.pos);to.y=0;
      if(to.length()<4.8&&to.normalize().dot(f)>0.2)damageDummy(d,34);
    }
    for(const id in remotes){
      const r=remotes[id];if(r.dead)continue;
      const to=r.group.position.clone().sub(player.pos);to.y=0;
      if(to.length()<4.8&&to.normalize().dot(f)>0.2)sendDmg(id,34);
    }
    if(net.mode!=='solo')sendFx({t:'fx',k:'sw'});
  }else if(player.weapon===1){
    const dir=new THREE.Vector3();camera.getWorldDirection(dir);
    const origin=player.pos.clone().add(new THREE.Vector3(0,2.2,0));
    const hit=rayHit(origin,dir,90);
    const end=hit?hit.point:origin.clone().addScaledVector(dir,90);
    showTracer(origin.clone().addScaledVector(dir,1.2),end);
    if(hit){if(hit.dmg){if(hit.dmg.d)damageDummy(hit.dmg.d,22);if(hit.dmg.rid)sendDmg(hit.dmg.rid,22);}}
    if(net.mode!=='solo')sendFx({t:'fx',k:'tr',ax:origin.x,ay:origin.y,az:origin.z,bx:end.x,by:end.y,bz:end.z});
  }else{
    const dir=new THREE.Vector3();camera.getWorldDirection(dir);
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.32,10,10),new THREE.MeshLambertMaterial({color:0xff5533}));
    const pos=player.pos.clone().add(new THREE.Vector3(0,2.2,0)).addScaledVector(dir,1.6);
    m.position.copy(pos);scene.add(m);
    projectiles.push({m:m,vel:dir.clone().multiplyScalar(30),life:4});
    if(net.mode!=='solo')sendFx({t:'fx',k:'rk',x:pos.x,y:pos.y,z:pos.z,dx:dir.x,dy:dir.y,dz:dir.z});
  }
}
function rayHit(origin,dir,maxD){
  let best=null;
  const test=(pos,r,extra)=>{
    const to=pos.clone().sub(origin);
    const t=to.dot(dir);
    if(t<1||t>maxD)return;
    const perp=to.clone().sub(dir.clone().multiplyScalar(t)).length();
    if(perp<r&&(!best||t<best.t))best={t:t,point:origin.clone().addScaledVector(dir,t),extra:extra};
  };
  for(const d of dummies)if(!d.dead)test(d.g.position.clone().add(new THREE.Vector3(0,1.5,0)),1.0,{d:d});
  for(const id in remotes){const r=remotes[id];if(!r.dead)test(r.group.position.clone().add(new THREE.Vector3(0,1.5,0)),1.1,{rid:id});}
  if(best)best.dmg=best.extra;
  return best?best:null;
}
function showTracer(a,b){
  const geo=new THREE.BufferGeometry().setFromPoints([a,b]);
  const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xffee55,transparent:true}));
  scene.add(line);tracers.push({m:line,t:0.09});
}
function boomVisual(pos,big){
  const s=big||1;
  const m=new THREE.Mesh(new THREE.SphereGeometry(1,12,12),new THREE.MeshBasicMaterial({color:0xffa030,transparent:true,opacity:0.9}));
  m.position.copy(pos);scene.add(m);
  booms.push({m:m,t:0,r:6*s});
  for(let i=0;i<12;i++){
    const d=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.25,0.25),new THREE.MeshBasicMaterial({color:0x555555}));
    d.position.copy(pos);
    scene.add(d);
    booms.push({m:d,t:1,vx:rand(-6,6),vy:rand(3,9),vz:rand(-6,6),debris:true});
  }
}
function explode(pos,fromNet){
  boomVisual(pos,1);
  for(const d of dummies){
    if(d.dead)continue;
    const dist=d.g.position.distanceTo(pos);
    if(dist<7)damageDummy(d,Math.round(85*(1-dist/7)));
  }
  for(const id in remotes){
    const r=remotes[id];if(r.dead)continue;
    const dist=r.group.position.distanceTo(pos);
    if(dist<7)sendDmg(id,Math.round(85*(1-dist/7)));
  }
  const pd=player.pos.distanceTo(pos);
  if(pd<7&&!player.dead){
    damagePlayer(Math.round(70*(1-pd/7)),null,'a rocket');
    const away=player.pos.clone().sub(pos).setY(0).normalize();
    player.pos.addScaledVector(away,3);player.vy=10;player.grounded=false;
  }
  if(net.mode!=='solo'&&!fromNet)sendFx({t:'fx',k:'bm',x:pos.x,y:pos.y,z:pos.z});
}
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    p.m.position.addScaledVector(p.vel,dt);
    p.life-=dt;
    let hitNow=p.life<=0||p.m.position.y<=0.3;
    if(!hitNow){
      for(const d of dummies)if(!d.dead&&d.g.position.distanceTo(p.m.position)<1.6)hitNow=true;
      for(const id in remotes)if(!remotes[id].dead&&remotes[id].group.position.distanceTo(p.m.position)<1.8)hitNow=true;
    }
    if(hitNow){explode(p.m.position.clone());scene.remove(p.m);projectiles.splice(i,1);}
  }
}
function updateFx(dt){
  for(let i=tracers.length-1;i>=0;i--){
    tracers[i].t-=dt;
    tracers[i].m.material.opacity=Math.max(0,tracers[i].t/0.09);
    if(tracers[i].t<=0){scene.remove(tracers[i].m);tracers.splice(i,1);}
  }
  for(let i=booms.length-1;i>=0;i--){
    const b=booms[i];b.t-=dt;
    if(b.debris){
      b.vy-=25*dt;b.m.position.x+=b.vx*dt;b.m.position.y=Math.max(0.1,b.m.position.y+b.vy*dt);b.m.position.z+=b.vz*dt;
      if(b.t<=0){scene.remove(b.m);booms.splice(i,1);}
    }else{
      const k=1-Math.max(0,b.t)/0.5;
      b.m.scale.setScalar(1+k*6);
      b.m.material.opacity=Math.max(0,0.9*(1-k));
      if(b.t<=0){scene.remove(b.m);booms.splice(i,1);}
    }
  }
}
function playFx(d){
  if(d.k==='tr')showTracer(new THREE.Vector3(d.ax,d.ay,d.az),new THREE.Vector3(d.bx,d.by,d.bz));
  else if(d.k==='bm')boomVisual(new THREE.Vector3(d.x,d.y,d.z),1);
  else if(d.k==='rk'){
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.32,10,10),new THREE.MeshLambertMaterial({color:0xff5533}));
    m.position.set(d.x,d.y,d.z);scene.add(m);
    projectiles.push({m:m,vel:new THREE.Vector3(d.dx,d.dy,d.dz).multiplyScalar(30),life:4});
  }
}

/* ============ networking ============ */
const remotes={};
function myState(){
  return{id:net.myId,name:nick,x:+player.pos.x.toFixed(2),y:+player.pos.y.toFixed(2),z:+player.pos.z.toFixed(2),
    ry:+view.yaw.toFixed(2),hp:Math.round(player.hp),dead:player.dead?1:0,atk:player.atkT,mv:(Math.hypot(joy.x,joy.y)>0.1||keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD)?1:0};
}
function initClient(){net.myId=net.peer.id;}
function initHost(room){
  net.host=true;net.myId=room;
  net.peer.on('connection',c=>{
    c.on('open',()=>{net.conns.push(c);addChat('System','A player joined the room! ('+(net.conns.length+1)+' online)');});
    c.on('data',d=>onHostData(d,c));
    c.on('close',()=>{net.conns=net.conns.filter(x=>x!==c);delete net.states[c.peer];removeRemote(c.peer);addChat('System','A player left.');});
  });
}
function onHostData(d,c){
  if(!d||!d.t)return;
  if(d.t==='me'){d.id=c.peer;net.states[c.peer]=d;}
  else if(d.t==='chat'){handleChat(d);broadcastExcept(d,c);}
  else if(d.t==='dmg'){
    if(d.target===net.myId)damagePlayer(d.amount,d.from,d.from);
    else{const tc=net.conns.find(x=>x.peer===d.target);if(tc&&tc.open)tc.send({t:'dmg',amount:d.amount,from:d.from});}
  }
  else if(d.t==='frag'){handleFrag(d);broadcastExcept(d,c);}
  else if(d.t==='cmd'){runWorldCmd(d.c);broadcastExcept(d,c);}
  else if(d.t==='fx'){broadcastExcept(d,c);playFx(d);}
}
function broadcastExcept(d,except){for(const c of net.conns)if(c!==except&&c.open)c.send(d);}
function handleClientData(d){
  if(!d||!d.t)return;
  if(d.t==='all'){
    const seen={};
    for(const p of d.players){
      if(p.id===net.myId)continue;
      seen[p.id]=1;updateRemote(p);
    }
    for(const id in remotes)if(!seen[id])removeRemote(id);
  }
  else if(d.t==='chat')handleChat(d);
  else if(d.t==='dmg')damagePlayer(d.amount,d.from,d.from);
  else if(d.t==='frag')handleFrag(d);
  else if(d.t==='cmd')runWorldCmd(d.c);
  else if(d.t==='fx')playFx(d);
}
function handleFrag(d){
  if(d.killer===net.myId){player.frags++;updFrags();}
  addChat('kill',(d.kname||'Someone')+' knocked out '+(d.vname||'someone'));
}
function sendFrag(killerId,vname){
  const kname=(remotes[killerId]&&remotes[killerId].name)||killerId;
  const d={t:'frag',killer:killerId,kname:kname,vname:nick};
  if(net.host){handleFrag(d);broadcastExcept(d,null);}
  else if(net.conn)net.conn.send(d);
}
function sendDmg(id,amt){
  if(net.mode==='solo')return;
  if(net.host){
    const c=net.conns.find(x=>x.peer===id);
    if(c&&c.open)c.send({t:'dmg',amount:amt,from:net.myId});
  }else if(net.conn)net.conn.send({t:'dmg',target:id,amount:amt,from:net.myId});
}
function sendFx(d){
  if(net.mode==='solo')return;
  if(net.host)broadcastExcept(d,null);
  else if(net.conn)net.conn.send(d);
}
function updateRemote(p){
  let r=remotes[p.id];
  if(!r){
    const col=REMOTE_COLORS[Math.abs(p.id.split('').reduce((a,ch)=>a+ch.charCodeAt(0),0))%REMOTE_COLORS.length];
    const ch=makeCharacter(p.name,{head:0xffd15c,shirt:col,arm:0xffd15c,pants:0x2f4f6f,tagColor:'#ffd76a'});
    ch.group.position.set(p.x,p.y,p.z);
    remotes[p.id]={group:ch.group,parts:ch.parts,hp:ch.hp,name:p.name,last:p.atk||0,swing:0,tx:p.x,ty:p.y,tz:p.z,ry:p.ry,dead:!!p.dead};
    scene.add(ch.group);
    r=remotes[p.id];
  }
  r.tx=p.x;r.ty=p.y;r.tz=p.z;r.ry=p.ry;r.dead=!!p.dead;r.mv=p.mv===1;
  r.hp.set(p.hp);
  if(p.atk>r.last){r.last=p.atk;r.swing=0.35;}
}
function removeRemote(id){
  const r=remotes[id];
  if(r){scene.remove(r.group);delete remotes[id];}
}
function updateRemotePlayers(dt){
  const k=Math.min(1,dt*10);
  for(const id in remotes){
    const r=remotes[id];
    r.group.position.x+=(r.tx-r.group.position.x)*k;
    r.group.position.y+=(r.ty-r.group.position.y)*k;
    r.group.position.z+=(r.tz-r.group.position.z)*k;
    r.group.rotation.y=r.ry;
    if(r.dead)r.group.rotation.x=Math.min(Math.PI/2,r.group.rotation.x+dt*4);
    else if(r.group.rotation.x>0)r.group.rotation.x=Math.max(0,r.group.rotation.x-dt*6);
    r.swing=Math.max(0,(r.swing||0)-dt);
    if(r.swing>0)r.parts.armR.rotation.x=-2.3;
    else if(r.mv)r.parts.armR.rotation.x=-Math.sin(T*11)*0.7;
    else r.parts.armR.rotation.x*=0.8;
    if(r.mv&&!r.dead){r.parts.legL.rotation.x=Math.sin(T*11)*0.8;r.parts.legR.rotation.x=-Math.sin(T*11)*0.8;}
  }
}
let netAcc=0;
function netTick(dt){
  if(net.mode==='solo')return;
  netAcc+=dt;
  if(netAcc<0.1)return;
  netAcc=0;
  if(net.host){
    const arr=[myState()];
    for(const k in net.states){arr.push(net.states[k]);updateRemote(net.states[k]);}
    broadcastExcept({t:'all',players:arr},null);
  }else if(net.conn&&net.conn.open)net.conn.send({t:'me',...myState()});
}

/* ============ chat & commands ============ */
function addChat(kind,text){
  const log=$('chatLog');
  const d=document.createElement('div');
  if(kind==='System')d.className='csys';
  if(kind==='kill')d.className='ckill';
  d.textContent=text;
  log.appendChild(d);
  while(log.children.length>8)log.removeChild(log.firstChild);
}
function handleChat(d){
  addChat(null,(d.name||'?')+': '+(d.msg||''));
}
function openChat(){
  if(chatOpen)return;
  chatOpen=true;
  $('chatWrap').style.display='block';
  const inp=$('chatInput');
  inp.value='';setTimeout(()=>inp.focus(),50);
  if(isMobile)closeMobileKeyguard();
}
function closeChat(){chatOpen=false;$('chatWrap').style.display='none';$('chatInput').blur();}
$('chatInput').addEventListener('keydown',e=>{
  e.stopPropagation();
  if(e.key==='Enter'){
    const v=$('chatInput').value.trim();
    if(v){
      addChat(null,nick+': '+v);
      if(v.charAt(0)===';')runCommand(v);
      else if(net.mode!=='solo'){
        const d={t:'chat',name:nick,msg:v};
        if(net.host)broadcastExcept(d,null);else if(net.conn)net.conn.send(d);
      }
    }
    closeChat();
  }
  if(e.key==='Escape')closeChat();
});
$('chatInput').addEventListener('blur',()=>{setTimeout(closeChat,150);});
function isTouchCmd(c){return['rain','night','disco'].includes(c);}
function runCommand(raw){
  const parts=raw.slice(1).trim().split(/\s+/);
  const cmd=(parts[0]||'').toLowerCase();
  const arg=parts[1];
  if(cmd==='help')addChat('System',';fly ;speed 1-4 ;jump 1-2 ;size 0.5-3 ;tp X Z ;respawn ;rain ;night ;disco ;killall');
  else if(cmd==='fly'){toggleFly();}
  else if(cmd==='speed'){const n=clamp(+arg||2,1,4);player.speed=n;addChat('System','Speed x'+n);}
  else if(cmd==='jump'){const n=clamp(+arg||2,1,2);player.jumpMul=n;addChat('System','Jump x'+n);}
  else if(cmd==='size'){const n=clamp(+arg||1.5,0.4,3);player.scale=n;player.g.scale.setScalar(n);addChat('System','Size '+n);}
  else if(cmd==='tp'){player.pos.set(clamp(+parts[1]||0,-110,110),5,clamp(+parts[2]||0,-110,110));addChat('System','Teleported!');}
  else if(cmd==='respawn')respawnPlayer();
  else if(isTouchCmd(cmd)){
    runWorldCmd(cmd);
    if(net.mode!=='solo'){
      const d={t:'cmd',c:cmd};
      if(net.host)broadcastExcept(d,null);else if(net.conn)net.conn.send(d);
    }
  }
  else if(cmd==='killall'){for(const d of dummies)damageDummy(d,999);}
  else addChat('System','Unknown command. Type ;help');
}
function runWorldCmd(cmd){
  if(cmd==='rain')toggleRain();
  else if(cmd==='night')toggleNight();
  else if(cmd==='disco')toggleDisco();
}

/* ============ admin actions ============ */
function bindAdmin(){
  $('aFly').onclick=()=>toggleFly();
  $('aGod').onclick=()=>{admin.god=!admin.god;mark('aGod');toast('God mode '+(admin.god?'ON':'OFF'));};
  $('aSpeed').onclick=()=>{admin.speedStep=(admin.speedStep+1)%3;player.speed=[1,2,4][admin.speedStep];$('aSpeed').textContent='SPEED x'+player.speed;mark('aSpeed',admin.speedStep>0);};
  $('aJump').onclick=()=>{admin.jumpStep=(admin.jumpStep+1)%2;player.jumpMul=[1,2][admin.jumpStep];mark('aJump',admin.jumpStep>0);};
  $('aGrow').onclick=()=>{player.scale=clamp(player.scale*1.25,0.4,3);player.g.scale.setScalar(player.scale);};
  $('aShrink').onclick=()=>{player.scale=clamp(player.scale/1.25,0.4,3);player.g.scale.setScalar(player.scale);};
  $('aSpawn').onclick=()=>{spawnDummy(player.pos.x+rand(-6,6),player.pos.z+rand(-6,6));toast('Dummy spawned');};
  $('aKill').onclick=()=>{for(const d of dummies)damageDummy(d,999);};
  $('aRain').onclick=()=>{toggleRain();syncWorld('rain');};
  $('aNight').onclick=()=>{toggleNight();syncWorld('night');};
  $('aDisco').onclick=()=>{toggleDisco();syncWorld('disco');};
  $('aTp').onclick=()=>{player.pos.set(0,3,6);player.vy=0;};
}
function mark(id,on){$(id).classList.toggle('on',on!==undefined?on:true);}
function toggleFly(){
  admin.fly=!admin.fly;
  mark('aFly');
  $('btnUp').style.display=admin.fly?'flex':'none';
  $('btnDown').style.display=admin.fly?'flex':'none';
  toast('Fly '+(admin.fly?'ON - Space up, Shift down':'OFF'));
}
function syncWorld(cmd){
  if(net.mode==='solo')return;
  const d={t:'cmd',c:cmd};
  if(net.host)broadcastExcept(d,null);else if(net.conn)net.conn.send(d);
}
function toggleRain(){
  rainOn=!rainOn;mark('aRain');
  if(rainOn){
    rainGroup=new THREE.Group();
    const m=new THREE.MeshBasicMaterial({color:0xaecdf5,transparent:true,opacity:0.6});
    for(let i=0;i<350;i++){
      const d=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.9,0.05),m);
      d.position.set(rand(-110,110),rand(0,45),rand(-110,110));
      rainGroup.add(d);
    }
    scene.add(rainGroup);
  }else if(rainGroup){scene.remove(rainGroup);rainGroup=null;}
}
function toggleNight(){
  nightOn=!nightOn;mark('aNight');
  if(nightOn){
    scene.background.setHex(0x0a1230);scene.fog.color.setHex(0x0a1230);
    window.__hemi.intensity=0.25;window.__dir.intensity=0.3;
  }else{
    scene.background.setHex(0x87ceeb);scene.fog.color.setHex(0x87ceeb);
    window.__hemi.intensity=0.95;window.__dir.intensity=0.9;
  }
}
function toggleDisco(){
  mark('aDisco');
  if(discoInt){clearInterval(discoInt);discoInt=null;
    if(!nightOn){scene.background.setHex(0x87ceeb);scene.fog.color.setHex(0x87ceeb);}
  }else{
    discoInt=setInterval(()=>{
      const h=(T*0.25)%1;
      scene.background.setHSL(h,0.65,0.5);scene.fog.color.setHSL(h,0.65,0.5);
    },250);
  }
}

/* ============ animate ============ */
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  T+=dt;
  updatePlayer(dt);
  updateCamera();
  updateRemotePlayers(dt);
  updateDummies(dt);
  updateProjectiles(dt);
  updateFx(dt);
  for(const c of clouds){c.g.position.x+=c.vx*dt;if(c.g.position.x>130)c.g.position.x=-130;}
  if(rainGroup)for(const d of rainGroup.children){d.position.y-=28*dt;if(d.position.y<0)d.position.y=45;}
  netTick(dt);
  renderer.render(scene,camera);
}
