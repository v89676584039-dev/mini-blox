<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Blox Online</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif}
canvas{display:block}
#menu{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:float 12s ease-in-out infinite}
.blob1{width:340px;height:340px;background:#5f27cd;top:-60px;left:-60px}
.blob2{width:280px;height:280px;background:#e74c3c;bottom:-40px;right:-40px;animation-delay:-6s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.1)}}
.card{position:relative;z-index:2;width:min(420px,92vw);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(14px);border-radius:22px;padding:34px 28px;text-align:center;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h1{font-size:34px;font-weight:800;letter-spacing:1px;margin-bottom:6px}
.card h1 span{color:#6c5ce7}
.card p{color:rgba(255,255,255,.65);font-size:13px;margin-bottom:24px}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:12px;transition:transform .1s,opacity .2s;color:#fff}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn-solo{background:linear-gradient(90deg,#00b894,#00cec9)}
.btn-create{background:linear-gradient(90deg,#6c5ce7,#a55eea)}
.btn-join{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.3);color:#fff;font-size:15px;margin-bottom:12px;text-align:center;outline:none}
input::placeholder{color:rgba(255,255,255,.4)}
#roomRow{display:flex;gap:8px}
#roomRow input{flex:1;margin-bottom:0}
#roomCode{flex:0 0 auto;width:46%;background:rgba(108,92,231,.3);border:1px solid #6c5ce7}
#joinRow{display:flex;gap:8px;margin-bottom:12px}
#joinRow input{flex:1;margin-bottom:0}
#joinBtn{flex:0 0 auto;padding:0 22px;font-size:14px}
#err{color:#ff7675;font-size:12px;min-height:16px;margin-top:6px}
#buildTag{position:absolute;top:10px;right:14px;z-index:101;color:rgba(255,255,255,.4);font-size:10px;letter-spacing:1px}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
#topbar{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.pill{background:rgba(0,0,0,.55);color:#fff;padding:8px 14px;border-radius:12px;font-size:13px;pointer-events:auto}
#fpsPill{position:absolute;top:52px;left:12px;font-size:11px;opacity:.8}
#crosshair{position:absolute;top:50%;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 6px rgba(0,0,0,.6)}
#hotbar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
.slot{width:56px;height:56px;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.3);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:22px;cursor:pointer;user-select:none}
.slot small{font-size:8px;opacity:.7}
.slot.sel{border-color:#00cec9;box-shadow:0 0 14px rgba(0,206,201,.6)}
#chatLog{position:absolute;bottom:90px;left:12px;max-width:56%;max-height:180px;overflow:hidden;font-size:13px;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}
#chatLog div{background:rgba(0,0,0,.45);padding:3px 8px;border-radius:8px;margin-top:3px;display:inline-block}
#chatInputWrap{position:absolute;bottom:50px;left:12px;width:46%;display:none;pointer-events:auto}
#chatInput{width:100%;padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.7);color:#fff;font-size:13px;outline:none;text-align:left}
#playersPill{position:absolute;top:10px;right:12px}
.topRight{position:absolute;top:56px;right:12px;display:flex;flex-direction:column;gap:8px;pointer-events:auto;align-items:flex-end}
.miniBtn{background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:7px 12px;font-size:12px;cursor:pointer}
#adminPanel{position:absolute;top:110px;right:12px;width:220px;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:12px;display:none;pointer-events:auto;max-height:60vh;overflow:auto}
#adminPanel h3{color:#fdcb6e;font-size:13px;margin-bottom:8px}
#adminPanel button{display:block;width:100%;margin-bottom:6px;padding:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:9px;font-size:12px;cursor:pointer}
#adminPanel button.on{background:#00b894;border-color:#00b894}
#joy{position:absolute;bottom:90px;left:24px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);pointer-events:auto;display:none;touch-action:none}
#joyKnob{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.4);left:34px;top:34px;pointer-events:none}
.actBtns{position:absolute;bottom:96px;right:20px;display:none;flex-direction:column;gap:12px;pointer-events:auto;align-items:center}
.cbtn{width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.35);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none}
#jumpBtn{background:rgba(0,184,148,.7)}
#atkBtn{background:rgba(231,76,60,.75)}
#downBtn{background:rgba(52,73,94,.7);display:none}
#deathScreen{position:absolute;inset:0;background:rgba(120,10,10,.35);display:none;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:800;text-shadow:0 2px 8px #000;flex-direction:column;gap:10px}
#deathScreen small{font-size:14px;font-weight:400}
@media(max-width:760px){
 #chatLog{bottom:auto;top:110px;max-height:120px}
 #chatInputWrap{bottom:auto;top:246px}
 #hotbar{bottom:auto;top:130px;left:auto;right:10px;transform:none;flex-direction:column}
 .slot{width:44px;height:44px;font-size:18px}
 #adminPanel{top:auto;bottom:220px;right:8px;width:200px}
}
</style>
</head>
<body>
<div id="buildTag">BUILD 3.2</div>
<div id="menu">
 <div class="blob blob1"></div><div class="blob blob2"></div>
 <div class="card">
  <h1>MINI <span>BLOX</span></h1>
  <p>Blocky multiplayer sandbox &mdash; free admin, weapons, zombies</p>
  <input id="nickInput" maxlength="12" placeholder="Your nickname">
  <button class="btn btn-solo" id="btnSolo">▶ PLAY SOLO</button>
  <button class="btn btn-create" id="btnCreate">🌐 CREATE ROOM</button>
  <div id="roomRow" style="display:none">
   <input id="roomCode" readonly value="----">
   <button class="btn btn-join" id="btnCopy">COPY</button>
  </div>
  <div id="joinRow" style="display:none">
   <input id="joinCode" maxlength="4" placeholder="ROOM CODE" style="text-transform:uppercase">
   <button class="btn btn-create" id="joinBtn">JOIN</button>
  </div>
  <button class="btn btn-join" id="btnShowJoin">🔑 JOIN ROOM</button>
  <button class="btn btn-join" id="btnCancel" style="display:none">✖ CANCEL</button>
  <div id="err"></div>
 </div>
</div>
<div id="hud">
 <div id="topbar">
  <div class="pill" id="scorePill">Kills: 0 &nbsp;|&nbsp; HP: 100</div>
  <div class="pill" id="playersPill">Solo</div>
 </div>
 <div class="pill" id="fpsPill">FPS: --</div>
 <div class="topRight">
  <button class="miniBtn" id="btnChat">💬 Chat</button>
  <button class="miniBtn" id="btnAdmin">⚙ Admin</button>
  <button class="miniBtn" id="btnMenu">🚪 Menu</button>
 </div>
 <div id="adminPanel">
  <h3>FREE ADMIN</h3>
  <button data-cmd="fly">✈ Fly toggle</button>
  <button data-cmd="god">🛡 God mode</button>
  <button data-cmd="speed2">⚡ Speed x2</button>
  <button data-cmd="jump2">🦘 Jump x2</button>
  <button data-cmd="big">📏 Size +</button>
  <button data-cmd="small">📏 Size -</button>
  <button data-cmd="spawn">🧟 Spawn dummy</button>
  <button data-cmd="tree">🌳 Plant tree</button>
  <button data-cmd="killall">💀 Kill all dummies</button>
  <button data-cmd="rain">🌧 Rain toggle</button>
  <button data-cmd="night">🌙 Day/Night</button>
  <button data-cmd="disco">🎉 Disco mode</button>
  <button data-cmd="tpspawn">🏠 Teleport to spawn</button>
 </div>
 <div id="crosshair"></div>
 <div id="chatLog"></div>
 <div id="chatInputWrap"><input id="chatInput" maxlength="80" placeholder="Say something... ;help"></div>
 <div id="hotbar">
  <div class="slot sel" data-w="0">🗡<small>SWORD</small></div>
  <div class="slot" data-w="1">🔫<small>GUN</small></div>
  <div class="slot" data-w="2">🚀<small>ROCKET</small></div>
 </div>
 <div id="joy"><div id="joyKnob"></div></div>
 <div class="actBtns">
  <div class="cbtn" id="atkBtn">⚔</div>
  <div class="cbtn" id="jumpBtn">⬆</div>
  <div class="cbtn" id="downBtn">⬇</div>
 </div>
 <div id="deathScreen"><div>YOU DIED</div><small>Respawning...</small></div>
</div>
<script>

// ===== MENU WIRING FIRST (before anything heavy) =====
var MENU = document.getElementById('menu');
var ERRBOX = document.getElementById('err');
function showErr(m){ ERRBOX.textContent = m; }

var pendingNick = '';
function readNick(){
  var v = document.getElementById('nickInput').value.trim();
  if(!v) v = 'Player' + Math.floor(100+Math.random()*900);
  return v;
}
function startGame(mode, roomCode){
  try{
    pendingNick = readNick();
    MENU.style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(isMobile){
      document.getElementById('joy').style.display='block';
      document.querySelector('.actBtns').style.display='flex';
    }
    BOOT(mode, roomCode, isMobile);
  }catch(e){ MENU.style.display='flex'; showErr('START ERROR: '+e.message); }
}
function bind(id, fn){
  var el = document.getElementById(id);
  if(el) el.addEventListener('click', function(ev){ ev.preventDefault(); fn(); });
}
bind('btnSolo',   function(){ startGame('solo', null); });
bind('btnCreate', function(){
  if(typeof Peer === 'undefined'){ showErr('PeerJS library not loaded - check internet'); return; }
  ROOM_CODE = Math.random().toString(36).slice(2,6).toUpperCase();
  startGame('host', ROOM_CODE);
});
bind('btnShowJoin', function(){
  document.getElementById('joinRow').style.display='flex';
  document.getElementById('btnShowJoin').style.display='none';
});
bind('joinBtn', function(){
  if(typeof Peer === 'undefined'){ showErr('PeerJS library not loaded - check internet'); return; }
  var code = document.getElementById('joinCode').value.trim().toUpperCase();
  if(code.length < 3){ showErr('Enter a 4-symbol room code'); return; }
  startGame('guest', code);
});
bind('btnCancel', function(){ location.reload(); });
bind('btnCopy', function(){
  var c = document.getElementById('roomCode').value;
  try{ navigator.clipboard.writeText(c); }catch(e){}
  showErr('Code copied: '+c);
});

// ===== GLOBALS =====
var ROOM_CODE = null, IS_HOST = false, NET = null, NET_READY = false;
var peers = {}, conns = {};
var players = {}; // remote players
var nick = '';
var MODE = 'solo';
var gameOn = false;
var scene, camera, renderer, clock;
var mobileUI = false;
var isNight = false, disco = false, raining = false;
var rainMesh = null;
var killCount = 0;
var discoHue = 0;

// ===== BOOT =====
function BOOT(mode, roomCode, isMob){
  mobileUI = isMob;
  MODE = mode;
  nick = pendingNick;
  initThree();
  buildWorld();
  makePlayer(true);
  spawnZombies(10);
  gameOn = true;
  if(mode !== 'solo'){ initClient(roomCode, mode === 'host'); }
  chatMsg('SYSTEM', 'Welcome, '+nick+'! ;help for commands');
  if(isMob){ /* controls already visible */ }
  animate();
}

function initThree(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 60, 220);
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 500);
  renderer = new THREE.WebGLRenderer({antialias: !mobileUI});
  if(!mobileUI){ renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; }
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(mobileUI ? 1 : Math.min(devicePixelRatio,2));
  document.body.appendChild(renderer.domElement);
  clock = new THREE.Clock();
  window.addEventListener('resize', function(){
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  var hemi = new THREE.HemisphereLight(0xffffff, 0x444466, 0.9); scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(50,80,30);
  if(!mobileUI){ sun.castShadow = true; sun.shadow.mapSize.set(2048,2048);
    sun.shadow.camera.left=-80; sun.shadow.camera.right=80; sun.shadow.camera.top=80; sun.shadow.camera.bottom=-80; }
  scene.add(sun);
}

function box(w,h,d,color,px,py,pz,cast){
  var g = new THREE.BoxGeometry(w,h,d);
  var m = new THREE.MeshLambertMaterial({color:color});
  var mesh = new THREE.Mesh(g,m);
  mesh.position.set(px,py,pz);
  if(cast && !mobileUI){ mesh.castShadow = true; mesh.receiveShadow = true; }
  scene.add(mesh); return mesh;
}

// ===== WORLD =====
var studs = [], trees = [];
function buildWorld(){
  box(240,1,240,0x3a8f3a,0,0,0,true); // baseplate
  for(var i=-11;i<=11;i++)for(var j=-11;j<=11;j++){
    if((i+j)%2===0) box(10,0.3,10,0x46a546,i*10,0.6,j*10,false);
  }
  // paths
  box(4,0.15,60,0x9b8b6b,0,1.02,0,false);
  box(60,0.15,4,0x9b8b6b,0,1.02,0,false);
  // spawn plaza
  for(var s=0;s<4;s++) box(2,14,2,0xff5555, s<2? -10:10, 7, (s%2)?-10:10,false);
  box(24,2,2,0x884444, 0,14,0,false);
  // house
  box(14,8,12,0xd9b382, 55,4,-45,true);
  box(16,2,14,0x8b4513, 55,9,-45,false);
  box(3,5,0.6,0x6b3f1f, 52,2.5,-38.9,false); // door
  box(4,3,0.6,0x87ceeb, 58,5,-38.9,false);  // window
  // pond
  var pondG = new THREE.CylinderGeometry(10,10,0.4,24);
  var pondM = new THREE.MeshLambertMaterial({color:0x3b7bd4,transparent:true,opacity:0.85});
  var pond = new THREE.Mesh(pondG,pondM); pond.position.set(-55,0.7,45); scene.add(pond);
  // rocks
  for(var r=0;r<12;r++){
    var rr = 20+Math.random()*90, ra = Math.random()*Math.PI*2;
    box(1+Math.random()*3,1+Math.random()*2,1+Math.random()*3, 0x8d8d8d, Math.cos(ra)*rr, 1, Math.sin(ra)*rr, true);
  }
  // bushes & flowers
  for(var b=0;b<20;b++){
    var br = 15+Math.random()*100, ba = Math.random()*Math.PI*2;
    box(1.4,1,1.4,0x2e7d32, Math.cos(ba)*br, 0.9, Math.sin(ba)*br, false);
  }
  for(var f=0;f<30;f++){
    var fr = 12+Math.random()*105, fa = Math.random()*Math.PI*2;
    var fc = [0xff6b9d,0xffd93d,0x9b59b6,0xff8c42][Math.floor(Math.random()*4)];
    box(0.5,0.7,0.5,fc, Math.cos(fa)*fr, 0.9, Math.sin(fa)*fr, false);
  }
  // trees
  var tpos = [[25,25],[-30,20],[40,-20],[-45,-35],[70,30],[-70,-10],[30,60],[-25,70],[80,-40],[-60,-60],[15,-55],[-80,25],[60,55],[-40,50],[90,10],[-90,-20]];
  tpos.forEach(function(p){ plantTree(p[0],p[1]); });
  // clouds
  for(var c=0;c<8;c++){
    var cl = new THREE.Group();
    cl.add(box(6,2,4,0xffffff,0,0,0,false));
    cl.add(box(4,2,3,0xffffff,3,0.5,1,false));
    cl.add(box(3,2,3,0xffffff,-3,0.5,-1,false));
    cl.position.set((Math.random()-0.5)*160, 25+Math.random()*10, (Math.random()-0.5)*160);
    scene.add(cl);
  }
}
function plantTree(x,z){
  var g = new THREE.Group();
  var trunk = box(1.2,5,1.2,0x6b4226,x,2.5,z,true);
  var leafC = [0x2e8b57,0x3cb371,0x228b22][Math.floor(Math.random()*3)];
  box(5,4,5,leafC,x,7,z,true);
  box(3.4,3,3.4,leafC,x,10,z,false);
  box(2,2,2,leafC,x,12.2,z,false);
  trees.push({x:x,z:z});
}

// ===== PLAYER =====
var me = null;
function makePlayer(isMe, remoteNick, pid){
  var p = new THREE.Group();
  var body = box(1.4,1.9,0.9,0x3498db, 0,2.0,0, true); p.add(body);
  var head = box(1.5,1.5,1.5,0xf2c079, 0,3.9,0, true); p.add(head);
  var face = box(1.2,0.35,0.1,0x000000, 0,4.0,0.78,false); p.add(face);
  var eyeL = box(0.22,0.35,0.08,0xffffff,-0.35,4.15,0.79,false); p.add(eyeL);
  var eyeR = box(0.22,0.35,0.08,0xffffff,0.35,4.15,0.79,false); p.add(eyeR);
  var armL = box(0.5,1.7,0.5,0xf2c079,-1.0,2.0,0,true); p.add(armL);
  var armR = box(0.5,1.7,0.5,0xf2c079,1.0,2.0,0,true); p.add(armR);
  var legL = box(0.55,1.6,0.55,0x2c3e50,-0.4,-0.9,0,true); p.add(legL);
  var legR = box(0.55,1.6,0.55,0x2c3e50,0.4,-0.9,0,true); p.add(legR);
  // weapon holder
  var wHolder = new THREE.Group(); wHolder.position.set(1.0,2.2,0.5); p.add(wHolder);
  // name tag
  var tag = makeTag(isMe?nick:remoteNick); tag.position.set(0,5.2,0); p.add(tag);
  var hb = makeHealthBar(); hb.position.set(0,5.8,0); p.add(hb);
  var ent = {
    group:p, body:body, head:head, armL:armL, armR:armR, legL:legL, legR:legR,
    wHolder:wHolder, tag:tag, hb:hb, hbFill:hb.children[1],
    pos:new THREE.Vector3(0,0,8), vel:0, y:0,
    lane:0, hp:100, dead:false, deadT:0,
    walkPhase:0, name:isMe?nick:(remoteNick||'?'), id:pid||'me',
    weapon:0, attackAnim:0, scale:1
  };
  scene.add(p);
  if(isMe){ me = ent; }
  return ent;
}
function makeTag(text){
  var cv = document.createElement('canvas'); cv.width=256; cv.height=64;
  var cx = cv.getContext('2d');
  cx.fillStyle='rgba(0,0,0,0.5)'; cx.fillRect(0,0,256,64);
  cx.font='bold 30px Arial'; cx.fillStyle='#fff'; cx.textAlign='center';
  cx.fillText(text,128,42);
  var tx = new THREE.CanvasTexture(cv);
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true}));
  sp.scale.set(4,1,1); return sp;
}
function makeHealthBar(){
  var g1 = new THREE.Mesh(new THREE.PlaneGeometry(2.2,0.3), new THREE.MeshBasicMaterial({color:0x333333}));
  var g2 = new THREE.Mesh(new THREE.PlaneGeometry(2.1,0.2), new THREE.MeshBasicMaterial({color:0x2ecc71}));
  var grp = new THREE.Group(); grp.add(g1); grp.add(g2); g2.position.z=0.01;
  return grp;
}

// ===== ZOMBIES =====
var zombies = [];
function spawnZombies(n){
  for(var i=0;i<n;i++){
    var z = new THREE.Group();
    var b = box(1.4,1.9,0.9,0x555555, 0,2.0,0, true); z.add(b);
    var h = box(1.5,1.5,1.5,0x777777, 0,3.9,0, true); z.add(h);
    var a1 = box(0.5,1.7,0.5,0x666666,-1.0,2.6,-0.5,true); z.add(a1);
    var a2 = box(0.5,1.7,0.5,0x666666, 1.0,2.6,-0.5,true); z.add(a2);
    var l1 = box(0.55,1.6,0.55,0x444444,-0.4,-0.9,0,true); z.add(l1);
    var l2 = box(0.55,1.6,0.55,0x444444, 0.4,-0.9,0,true); z.add(l2);
    var hb = makeHealthBar(); hb.position.set(0,5.8,0); z.add(hb);
    var ang = Math.random()*Math.PI*2, rad = 25+Math.random()*70;
    var ent = {group:z, hb:hb, hbFill:hb.children[1],
      pos:new THREE.Vector3(Math.cos(ang)*rad,0,Math.sin(ang)*rad),
      hp:50, maxhp:50, dead:false, deadT:0, dir:Math.random()*Math.PI*2,
      speed:1.2+Math.random()*1.2, walk:0, legL:l1, legR:l2};
    scene.add(z); zombies.push(ent);
  }
}

// ===== WEAPONS =====
var WEAPONS = [
  {name:'SWORD', range:4, dmg:35, rate:0.5, cd:0},
  {name:'GUN', range:60, dmg:20, rate:0.35, cd:0},
  {name:'ROCKET', range:80, dmg:60, rate:1.2, cd:0, splash:6}
];
var weaponModel = null;
function setWeapon(i){
  me.weapon = i; me.attackAnim = 0;
  document.querySelectorAll('.slot').forEach(function(s,k){ s.classList.toggle('sel', k===i); });
  if(weaponModel) me.wHolder.remove(weaponModel);
  weaponModel = null;
  if(i===0){ weaponModel = box(0.15,1.4,0.15,0xd0d0d0,0,-0.5,-0.4,false); me.wHolder.add(weaponModel); }
  else if(i===1){ weaponModel = box(0.3,0.3,0.9,0x222222,0,0,-0.5,false); me.wHolder.add(weaponModel); }
  else { weaponModel = box(0.35,0.4,1.2,0x8b0000,0,0,-0.6,false); me.wHolder.add(weaponModel); }
}
function attack(){
  var w = WEAPONS[me.weapon];
  if(w.cd > 0 || me.dead) return;
  w.cd = w.rate; me.attackAnim = 0.35;
  var fwd = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  fwd.y = 0; fwd.normalize();
  var origin = me.pos.clone().add(new THREE.Vector3(0,2.5,0)).add(fwd.clone().multiplyScalar(1.5));
  if(me.weapon===0){
    swordSwing();
    hitArea(me.pos, fwd, 4, 2.5, w.dmg);
  } else if(me.weapon===1){
    tracer(origin.clone(), fwd.clone().multiplyScalar(w.range).add(origin));
    rayHit(origin, fwd, w.range, w.dmg, 0);
  } else {
    rocketFire(origin, fwd);
  }
  netSend({t:'atk', n:nick, w:me.weapon, p:[origin.x,origin.y,origin.z], d:[fwd.x,fwd.y,fwd.z]});
}
function hitArea(pos,fwd,range,width,dmg,ignoreMe){
  zombies.forEach(function(z){
    if(z.dead) return;
    var to = z.pos.clone().sub(pos); to.y=0;
    if(to.length()<range && to.clone().normalize().dot(fwd)>0.4) damageZombie(z,dmg);
  });
  Object.keys(players).forEach(function(k){
    var pl = players[k];
    if(pl.dead) return;
    var to = pl.pos.clone().sub(pos); to.y=0;
    if(to.length()<range && to.clone().normalize().dot(fwd)>0.4) damagePlayer(pl,dmg,'me');
  });
}
function rayHit(origin,dir,range,dmg,radius){
  zombies.forEach(function(z){
    if(z.dead) return;
    var to = z.pos.clone().add(new THREE.Vector3(0,2.5,0)).sub(origin);
    var proj = to.dot(dir);
    if(proj>0 && proj<range){
      var perp = to.clone().sub(dir.clone().multiplyScalar(proj)).length();
      if(perp<(radius||1.2)) damageZombie(z,dmg);
    }
  });
  Object.keys(players).forEach(function(k){
    var pl = players[k]; if(pl.dead) return;
    var to = pl.pos.clone().add(new THREE.Vector3(0,2.5,0)).sub(origin);
    var proj = to.dot(dir);
    if(proj>0 && proj<range){
      var perp = to.clone().sub(dir.clone().multiplyScalar(proj)).length();
      if(perp<(radius||1.2)) damagePlayer(pl,dmg,'me');
    }
  });
}
function damageZombie(z,dmg){
  z.hp -= dmg;
  z.group.position.y = 0.4;
  if(z.hp<=0){ z.dead=true; z.deadT=3; z.hp=0; killCount++; updateHUD(); }
  z.hbFill.scale.x = Math.max(z.hp/z.maxhp, 0.01);
}
function damagePlayer(pl,dmg,from){
  if(pl === me){
    if(adminState.god) { me.hp = 100; return; }
    me.lastHitBy = from || 'rocket';
    me.hp -= dmg; me.regen = 0;
    updateHUD();
    if(me.hp<=0){ me.hp=0; killPlayer(me); }
  } else {
    pl.hp -= dmg;
    pl.hbFill.scale.x = Math.max(pl.hp/100, 0.01);
    netSend({t:'hit', v:pl.name, dmg:dmg, by:nick});
    if(pl.hp<=0){ killCount++; updateHUD(); killPlayer(pl); }
  }
}
function killPlayer(ent){
  ent.dead = true; ent.deadT = 3;
  ent.group.rotation.x = Math.PI/2; ent.group.position.y = 0.5;
  if(ent === me){
    document.getElementById('deathScreen').style.display='flex';
    netSend({t:'kill', k:(me.lastHitBy||'?'), v:nick});
  }
}
function respawnPlayer(ent){
  ent.dead=false; ent.hp=100; ent.group.rotation.x=0; ent.group.position.y=0;
  ent.pos.set(0,0,8); ent.y=0; ent.vel=0;
  ent.hbFill.scale.x = 1;
  if(ent===me){ document.getElementById('deathScreen').style.display='none'; updateHUD(); }
}
function updateHUD(){
  document.getElementById('scorePill').innerHTML = 'Kills: '+killCount+' &nbsp;|&nbsp; HP: '+Math.round(me.hp);
}
</script>

<script>
// ===== CONTROLS =====
var keys = {}, joyVec = {x:0,y:0}, camYaw = Math.PI, camPitch = 0.35, camDist = 8;
var camTouchId = null, lastTouch = {x:0,y:0};
document.addEventListener('keydown', function(e){
  keys[e.code] = true;
  if(!gameOn) return;
  if(e.code==='Digit1') setWeapon(0);
  if(e.code==='Digit2') setWeapon(1);
  if(e.code==='Digit3') setWeapon(2);
  if(e.code==='Space'){ e.preventDefault(); jump(); }
  if(e.code==='KeyF'){ adminCmd('fly'); }
  if(e.code==='KeyK'){ toggleAdmin(); }
  if(e.code==='KeyT'){ e.preventDefault(); openChat(); }
  if(e.code==='Enter' && chatOpen){ sendChat(); }
  if(e.code==='Escape' && chatOpen) closeChat();
});
document.addEventListener('keyup', function(e){ keys[e.code]=false; });
document.addEventListener('mousemove', function(e){
  if(document.pointerLockElement){ camYaw -= e.movementX*0.0025; camPitch = Math.max(0.05,Math.min(1.2, camPitch + e.movementY*0.0025)); }
});
document.addEventListener('click', function(e){
  if(gameOn && !chatOpen && !mobileUI && e.target===renderer.domElement) renderer.domElement.requestPointerLock();
});
document.addEventListener('mousedown', function(e){
  if(gameOn && !chatOpen && document.pointerLockElement) attack();
});
function jump(){
  if(me.dead) return;
  if(adminState.fly){ /* nothing */ }
  else if(me.y<=0.01){ me.vel = adminState.jump2 ? 13 : 9; }
}
// joystick
(function(){
  var joy = document.getElementById('joy'), knob = document.getElementById('joyKnob');
  var active = false, jid = null;
  function upd(t){
    var r = joy.getBoundingClientRect();
    var dx = t.clientX - (r.left+r.width/2), dy = t.clientY - (r.top+r.height/2);
    var max = r.width/2 - 20, len = Math.min(Math.sqrt(dx*dx+dy*dy), max);
    var ang = Math.atan2(dy,dx);
    knob.style.left = (34+Math.cos(ang)*len)+'px';
    knob.style.top = (34+Math.sin(ang)*len)+'px';
    joyVec.x = Math.cos(ang)*len/max; joyVec.y = Math.sin(ang)*len/max;
  }
  joy.addEventListener('touchstart', function(e){ e.preventDefault(); active=true; jid=e.changedTouches[0].identifier; upd(e.changedTouches[0]); });
  joy.addEventListener('touchmove', function(e){ e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++) if(e.changedTouches[i].identifier===jid) upd(e.changedTouches[i]);
  });
  joy.addEventListener('touchend', function(e){ active=false; joyVec={x:0,y:0}; knob.style.left='34px'; knob.style.top='34px'; });
})();
// camera swipe zone
document.addEventListener('touchstart', function(e){
  if(!gameOn) return;
  for(var i=0;i<e.touches.length;i++){
    var t = e.touches[i];
    var el = document.elementFromPoint(t.clientX,t.clientY);
    if(el && (el.closest && (el.closest('#joy')||el.closest('.cbtn')||el.closest('.slot')||el.closest('.miniBtn')||el.closest('#adminPanel')||el.closest('#chatInputWrap')))) continue;
    if(t.clientX > innerWidth*0.35){ camTouchId = t.identifier; lastTouch={x:t.clientX,y:t.clientY}; }
  }
});
document.addEventListener('touchmove', function(e){
  for(var i=0;i<e.touches.length;i++){
    var t = e.touches[i];
    if(t.identifier===camTouchId){
      camYaw -= (t.clientX-lastTouch.x)*0.006;
      camPitch = Math.max(0.05,Math.min(1.2, camPitch + (t.clientY-lastTouch.y)*0.004));
      lastTouch = {x:t.clientX,y:t.clientY};
    }
  }
});
document.addEventListener('touchend', function(e){
  for(var i=0;i<e.changedTouches.length;i++) if(e.changedTouches[i].identifier===camTouchId) camTouchId=null;
});
// action buttons
(function(){
  var j=document.getElementById('jumpBtn'), a=document.getElementById('atkBtn'), d=document.getElementById('downBtn');
  j.addEventListener('touchstart', function(e){ e.preventDefault(); jump(); });
  j.addEventListener('mousedown', function(e){ jump(); });
  a.addEventListener('touchstart', function(e){ e.preventDefault(); attack(); });
  a.addEventListener('mousedown', function(e){ attack(); });
  d.addEventListener('touchstart', function(e){ e.preventDefault(); me.flyDown = true; });
  d.addEventListener('touchend', function(e){ me.flyDown = false; });
})();
// hotbar clicks (desktop + mobile)
document.querySelectorAll('.slot').forEach(function(s,i){
  s.addEventListener('click', function(){ if(me) setWeapon(i); });
  s.addEventListener('touchstart', function(e){ e.preventDefault(); if(me) setWeapon(i); });
});
// admin panel / chat buttons
function toggleAdmin(){ var p=document.getElementById('adminPanel'); p.style.display = p.style.display==='block'?'none':'block'; }
bind('btnAdmin', toggleAdmin);
bind('btnMenu', function(){ location.reload(); });
document.querySelectorAll('#adminPanel button').forEach(function(b){
  b.addEventListener('click', function(){ adminCmd(b.dataset.cmd); });
});

// ===== CHAT =====
var chatOpen = false;
function openChat(){
  if(!gameOn || chatOpen) return;
  chatOpen = true;
  document.getElementById('chatInputWrap').style.display='block';
  var ci = document.getElementById('chatInput');
  ci.value=''; setTimeout(function(){ ci.focus(); },50);
  if(document.exitPointerLock) document.exitPointerLock();
}
function closeChat(){
  chatOpen = false;
  document.getElementById('chatInputWrap').style.display='none';
  document.getElementById('chatInput').blur();
}
bind('btnChat', function(){ chatOpen?closeChat():openChat(); });
document.getElementById('chatInput').addEventListener('keydown', function(e){
  e.stopPropagation();
  if(e.code==='Enter'){ sendChat(); }
  if(e.code==='Escape') closeChat();
});
function sendChat(){
  var ci = document.getElementById('chatInput');
  var txt = ci.value.trim();
  closeChat();
  if(!txt) return;
  if(txt.charAt(0)===';'){ doCommand(txt.slice(1)); return; }
  chatMsg(nick, txt);
  netSend({t:'chat', m:nick+': '+txt});
}
function doCommand(raw){
  var parts = raw.trim().split(/\s+/);
  var cmd = (parts[0]||'').toLowerCase();
  if(cmd==='help'){
    chatMsg('ADMIN','Commands: ;help ;fly ;god ;speed ;jump ;night ;rain ;disco ;spawn ;tree ;killall ;tpspawn');
    return;
  }
  var map = {fly:'fly', god:'god', speed:'speed2', jump:'jump2', big:'big', small:'small',
             night:'night', rain:'rain', disco:'disco', spawn:'spawn', tree:'tree',
             killall:'killall', tp:'tpspawn', tpspawn:'tpspawn'};
  if(map[cmd]){ adminCmd(map[cmd]); return; }
  chatMsg('ADMIN','Unknown command. Try ;help');
}
function chatMsg(who, text){
  var log = document.getElementById('chatLog');
  var d = document.createElement('div');
  d.innerHTML = '<b>'+who+':</b> '+text.replace(/[<>]/g,'');
  log.appendChild(d);
  while(log.children.length>6) log.removeChild(log.firstChild);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 10000);
}

// ===== ADMIN =====
var adminState = {fly:false, god:false, speed2:false, jump2:false, size:1};
function adminCmd(cmd, silent){
  if(!me) return;
  switch(cmd){
    case 'fly': adminState.fly=!adminState.fly; chatMsg('ADMIN','Fly '+(adminState.fly?'ON':'OFF')); me.flyDown=false; break;
    case 'god': adminState.god=!adminState.god; chatMsg('ADMIN','God mode '+(adminState.god?'ON':'OFF')); break;
    case 'speed2': adminState.speed2=!adminState.speed2; chatMsg('ADMIN','Speed x2 '+(adminState.speed2?'ON':'OFF')); break;
    case 'jump2': adminState.jump2=!adminState.jump2; chatMsg('ADMIN','Jump x2 '+(adminState.jump2?'ON':'OFF')); break;
    case 'big': adminState.size=Math.min(adminState.size+0.25,3); me.scale=adminState.size; me.group.scale.set(adminState.size,adminState.size,adminState.size); break;
    case 'small': adminState.size=Math.max(adminState.size-0.25,0.4); me.scale=adminState.size; me.group.scale.set(adminState.size,adminState.size,adminState.size); break;
    case 'spawn': spawnZombies(1); chatMsg('ADMIN','Dummy spawned'); break;
    case 'tree': plantTree(me.pos.x+3, me.pos.z); chatMsg('ADMIN','Tree planted'); break;
    case 'killall': zombies.forEach(function(z){ if(!z.dead) damageZombie(z,999); }); chatMsg('ADMIN','All dummies eliminated'); break;
    case 'rain': raining=!raining; toggleRain(); chatMsg('ADMIN','Rain '+(raining?'ON':'OFF')); break;
    case 'night': isNight=!isNight; scene.background.set(isNight?0x0a0a2a:0x87ceeb);
      scene.fog.color.set(isNight?0x0a0a2a:0x87ceeb); chatMsg('ADMIN', isNight?'Night':'Day'); break;
    case 'disco': disco=!disco; chatMsg('ADMIN','Disco '+(disco?'ON':'OFF')); break;
    case 'tpspawn': me.pos.set(0,0,8); me.y=0; chatMsg('ADMIN','Teleported to spawn'); break;
  }
  if(!silent) netSend({t:'adm', c:cmd, v:nick});
}
function toggleRain(){
  if(raining){
    var g = new THREE.BufferGeometry();
    var pos = [];
    for(var i=0;i<800;i++) pos.push((Math.random()-0.5)*180, Math.random()*40, (Math.random()-0.5)*180);
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    rainMesh = new THREE.Points(g, new THREE.PointsMaterial({color:0x88aaff,size:0.25}));
    scene.add(rainMesh);
  } else if(rainMesh){ scene.remove(rainMesh); rainMesh=null; }
}

// ===== EFFECTS =====
var swordFx = [];
function swordSwing(){
  var ring = new THREE.Mesh(new THREE.RingGeometry(1,4.2,24), new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.5,side:THREE.DoubleSide}));
  ring.rotation.x = -Math.PI/2; ring.position.copy(me.pos).add(new THREE.Vector3(0,1.2,0));
  scene.add(ring); swordFx.push({m:ring,t:0});
}
var tracers = [];
function tracer(a,b){
  var g = new THREE.BufferGeometry().setFromPoints([a,b]);
  var line = new THREE.Line(g, new THREE.LineBasicMaterial({color:0xffd700,transparent:true,opacity:0.9}));
  scene.add(line); tracers.push({m:line,t:0});
}
var rockets = [], booms = [];
function rocketFire(origin,dir){
  var r = box(0.4,0.4,1.4,0xff4400,0,0,0,false);
  r.position.copy(origin); r.quaternion.copy(camera.quaternion);
  scene.add(r);
  rockets.push({m:r, dir:dir.clone().multiplyScalar(28), pos:origin.clone(), from:nick});
}
function explode(p, fromName){
  var s = new THREE.Mesh(new THREE.SphereGeometry(0.5,12,12), new THREE.MeshBasicMaterial({color:0xffaa00,transparent:true,opacity:0.9}));
  s.position.copy(p); scene.add(s); booms.push({m:s,t:0});
  var R = 6;
  zombies.forEach(function(z){
    if(z.dead) return;
    var d = z.pos.distanceTo(p);
    if(d<R) damageZombie(z, Math.round(60*(1-d/R)));
  });
  Object.keys(players).forEach(function(k){
    var pl = players[k]; if(pl.dead) return;
    var d = pl.pos.distanceTo(p);
    if(d<R) damagePlayer(pl, Math.round(60*(1-d/R)), fromName);
  });
  var dm = me.pos.distanceTo(p);
  if(dm<R && !adminState.god){ me.hp -= Math.round(60*(1-dm/R)); updateHUD(); if(me.hp<=0){ me.hp=0; killPlayer(me); } }
}

// ===== MULTIPLAYER (PeerJS, host-relay star) =====
var MY_PID = 'me-'+Math.random().toString(36).slice(2,8);
function netSend(obj){
  obj.pid = MY_PID;
  Object.keys(conns).forEach(function(k){
    try{ if(conns[k].open) conns[k].send(obj); }catch(e){}
  });
}
function initClient(code, host){
  MODE = host ? 'host' : 'guest';
  ROOM_CODE = code; IS_HOST = host;
  try{
    NET = new Peer(host ? ('miniblox-'+code) : null, {debug:1});
    NET.on('open', function(){
      NET_READY = true; MY_PID = NET.id;
      document.getElementById('playersPill').textContent = 'Room '+code;
      if(host) chatMsg('SYSTEM','Room created! Code: '+code+' — share it with friends');
      if(!host){
        var c = NET.connect('miniblox-'+code, {reliable:true});
        conns['host'] = c;
        c.on('open', function(){ c.send({t:'hi', n:nick, pid:MY_PID}); chatMsg('SYSTEM','Joined room '+code); });
        c.on('data', function(d){ onNetData(d, 'host'); });
        c.on('close', function(){ chatMsg('SYSTEM','Disconnected from host'); });
      }
    });
    NET.on('connection', function(c){
      conns[c.peer] = c;
      c.on('data', function(d){ onNetData(d, c.peer); });
      c.on('close', function(){ removeRemote(c.peer); });
    });
    NET.on('error', function(e){
      var msg = 'NETWORK: '+(e.type||'unknown');
      if(gameOn) chatMsg('SYSTEM', msg+' — try another code'); else showErr(msg);
    });
  }catch(e){
    var msg2 = 'NET ERROR: '+e.message;
    if(gameOn) chatMsg('SYSTEM', msg2); else showErr(msg2);
  }
}
function onNetData(d, fromPid){
  if(!d || !d.t) return;
  if(IS_HOST){ // relay to everyone except the sender
    Object.keys(conns).forEach(function(k){
      if(k!==fromPid){ try{ if(conns[k].open) conns[k].send(d); }catch(e){} }
    });
  }
  if(d.t==='hi'){
    if(d.pid && !players[d.pid]) addRemote(d.pid, d.n||'Player');
    chatMsg('SYSTEM', (d.n||'Player')+' joined');
  }
  else if(d.t==='pos'){
    if(d.pid===MY_PID) return;
    if(!players[d.pid]) addRemote(d.pid, d.n||'Player');
    var pl = players[d.pid];
    pl.pos.set(d.p[0], d.p[1], d.p[2]);
    pl.group.rotation.y = d.r;
    pl.hbFill.scale.x = Math.max((d.hp||100)/100, 0.01);
    pl.walking = d.wk;
  }
  else if(d.t==='atk'){
    var o = new THREE.Vector3(d.p[0],d.p[1],d.p[2]);
    var dir = new THREE.Vector3(d.d[0],d.d[1],d.d[2]);
    if(d.w===0){ swordFxRemote(o,dir); }
    else if(d.w===1){ tracer(o, o.clone().add(dir.multiplyScalar(60))); }
    else { var rm = box(0.4,0.4,1.4,0xff4400,0,0,0,false);
      rockets.push({m:rm, dir:dir.clone().multiplyScalar(28), pos:o.clone(), from:d.n||'?'}); }
  }
  else if(d.t==='hit'){
    if(d.v === nick && !adminState.god){
      me.lastHitBy = d.by || '?';
      me.hp -= d.dmg; me.regen = 0; updateHUD();
      if(me.hp<=0){ me.hp=0; killPlayer(me); }
    }
  }
  else if(d.t==='kill'){
    chatMsg('SERVER', d.k+' knocked out '+d.v);
  }
  else if(d.t==='chat'){
    var i2 = d.m.indexOf(': ');
    chatMsg(d.m.slice(0,i2), d.m.slice(i2+2));
  }
  else if(d.t==='adm'){
    adminCmdLocal(d.c);
    chatMsg('ADMIN', (d.v||'?')+' used ;'+d.c);
  }
}
function addRemote(pid, name){
  players[pid] = makePlayer(false, name, pid);
  document.getElementById('playersPill').textContent = 'Room '+ROOM_CODE+' ('+(Object.keys(players).length+1)+')';
}
function removeRemote(pid){
  if(players[pid]){ scene.remove(players[pid].group); delete players[pid]; }
}
function swordFxRemote(o,dir){
  var ring = new THREE.Mesh(new THREE.RingGeometry(1,4.2,24), new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.5,side:THREE.DoubleSide}));
  ring.rotation.x = -Math.PI/2; ring.position.copy(o); ring.position.y = 1.2;
  scene.add(ring); swordFx.push({m:ring,t:0});
}
function adminCmdLocal(cmd){ try{ adminCmd(cmd, true); }catch(e){} }

// ===== MAIN LOOP =====
var frame = 0, fpsT = 0, fpsC = 0;
function animate(){
  requestAnimationFrame(animate);
  if(!gameOn) return;
  var dt = Math.min(clock.getDelta(), 0.05);
  updatePlayer(dt);
  updateZombies(dt);
  updateEffects(dt);
  updateRemote(dt);
  cameraUpdate(dt);
  if(raining) rainUpdate();
  if(disco){ discoHue += dt*80; scene.background.setHSL((discoHue%360)/360, 0.6, 0.25); }
  renderer.render(scene, camera);
  fpsC++; fpsT += dt;
  if(fpsT>0.5){ document.getElementById('fpsPill').textContent = 'FPS: '+Math.round(fpsC/fpsT); fpsC=0; fpsT=0; }
}
function updatePlayer(dt){
  // cooldowns
  WEAPONS.forEach(function(w){ if(w.cd>0) w.cd -= dt; });
  if(me.attackAnim>0){ me.attackAnim -= dt;
    me.wHolder.rotation.x = -Math.sin(me.attackAnim/0.35*Math.PI)*1.2; }
  else me.wHolder.rotation.x = 0;
  if(me.dead){ me.deadT -= dt; if(me.deadT<=0) respawnPlayer(me); return; }
  // movement
  var spd = (adminState.speed2?14:7) * (adminState.fly?1.6:1);
  var mx = 0, mz = 0;
  if(keys['KeyA']||keys['ArrowLeft']) mx -= 1;
  if(keys['KeyD']||keys['ArrowRight']) mx += 1;
  if(keys['KeyW']||keys['ArrowUp']) mz -= 1;
  if(keys['KeyS']||keys['ArrowDown']) mz += 1;
  mx += joyVec.x; mz += joyVec.y;
  var len = Math.sqrt(mx*mx+mz*mz);
  if(len>1){ mx/=len; mz/=len; }
  var sinY = Math.sin(camYaw), cosY = Math.cos(camYaw);
  var wx = (mx*cosY - mz*sinY)*spd*dt;
  var wz = (mx*sinY + mz*cosY)*spd*dt;
  me.pos.x = THREE.MathUtils.clamp(me.pos.x+wx, -115, 115);
  me.pos.z = THREE.MathUtils.clamp(me.pos.z+wz, -115, 115);
  // gravity / fly
  if(adminState.fly){
    me.vel = 0;
    if(keys['Space']) me.y += 8*dt;
    if(keys['ShiftLeft']||keys['ShiftRight']||me.flyDown) me.y -= 8*dt;
    me.y = Math.max(me.y, 0);
  } else {
    me.vel -= 24*dt;
    me.y += me.vel*dt;
    if(me.y<=0){ me.y=0; me.vel=0; }
  }
  // animation
  var moving = len>0.05;
  me.walkPhase += (moving?dt*10:0);
  var sw = moving? Math.sin(me.walkPhase)*0.6 : 0;
  me.armL.rotation.x = sw; me.armR.rotation.x = -sw;
  me.legL.rotation.x = -sw; me.legR.rotation.x = sw;
  // apply
  me.group.position.set(me.pos.x, me.y*me.scale, me.pos.z);
  var face = Math.atan2(-wx, -wz) + Math.PI;
  if(moving) me.group.rotation.y = face;
  // hp regen
  me.regen = (me.regen||0) + dt;
  if(me.regen>5 && me.hp<100){ me.hp = Math.min(100, me.hp + 5*dt); updateHUD(); }
  // net pos
  if(NET_READY) netSend({t:'pos', n:nick, p:[me.pos.x, me.y, me.pos.z], r:me.group.rotation.y, wk:moving?1:0, hp:me.hp});
}
function cameraUpdate(dt){
  var off = new THREE.Vector3(Math.sin(camYaw)*Math.cos(camPitch), Math.sin(camPitch), Math.cos(camYaw)*Math.cos(camPitch)).multiplyScalar(camDist);
  var target = me.pos.clone().add(new THREE.Vector3(0, 3.5 + (adminState.fly? me.y:me.y), 0));
  camera.position.copy(target).add(off);
  camera.position.y = Math.max(camera.position.y, 1.5);
  camera.lookAt(target);
}
function updateZombies(dt){
  zombies.forEach(function(z){
    if(z.dead){ z.deadT -= dt; z.group.rotation.x = Math.PI/2;
      if(z.deadT<=0){ z.dead=false; z.hp=z.maxhp; z.group.rotation.x=0; z.hbFill.scale.x=1;
        var ang=Math.random()*Math.PI*2, rad=25+Math.random()*70;
        z.pos.set(Math.cos(ang)*rad,0,Math.sin(ang)*rad); }
      return; }
    // wander
    z.dir += (Math.random()-0.5)*0.5;
    var dx = Math.cos(z.dir)*z.speed*dt, dz = Math.sin(z.dir)*z.speed*dt;
    z.pos.x = THREE.MathUtils.clamp(z.pos.x+dx, -110,110);
    z.pos.z = THREE.MathUtils.clamp(z.pos.z+dz, -110,110);
    z.group.position.set(z.pos.x,0,z.pos.z);
    z.group.rotation.y = -z.dir;
    z.walk += dt*8;
    var s = Math.sin(z.walk)*0.5;
    z.legL.rotation.x = -s; z.legR.rotation.x = s;
    // chase player if close
    var dp = z.pos.distanceTo(me.pos);
    if(dp<20 && !me.dead){
      var dir = me.pos.clone().sub(z.pos); dir.y=0; dir.normalize();
      z.pos.add(dir.multiplyScalar(z.speed*1.4*dt));
      z.group.rotation.y = Math.atan2(dir.x, dir.z)+Math.PI;
      if(dp<2 && Math.random()<dt*1.5 && !adminState.god){
        me.hp -= 8; me.regen = 0; updateHUD();
        if(me.hp<=0){ me.hp=0; killPlayer(me); }
      }
    }
  });
}
function updateEffects(dt){
  swordFx.forEach(function(fx,i){ fx.t+=dt; fx.m.scale.set(1+fx.t*4,1+fx.t*4,1); fx.m.material.opacity = Math.max(0.5 - fx.t*2, 0);
    if(fx.t>0.3){ scene.remove(fx.m); fx.dead=true; } });
  swordFx = swordFx.filter(function(fx){ return !fx.dead; });
  tracers.forEach(function(tr){ tr.t+=dt; tr.m.material.opacity = Math.max(0.9-tr.t*3,0);
    if(tr.t>0.3){ scene.remove(tr.m); tr.dead=true; } });
  tracers = tracers.filter(function(tr){ return !tr.dead; });
  rockets.forEach(function(r){
    r.pos.add(r.dir.clone().multiplyScalar(dt));
    r.m.position.copy(r.pos);
    var hit = false;
    zombies.forEach(function(z){ if(!z.dead && z.pos.distanceTo(r.pos)<2) hit=true; });
    Object.keys(players).forEach(function(k){ if(!players[k].dead && players[k].pos.distanceTo(r.pos)<2) hit=true; });
    if(r.pos.y<=0.2 || hit || Math.abs(r.pos.x)>120 || Math.abs(r.pos.z)>120){
      explode(r.pos, r.from); scene.remove(r.m); r.dead=true;
    }
  });
  rockets = rockets.filter(function(r){ return !r.dead; });
  booms.forEach(function(b){ b.t+=dt; b.m.scale.set(1+b.t*14,1+b.t*14,1); b.m.material.opacity = Math.max(0.9-b.t*2.5,0);
    if(b.t>0.5){ scene.remove(b.m); b.dead=true; } });
  booms = booms.filter(function(b){ return !b.dead; });
}
function updateRemote(dt){
  Object.keys(players).forEach(function(k){
    var p = players[k];
    if(p.dead){ p.deadT-=dt; if(p.deadT<=0) respawnPlayer(p); return; }
    p.walkPhase += 0.1;
    var s = Math.sin(p.walkPhase)*0.5;
    p.armL.rotation.x = s; p.armR.rotation.x = -s;
    p.legL.rotation.x = -s; p.legR.rotation.x = s;
    p.group.position.set(p.pos.x, p.pos.y, p.pos.z);
    // faces camera-ish tag
  });
}
function rainUpdate(){
  var pos = rainMesh.geometry.attributes.position;
  for(var i=0;i<pos.count;i++){
    var y = pos.getY(i) - 25*0.016;
    if(y<0) y = 40;
    pos.setY(i,y);
  }
  pos.needsUpdate = true;
}
