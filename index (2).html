<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mini Blox Online</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;color:#fff;
    font-family:'Segoe UI',Roboto,Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{display:block}
  #menu{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(900px 500px at 15% 15%,#1b2a6e 0%,transparent 55%),
               radial-gradient(800px 500px at 85% 80%,#5e1b4a 0%,transparent 55%),
               linear-gradient(160deg,#0b1020,#121a38);
    overflow:hidden}
  #menu .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;pointer-events:none}
  #b1{width:340px;height:340px;background:#2b5cff;top:-80px;left:-60px;animation:fl 9s ease-in-out infinite alternate}
  #b2{width:300px;height:300px;background:#ff2b7b;bottom:-70px;right:-50px;animation:fl 11s ease-in-out infinite alternate-reverse}
  @keyframes fl{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,30px) scale(1.15)}}
  #card{position:relative;background:rgba(255,255,255,.06);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:32px 34px;
    width:min(420px,92vw);box-shadow:0 30px 80px rgba(0,0,0,.55)}
  #card h1{margin:0 0 2px;font-size:30px;letter-spacing:1px}
  #card p.sub{margin:0 0 18px;opacity:.65;font-size:13px}
  #card input{width:100%;margin:6px 0;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.08);color:#fff;font-size:16px;outline:none}
  #card input::placeholder{color:rgba(255,255,255,.4)}
  #card button{width:100%;margin:6px 0;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;
    color:#fff;cursor:pointer;background:rgba(255,255,255,.1);transition:.15s}
  #card button:hover{transform:translateY(-1px);filter:brightness(1.2)}
  #card button.primary{background:linear-gradient(135deg,#3b82f6,#2563eb)}
  .row{display:flex;gap:8px}.row>*{flex:1}
  #err{color:#ff8080;font-size:13px;min-height:18px;margin-top:8px;white-space:pre-wrap}
  #build{position:fixed;top:10px;right:14px;z-index:61;font-size:11px;letter-spacing:2px;opacity:.55}
  /* game UI */
  #ui{display:none}
  #hud{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:8px;align-items:center;
    background:rgba(0,0,0,.45);padding:7px 12px;border-radius:14px;font-size:13px;white-space:nowrap}
  #hud b{color:#ffd34d}
  #copyCode{background:#3b82f6;border:0;color:#fff;border-radius:8px;padding:4px 8px;cursor:pointer;font-size:12px}
  #hpwrap{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(320px,60vw);height:12px;
    background:rgba(0,0,0,.5);border-radius:8px;z-index:20;overflow:hidden}
  #hpbar{height:100%;width:100%;background:linear-gradient(90deg,#35d07f,#7bed6b);transition:width .2s}
  #hotbar{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:20}
  .slot{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px 14px;
    font-size:13px;cursor:pointer;color:#fff}
  .slot.on{background:#3b82f6;border-color:#3b82f6}
  #cross{position:fixed;top:50%;left:50%;width:6px;height:6px;margin:-3px;border-radius:50%;
    background:rgba(255,255,255,.85);z-index:20;box-shadow:0 0 4px #000}
  #chat{position:fixed;left:10px;bottom:10px;width:min(340px,70vw);z-index:22;font-size:13px}
  #msgs{max-height:130px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:6px}
  #msgs div{background:rgba(0,0,0,.4);border-radius:8px;padding:3px 8px;margin-top:3px;width:fit-content;max-width:100%}
  #chatin{display:none;width:100%;padding:8px 10px;border-radius:10px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px}
  /* touch */
  #stickZone{position:fixed;left:0;bottom:0;width:45vw;height:45vh;z-index:15}
  #stick{position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.3);display:none;pointer-events:none}
  #knob{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.55);
    left:31px;top:31px;pointer-events:none}
  .tbtn{position:fixed;z-index:21;width:74px;height:74px;border-radius:50%;border:0;font-size:13px;font-weight:700;
    color:#fff;background:rgba(255,255,255,.16);backdrop-filter:blur(4px)}
  #btnJump{right:24px;bottom:110px}
  #btnAtk{right:110px;bottom:34px;width:86px;height:86px;background:rgba(59,130,246,.5)}
  #gear{position:fixed;top:8px;right:8px;z-index:23;width:38px;height:38px;border-radius:10px;border:0;
    background:rgba(0,0,0,.5);color:#fff;font-size:18px;cursor:pointer}
  #admin{position:fixed;top:54px;right:8px;z-index:24;display:none;background:rgba(10,14,30,.92);
    border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:10px;width:190px}
  #admin button{display:block;width:100%;margin:4px 0;padding:8px;border:0;border-radius:9px;
    background:rgba(255,255,255,.12);color:#fff;cursor:pointer;font-size:13px}
  #deadmsg{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);z-index:30;font-size:34px;
    font-weight:800;color:#ff5b5b;text-shadow:0 2px 8px #000;display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div id="build">BUILD 3.4</div>

<div id="menu">
  <div class="blob" id="b1"></div><div class="blob" id="b2"></div>
  <div id="card">
    <h1>MINI BLOX ONLINE</h1>
    <p class="sub">multiplayer sandbox &middot; no downloads, just play</p>
    <input id="nickin" maxlength="14" placeholder="Your nickname" autocomplete="off">
    <button id="btnSolo" class="primary">PLAY SOLO</button>
    <div class="row">
      <button id="btnCreate">CREATE ROOM</button>
      <button id="btnJoin">JOIN ROOM</button>
    </div>
    <input id="codein" maxlength="4" placeholder="Room code (e.g. K7X2)" autocomplete="off" style="text-transform:uppercase">
    <div id="err"></div>
  </div>
</div>

<div id="ui">
  <div id="hud"></div>
  <div id="gear">&#9881;</div>
  <div id="admin">
    <button data-c="fly">Toggle Fly</button>
    <button data-c="god">Toggle God Mode</button>
    <button data-c="night">Toggle Night</button>
    <button data-c="rain">Toggle Rain</button>
    <button data-c="heal">Heal</button>
    <button data-c="close">Close</button>
  </div>
  <div id="cross"></div>
  <div id="hpwrap"><div id="hpbar"></div></div>
  <div id="hotbar">
    <div class="slot on" data-w="0">1 Sword</div>
    <div class="slot" data-w="1">2 Pistol</div>
    <div class="slot" data-w="2">3 Rocket</div>
  </div>
  <div id="chat">
    <div id="msgs"></div>
    <input id="chatin" maxlength="120" placeholder="Chat... (commands start with ;)">
  </div>
  <div id="stickZone"><div id="stick"><div id="knob"></div></div></div>
  <button class="tbtn" id="btnJump">JUMP</button>
  <button class="tbtn" id="btnAtk">ATTACK</button>
  <div id="deadmsg">YOU DIED</div>
</div>

<script>
"use strict";
function $(i){return document.getElementById(i)}
var ME={nick:"Player",id:"solo",mode:"solo",code:""};
var conns=[],hostConn=null,peer=null;
var G=null,MY=null,zombies=[],colliders=[],platforms=[],projectiles=[],fx=[],clouds=[],rainSys=null,rainOn=false,nightOn=false;
var remote={};          // id -> {g,label,parts,last}
var curW=0;
var weapons=["Sword","Pistol","Rocket"];
var touchMode=("ontouchstart" in window)||navigator.maxTouchPoints>0;

/* ---------- MENU WIRED FIRST, before anything heavy ---------- */
function showErr(m){$("err").textContent=m||""}
window.addEventListener("error",function(e){if(!G)showErr("Script error: "+e.message)});
$("btnSolo").onclick=function(){ME.nick=readNick();enterGame("solo","")};
$("btnCreate").onclick=function(){
  ME.nick=readNick();
  if(typeof Peer==="undefined"){showErr("Network library not loaded. Check your internet connection and refresh.");return}
  showErr("Creating room...");
  var code=genCode();
  peer=new Peer("mbxq"+code,{debug:0});
  peer.on("open",function(){showErr("");enterGame("host",code)});
  peer.on("error",function(e){showErr(e.type==="unavailable-id"?"Room code is taken, try again":"Network: "+e.type)});
  peer.on("connection",function(c){setupConn(c)});
};
$("btnJoin").onclick=function(){
  ME.nick=readNick();
  var code=$("codein").value.trim().toUpperCase();
  if(code.length<3){showErr("Enter the room code first");return}
  if(typeof Peer==="undefined"){showErr("Network library not loaded. Check your internet connection and refresh.");return}
  showErr("Connecting...");
  peer=new Peer({debug:0});
  peer.on("open",function(){
    var c=peer.connect("mbxq"+code,{reliable:true});
    var ok=false;
    c.on("open",function(){ok=true;showErr("");hostConn=c;conns=[c];enterGame("client",code)});
    c.on("data",onNet);
    c.on("close",function(){addChat("System","Disconnected from host")});
    setTimeout(function(){if(!ok)showErr("Room not found. Check the code and that the host is online.")},7000);
  });
  peer.on("error",function(e){showErr("Network: "+e.type)});
};
function readNick(){
  var v=$("nickin").value.trim();
  if(!v)v="Player"+Math.floor(Math.random()*900+100);
  return v.slice(0,14);
}
function genCode(){
  var s="ABCDEFGHJKMNPQRSTUVWXYZ23456789",r="";
  for(var i=0;i<4;i++)r+=s[Math.floor(Math.random()*s.length)];
  return r;
}

/* ---------- GAME LAUNCH ---------- */
function enterGame(mode,code){
  try{
    ME.mode=mode;ME.code=code;ME.isHost=(mode==="host");
    $("menu").style.display="none";$("ui").style.display="block";
    var W=innerWidth,H=innerHeight;
    G={renderer:new THREE.WebGLRenderer({antialias:true}),scene:new THREE.Scene(),
       camera:new THREE.PerspectiveCamera(70,W/H,0.1,500),clock:new THREE.Clock()};
    G.renderer.setSize(W,H);
    G.renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    document.body.appendChild(G.renderer.domElement);
    buildWorld();
    MY=makeLocal();
    setupInput();
    hudUpdate();
    if(mode==="host"){addChat("System","Room created! Code: "+code+" (share it)");addChat("System","Type ;help for commands")}
    if(mode==="client")addChat("System","Joined room "+code);
    if(mode==="solo")addChat("System","Solo mode. Type ;help for commands");
    requestAnimationFrame(animate);
  }catch(e){
    $("menu").style.display="flex";$("ui").style.display="none";
    showErr("Launch failed: "+e.message);
  }
}

/* ---------- WORLD: classic map + detailed house ---------- */
function buildWorld(){
  var S=G.scene;
  S.background=new THREE.Color(0x87ceeb);
  S.fog=new THREE.Fog(0x87ceeb,60,220);
  var hemi=new THREE.HemisphereLight(0xffffff,0x445522,0.85);S.add(hemi);G.hemi=hemi;
  var sun=new THREE.DirectionalLight(0xfff2cc,0.9);sun.position.set(40,60,20);S.add(sun);G.sun=sun;
  var ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshLambertMaterial({color:0x4c9a3f}));
  ground.rotation.x=-Math.PI/2;S.add(ground);
  var rnd=Math.random;
  // trees
  for(var i=0;i<70;i++){
    var a=rnd()*Math.PI*2,r=15+rnd()*75,x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(Math.abs(x+22)<10&&Math.abs(z+12)<10)continue; // house zone
    if(x*x+z*z<81)continue;                           // pond zone
    makeTree(x,z,2+rnd()*1.6);
  }
  // pond + sand
  var sand=new THREE.Mesh(new THREE.CircleGeometry(11,24),new THREE.MeshLambertMaterial({color:0xd9c489}));
  sand.rotation.x=-Math.PI/2;sand.position.set(0,0.02,0);S.add(sand);
  var water=new THREE.Mesh(new THREE.CircleGeometry(8,24),new THREE.MeshLambertMaterial({color:0x2f7fd4,transparent:true,opacity:0.85}));
  water.rotation.x=-Math.PI/2;water.position.set(0,0.05,0);S.add(water);
  // rocks
  for(i=0;i<12;i++){
    a=rnd()*Math.PI*2;r=14+rnd()*70;
    var rock=new THREE.Mesh(new THREE.DodecahedronGeometry(0.7+rnd()*1.2,0),new THREE.MeshLambertMaterial({color:0x8a8a8a}));
    rock.position.set(Math.cos(a)*r,0.4,Math.sin(a)*r);rock.rotation.set(rnd(),rnd(),rnd());S.add(rock);
  }
  // flowers
  var fcol=[0xff5566,0xffdd44,0xff88cc,0x88ddff,0xffffff];
  for(i=0;i<60;i++){
    a=rnd()*Math.PI*2;r=8+rnd()*80;
    var fg=new THREE.Group();
    var st=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.35,4),new THREE.MeshLambertMaterial({color:0x2e7d32}));
    st.position.y=0.18;fg.add(st);
    var fl=new THREE.Mesh(new THREE.SphereGeometry(0.11,6,5),new THREE.MeshLambertMaterial({color:fcol[i%5]}));
    fl.position.y=0.4;fg.add(fl);
    fg.position.set(Math.cos(a)*r,0,Math.sin(a)*r);S.add(fg);
  }
  // clouds
  for(i=0;i<7;i++){
    var cl=new THREE.Group();
    for(var j=0;j<4;j++){
      var p=new THREE.Mesh(new THREE.SphereGeometry(2+rnd()*2.5,7,6),new THREE.MeshLambertMaterial({color:0xffffff}));
      p.position.set(rnd()*6-3,rnd()*1.4,rnd()*4-2);cl.add(p);
    }
    cl.position.set(rnd()*160-80,26+rnd()*10,rnd()*160-80);
    S.add(cl);clouds.push({g:cl,vx:0.4+rnd()*0.5});
  }
  makeHouse();
  makeRain();
}
function makeTree(x,z,h){
  var g=new THREE.Group();
  var t=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.35,h,6),new THREE.MeshLambertMaterial({color:0x7a4a21}));
  t.position.y=h/2;g.add(t);
  var m=new THREE.MeshLambertMaterial({color:0x2e8b30});
  var s1=new THREE.Mesh(new THREE.SphereGeometry(1.7,7,6),m);s1.position.y=h+0.9;g.add(s1);
  var s2=new THREE.Mesh(new THREE.SphereGeometry(1.2,7,6),m);s2.position.set(0.9,h+0.4,0.3);g.add(s2);
  g.position.set(x,0,z);G.scene.add(g);
  colliders.push({x:x,z:z,hx:0.5,hz:0.5,y0:0,y1:h});
}
function makeHouse(){
  var S=G.scene;
  var wallM=new THREE.MeshLambertMaterial({color:0xd9b98a});
  var roofM=new THREE.MeshLambertMaterial({color:0x8c3b2e});
  var woodM=new THREE.MeshLambertMaterial({color:0x6e4423});
  var frameM=new THREE.MeshLambertMaterial({color:0x5b5b5b});
  var glassM=new THREE.MeshLambertMaterial({color:0x9fd0ff,transparent:true,opacity:0.55});
  function box(w,h,d,x,y,z,mat){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);S.add(m);return m}
  // walls 10 x 8, height 4.4, door gap on front (+z)
  box(4.2,4.4,0.4,-2.9,2.2,4,wallM);   // front left of door
  box(4.2,4.4,0.4, 2.9,2.2,4,wallM);   // front right of door
  box(1.6,2.0,0.4, 0,3.4,4,wallM);     // lintel above door
  box(10,4.4,0.4, 0,2.2,-4,wallM);     // back
  box(0.4,4.4,8.4,-5,2.2,0,wallM);     // left
  box(0.4,4.4,8.4, 5,2.2,0,wallM);     // right
  box(10,0.4,8.4, 0,4.4,0,woodM);      // ceiling trim
  colliders.push({x:0,z:4.2,hx:5,hz:0.3,y0:0,y1:2.4});   // front walls (door gap is walk-through below 2.4 handled by split)
  colliders.push({x:0,z:4.2,hx:0.9,hz:0.3,y0:2.4,y1:4.4}); // door top zone: only blocks if jumping high
  colliders.push({x:0,z:-4.2,hx:5,hz:0.3,y0:0,y1:4.4});
  colliders.push({x:-5.2,z:0,hx:0.3,hz:4.4,y0:0,y1:4.4});
  colliders.push({x:5.2,z:0,hx:0.3,hz:4.4,y0:0,y1:4.4});
  // door + knob
  var door=box(1.4,2.3,0.15,0,1.15,4.05,new THREE.MeshLambertMaterial({color:0x7a4a21}));
  box(0.12,0.12,0.12,0.5,1.2,4.15,new THREE.MeshLambertMaterial({color:0xf2c14e}));
  colliders.push({x:0,z:4.1,hx:0.7,hz:0.1,y0:0,y1:2.3}); // door solid
  // windows: front x=+-3, sides +-5
  function win(x,y,z,rz){
    var gr=new THREE.Group();
    var fr=new THREE.Mesh(new THREE.BoxGeometry(1.7,1.5,0.18),frameM);gr.add(fr);
    var gl=new THREE.Mesh(new THREE.BoxGeometry(1.35,1.15,0.2),glassM);gr.add(gl);
    var mb=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.12,0.24),frameM);mb.position.y=-0.75;gr.add(mb);
    gr.position.set(x,y,z);if(rz)gr.rotation.y=rz;S.add(gr);
  }
  win(-3,2.6,4.12,0);win(3,2.6,4.12,0);
  win(5.12,2.6,2.5,Math.PI/2);win(5.12,2.6,-2.5,Math.PI/2);
  win(-5.12,2.6,2.5,Math.PI/2);win(-5.12,2.6,-2.5,Math.PI/2);
  // gable roof
  var slabG=new THREE.BoxGeometry(11,0.3,5.4);
  var r1=new THREE.Mesh(slabG,roofM);r1.position.set(0,5.5,-1.75);r1.rotation.x=-0.61;S.add(r1);
  var r2=new THREE.Mesh(slabG,roofM);r2.position.set(0,5.5,1.75);r2.rotation.x=0.61;S.add(r2);
  box(0.35,0.35,9,0,6.85,0,roofM); // ridge
  var tri=new THREE.Shape();tri.moveTo(-5,0);tri.lineTo(5,0);tri.lineTo(0,2.45);tri.closePath();
  var triG=new THREE.ExtrudeGeometry(tri,{depth:0.3,bevelEnabled:false});
  var g1=new THREE.Mesh(triG,wallM);g1.position.set(0,4.4,-4.15);S.add(g1);
  var g2=new THREE.Mesh(triG,wallM);g2.position.set(0,4.4,3.85);S.add(g2);
  // chimney
  var chim=new THREE.Mesh(new THREE.BoxGeometry(0.9,2.4,0.9),new THREE.MeshLambertMaterial({color:0xb5493c}));
  chim.position.set(2.6,6.4,0.6);S.add(chim);
  box(1.1,0.25,1.1,2.6,7.7,0.6,new THREE.MeshLambertMaterial({color:0x555555}));
  // porch: platform, columns, small roof, steps
  platforms.push({x:0,z:5.4,hx:1.9,hz:1.2,y:0.6});
  platforms.push({x:0,z:6.9,hx:1.9,hz:0.5,y:0.3});
  var pl=new THREE.Mesh(new THREE.BoxGeometry(3.8,0.25,2.4),woodM);pl.position.set(0,0.48,5.4);S.add(pl);
  var st=new THREE.Mesh(new THREE.BoxGeometry(3.8,0.22,1.0),woodM);st.position.set(0,0.19,6.9);S.add(st);
  var colM=new THREE.MeshLambertMaterial({color:0xe8e0cf});
  box(0.28,2.6,0.28,-1.6,1.9,6.3,colM);box(0.28,2.6,0.28,1.6,1.9,6.3,colM);
  var pr=new THREE.Mesh(new THREE.BoxGeometry(4.2,0.25,2.6),roofM);pr.position.set(0,3.3,5.4);S.add(pr);
}
function makeRain(){
  var n=900,pos=new Float32Array(n*3);
  for(var i=0;i<n;i++){pos[i*3]=Math.random()*80-40;pos[i*3+1]=Math.random()*30;pos[i*3+2]=Math.random()*80-40}
  var geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  rainSys=new THREE.Points(geo,new THREE.PointsMaterial({color:0x9db8ff,size:0.18,transparent:true,opacity:0.7}));
  rainSys.visible=false;G.scene.add(rainSys);
}

/* ---------- CHARACTERS ---------- */
function limb(w,h,d,x,y,z,mat){
  var geo=new THREE.BoxGeometry(w,h,d);geo.translate(0,-h/2,0);
  var m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);return m;
}
function makeAvatar(shirt,pants,skin,isZombie){
  var g=new THREE.Group();
  var mS=new THREE.MeshLambertMaterial({color:shirt});
  var mP=new THREE.MeshLambertMaterial({color:pants});
  var mK=new THREE.MeshLambertMaterial({color:skin});
  function box(w,h,d,x,y,z,mat){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);g.add(m);return m}
  var torso=box(0.8,1.0,0.42,0,1.15,0,mS);

/* ---------- COLLISION ---------- */
function groundHeightAt(x,z,y){
  var h=0;
  for(var i=0;i<platforms.length;i++){var p=platforms[i];
    if(Math.abs(x-p.x)<=p.hx&&Math.abs(z-p.z)<=p.hz&&y>=p.y-0.55)h=Math.max(h,p.y);
  }
  return h;
}
function collide(p,r){
  for(var i=0;i<colliders.length;i++){var c=colliders[i];
    if(p.y+1.7<=c.y0||p.y+0.15>=c.y1)continue;
    var dx=p.x-c.x,dz=p.z-c.z;
    var px=c.hx+r-Math.abs(dx),pz=c.hz+r-Math.abs(dz);
    if(px>0&&pz>0){
      if(px<pz)p.x=c.x+(dx>=0?1:-1)*(c.hx+r);
      else p.z=c.z+(dz>=0?1:-1)*(c.hz+r);
    }
  }
}

/* ---------- INPUT ---------- */
var keys={},dragging=false,lastM={x:0,y:0},joy={on:false,ox:0,oy:0,dx:0,dy:0};
function setupInput(){
  var dom=G.renderer.domElement;
  addEventListener("resize",function(){
    G.camera.aspect=innerWidth/innerHeight;G.camera.updateProjectionMatrix();
    G.renderer.setSize(innerWidth,innerHeight);
  });
  // keyboard
  addEventListener("keydown",function(e){
    if(document.activeElement===$("chatin"))return;
    keys[e.code]=true;
    if(e.code==="KeyF"){MY.fly=!MY.fly;MY.vy=0;addChat("System","Fly "+(MY.fly?"ON":"OFF"))}
    if(e.code==="Digit1"||e.code==="Digit2"||e.code==="Digit3")setWeapon(+e.code.slice(5)-1);
    if(e.code==="KeyT"){e.preventDefault();$("chatin").style.display="block";$("chatin").focus()}
  });
  addEventListener("keyup",function(e){keys[e.code]=false});
  // mouse look
  dom.addEventListener("mousedown",function(e){dragging=true;lastM.x=e.clientX;lastM.y=e.clientY});
  addEventListener("mouseup",function(){dragging=false});
  addEventListener("mousemove",function(e){
    if(!dragging)return;
    MY.yaw-=(e.clientX-lastM.x)*0.004;
    MY.pitch=Math.max(-1.2,Math.min(1.3,MY.pitch+(e.clientY-lastM.y)*0.004));
    lastM.x=e.clientX;lastM.y=e.clientY;
  });
  dom.addEventListener("wheel",function(e){
    e.preventDefault();
    MY.camDist=Math.max(3,Math.min(26,MY.camDist+(e.deltaY>0?1.6:-1.6)));
  },{passive:false});
  // touch: joystick zone + camera swipe + pinch zoom
  var zone=$("stickZone"),stick=$("stick"),knob=$("knob");
  var camTouches={},pinchD=0;
  zone.addEventListener("touchstart",function(e){
    e.preventDefault();
    var t=e.changedTouches[0];joy.on=true;joy.ox=t.clientX;joy.oy=t.clientY;joy.dx=0;joy.dy=0;
    stick.style.display="block";
    stick.style.left=(t.clientX-55)+"px";stick.style.top=(t.clientY-55)+"px";
  },{passive:false});
  zone.addEventListener("touchmove",function(e){
    e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      var dx=t.clientX-joy.ox,dy=t.clientY-joy.oy,d=Math.hypot(dx,dy),m=58;
      if(d>m){dx*=m/d;dy*=m/d}
      joy.dx=dx/m;joy.dy=dy/m;
      knob.style.left=(31+dx)+"px";knob.style.top=(31+dy)+"px";
    }
  },{passive:false});
  zone.addEventListener("touchend",function(e){
    joy.on=false;joy.dx=0;joy.dy=0;stick.style.display="none";knob.style.left="31px";knob.style.top="31px";
  });
  dom.addEventListener("touchstart",function(e){
    for(var i=0;i<e.changedTouches.length;i++)camTouches[e.changedTouches[i].identifier]=1;
    if(e.touches.length===2){
      pinchD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    }
  },{passive:false});
  dom.addEventListener("touchmove",function(e){
    e.preventDefault();
    if(e.touches.length===2){
      var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      if(pinchD>0)MY.camDist=Math.max(3,Math.min(26,MY.camDist*pinchD/Math.max(1,d)));
      pinchD=d;return;
    }
    var t=e.touches[0];
    if(camTouches[t.identifier]){
      MY.yaw-=(t.clientX-(camTouches[t.identifier].x||t.clientX))*0.006;
      var px=camTouches[t.identifier].px;
      if(px!==undefined)MY.pitch=Math.max(-1.2,Math.min(1.3,MY.pitch+(t.clientY-px)*0.006));
      camTouches[t.identifier]={x:t.clientX,px:t.clientY};
    }
  },{passive:false});
  dom.addEventListener("touchend",function(e){
    for(var i=0;i<e.changedTouches.length;i++)delete camTouches[e.changedTouches[i].identifier];
    if(e.touches.length<2)pinchD=0;
  });
  $("btnJump").addEventListener("touchstart",function(e){e.preventDefault();if(MY.onG||MY.fly)MY.vy=8.5},{passive:false});
  $("btnJump").addEventListener("mousedown",function(e){e.preventDefault();if(MY.onG||MY.fly)MY.vy=8.5});
  $("btnAtk").addEventListener("touchstart",function(e){e.preventDefault();attack()},{passive:false});
  $("btnAtk").addEventListener("mousedown",function(e){e.preventDefault();attack()});
  // hotbar
  var slots=document.querySelectorAll(".slot");
  slots.forEach(function(s){s.onclick=function(){setWeapon(+s.dataset.w)}});
  // chat
  $("chatin").addEventListener("keydown",function(e){
    e.stopPropagation();
    if(e.key==="Escape"){$("chatin").style.display="none";$("chatin").blur()}
    if(e.key!=="Enter")return;
    var v=$("chatin").value.trim();
    $("chatin").value="";$("chatin").style.display="none";$("chatin").blur();
    if(v)sendChat(v);
  });
  // admin panel
  $("gear").onclick=function(){var a=$("admin");a.style.display=a.style.display==="block"?"none":"block"};
  document.querySelectorAll("#admin button").forEach(function(b){
    b.onclick=function(){doCommand(b.dataset.c);if(b.dataset.c==="close")$("admin").style.display="none"};
  });
  if(!touchMode){$("stickZone").style.display="none";$("btnJump").style.display="none";$("btnAtk").style.display="none"}
}
function setWeapon(i){

  document.querySelectorAll(".slot").forEach(function(s,idx){s.classList.toggle("on",idx===i)});

/* ---------- WEAPONS ---------- */
function camDir(){
  var d=new THREE.Vector3(0,0,-1);
  d.applyQuaternion(G.camera.quaternion);
  return d.normalize();
}
function attack(){
  if(MY.dead||MY.atkCd>0)return;
  var now=performance.now()/1000;
  if(curW===0){
    MY.atkCd=0.5;MY.parts.rArm.rotation.x=-2.2;
    var dir=camDir(),o=MY.pos.clone();o.y+=1.6;
    var hitAny=false;
    zombies.forEach(function(zm){
      if(zm.dead)return;
      var to=zm.g.position.clone();to.y+=1.2;to.sub(o);
      if(to.length()<3.2&&to.normalize().dot(dir)>0.5){hurtZombie(zm,45);hitAny=true}
    });
    Object.keys(remote).forEach(function(id){
      var rp=remote[id];if(!rp.g.visible)return;
      var to=rp.g.position.clone();to.y+=1.2;to.sub(o);
      if(to.length()<3.2&&to.normalize().dot(dir)>0.5){
        net({t:"h",tg:id,d:45,by:ME.nick});hitAny=true;
      }
    });
  }else if(curW===1){
    MY.atkCd=0.35;
    var dir=camDir(),o=MY.pos.clone();o.y+=1.6;
    var best=null,bd=1e9,bIsZ=false;
    zombies.forEach(function(zm){
      if(zm.dead)return;
      var to=zm.g.position.clone();to.y+=1.2;to.sub(o);var d=to.length();
      if(d<70&&to.normalize().dot(dir)>0.988&&d<bd){bd=d;best=zm;bIsZ=true}
    });
    Object.keys(remote).forEach(function(id){
      var rp=remote[id];if(!rp.g.visible)return;
      var to=rp.g.position.clone();to.y+=1.2;to.sub(o);var d=to.length();
      if(d<70&&to.normalize().dot(dir)>0.988&&d<bd){bd=d;best=id;bIsZ=false}
    });
    var end=o.clone().add(dir.clone().multiplyScalar(best?bd:70));
    tracer(o,end);
    if(best){if(bIsZ)hurtZombie(best,34);else net({t:"h",tg:best,d:34,by:ME.nick})}
  }else{
    MY.atkCd=1.6;
    var dir=camDir(),o=MY.pos.clone();o.y+=1.6;o.add(dir.clone().multiplyScalar(1.2));
    var m=new THREE.Mesh(new THREE.SphereGeometry(0.22,8,6),new THREE.MeshLambertMaterial({color:0xe05050}));
    m.position.copy(o);G.scene.add(m);
    projectiles.push({m:m,v:dir.multiplyScalar(24),life:5});
  }
}
function hurtZombie(zm,dmg){
  zm.hp-=dmg;drawLabel(zm.bar,zm.hp);
  if(zm.hp<=0&&!zm.dead){
    zm.dead=true;zm.respT=8;zm.g.visible=false;
    MY.kills++;hudUpdate();
    addChat("System",ME.nick+" fragged a Dummy");
  }
}
function explode(pos){
  var s=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),new THREE.MeshBasicMaterial({color:0xffa040,transparent:true,opacity:0.85}));
  s.position.copy(pos);G.scene.add(s);
  fx.push({m:s,t:0,kind:"boom"});
  function dmgIn(dist){return Math.max(0,80*(1-dist/5))}
  zombies.forEach(function(zm){
    if(zm.dead)return;
    var d=zm.g.position.distanceTo(pos);
    if(d<5)hurtZombie(zm,dmgIn(d));
  });
  var dm=MY.pos.clone();dm.y+=1.2;var dme=dm.distanceTo(pos);
  if(dme<5&&!MY.god&&!MY.dead){MY.hp-=dmgIn(dme);MY.lastHit=nowSec();checkMyDeath(ME.nick)}
  Object.keys(remote).forEach(function(id){
    var rp=remote[id];if(!rp.g.visible)return;
    var to=rp.g.position.clone();to.y+=1.2;var d=to.distanceTo(pos);
    if(d<5)net({t:"h",tg:id,d:dmgIn(d),by:ME.nick});
  });
}
function tracer(a,b){
  var geo=new THREE.BufferGeometry().setFromPoints([a,b]);
  var ln=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xffe066}));

/* ---------- NETWORK ---------- */
function net(m){
  if(ME.mode==="host"){conns.forEach(function(c){try{c.send(m)}catch(e){}})}
  else if(hostConn){try{hostConn.send(m)}catch(e){}}
}
function relay(m,except){
  conns.forEach(function(c){if(c!==except){try{c.send(m)}catch(e){}}});
}
function setupConn(c){
  c.on("open",function(){
    conns.push(c);
    addChat("System","A player joined! ("+(conns.length+ (ME.mode==="solo"?0:1))+" online)");
    if(ME.isHost)c.send({t:"c",n:"System",m:"Welcome to the room! Code: "+ME.code});
  });
  c.on("data",function(m){onNet(m,c)});
  c.on("close",function(){
    conns=conns.filter(function(x){return x!==c});
    Object.keys(remote).forEach(function(id){
      if(remote[id].via===c){G.scene.remove(remote[id].g);delete remote[id]}
    });
    hudUpdate();
  });
}
function onNet(m,from){
  if(!m||!m.t)return;
  if(ME.isHost&&(m.t==="c"||m.t==="p"||m.t==="h"||m.t==="k"))relay(m,from);
  if(m.t==="p"){
    if(m.id===ME.id)return;
    var rp=remote[m.id];
    if(!rp){
      var col=[0xe05a4d,0x4dd06a,0xd4a017,0x9b59b6,0x1abc9c][Object.keys(remote).length%5];
      var a=makeAvatar(col,0x2b3a55,0xf0c27d,false);
      var lb=makeLabel(m.n,false);lb.position.y=3.1;a.g.add(lb);
      G.scene.add(a.g);
      rp=remote[m.id]={g:a.g,parts:a.parts,label:lb,via:from,last:nowSec(),hp:100,walk:0};
      hudUpdate();
    }
    rp.last=nowSec();
    rp.g.position.set(m.x,m.y,m.z);
    rp.g.rotation.y=m.ry;
    rp.hp=m.hp;drawLabel(rp.label,m.hp);
    if(m.mv)rp.walk=(rp.walk||0)+0.28;else rp.walk=0;
    var sw=Math.sin(rp.walk)*0.7;
    rp.parts.lArm.rotation.x=sw;rp.parts.rArm.rotation.x=-sw;
    rp.parts.lLeg.rotation.x=-sw;rp.parts.rLeg.rotation.x=sw;
  }
  if(m.t==="c")addChat(m.n,m.m);
  if(m.t==="h"&&m.tg===ME.id&&!MY.god&&!MY.dead){
    MY.hp-=m.d;MY.lastHit=nowSec();drawLabel(MY.label,MY.hp);checkMyDeath(m.by);
  }
  if(m.t==="k"){
    if(m.by===ME.nick){MY.kills++;hudUpdate()}
    addChat("System",m.by+" fragged "+m.vi);
  }
}
function netTick(dt){
  MY.netT-=dt;
  if(MY.netT<=0){
    MY.netT=0.1;
    if(ME.mode!=="solo")net({t:"p",id:ME.id,n:ME.nick,x:MY.pos.x,y:MY.pos.y,z:MY.pos.z,ry:MY.yaw,hp:Math.max(0,MY.hp),mv:joy.on||keys.KeyW||keys.KeyS||keys.KeyA||keys.KeyD});
    var now=nowSec();
    Object.keys(remote).forEach(function(id){
      if(now-remote[id].last>6){G.scene.remove(remote[id].g);delete remote[id];hudUpdate()}
    });
  }
}

/* ---------- CHAT & COMMANDS ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function addChat(n,m){
  var box=$("msgs"),d=document.createElement("div");
  d.innerHTML="<b>"+esc(n)+":</b> "+esc(m);
  box.appendChild(d);
  while(box.children.length>8)box.removeChild(box.firstChild);
}
function sendChat(txt){
  if(txt.charAt(0)===";"){doCommand(txt.slice(1).trim());return}
  addChat(ME.nick,txt);net({t:"c",n:ME.nick,m:txt});
}
function doCommand(s){
  var parts=s.split(/\s+/),c=(parts[0]||"").toLowerCase();
  if(c==="help"){
    addChat("System",";fly ;god ;night ;day ;rain ;stop ;heal ;tp X Z ;kick NICK");
  }else if(c==="fly"){MY.fly=!MY.fly;MY.vy=0;addChat("System","Fly "+(MY.fly?"ON":"OFF"))}
  else if(c==="god"){MY.god=!MY.god;addChat("System","God mode "+(MY.god?"ON":"OFF"))}
  else if(c==="night")setNight(true);
  else if(c==="day")setNight(false);
  else if(c==="rain"){rainOn=!rainOn;rainSys.visible=rainOn;addChat("System","Rain "+(rainOn?"ON":"OFF"))}
  else if(c==="stop"){rainOn=false;rainSys.visible=false;setNight(false)}
  else if(c==="heal"){MY.hp=100;drawLabel(MY.label,100);addChat("System","Healed")}
  else if(c==="tp"){
    var x=parseFloat(parts[1]),z=parseFloat(parts[2]);
    if(isFinite(x)&&isFinite(z)){MY.pos.set(x,groundHeightAt(x,z,20)+0.1,z);MY.vy=0;addChat("System","Teleported to "+x+", "+z)}
    else addChat("System","Usage: ;tp 30 -20");
  }else if(c==="kick"){
    if(!ME.isHost){addChat("System","Only the host can kick");return}
    var n=(parts[1]||"").toLowerCase(),found=false;
    conns.forEach(function(cn){
      Object.keys(remote).forEach(function(id){
        if(remote[id].via===cn&&remote[id].label.userData.nick.toLowerCase()===n){cn.close();found=true}
      });
    });
    addChat("System",found?"Kicked "+n:"Player not found");
  }else addChat("System","Unknown command. Type ;help");
}
function setNight(on){
  nightOn=on;
  var c=on?0x0a0f2a:0x87ceeb;
  G.scene.background=new THREE.Color(c);
  G.scene.fog.color=new THREE.Color(c);
  G.sun.intensity=on?0.12:0.9;
  G.hemi.intensity=on?0.18:0.85;
}

/* ---------- HUD ---------- */
function hudUpdate(){
  var nPlayers=1+Object.keys(remote).length;
  var html="Kills <b>"+MY.kills+"</b> &nbsp; Deaths <b>"+MY.deaths+"</b> &nbsp; Players <b>"+nPlayers+"</b>";
  if(ME.mode!=="solo")html+=" &nbsp; Room <b>"+ME.code+"</b> <button id='copyCode'>COPY</button>";
  $("hud").innerHTML=html;
  var cb=$("copyCode");
  if(cb)cb.onclick=function(){
    try{navigator.clipboard.writeText(ME.code);cb.textContent="COPIED!";setTimeout(function(){cb.textContent="COPY"},1200)}catch(e){}
  };
}

/* ---------- ZOMBIES ---------- */
function updateZombies(dt){
  var now=nowSec();
  if(zombies.length===0){
    for(var i=0;i<6;i++)zombies.push(makeZombie(14+Math.random()*10-5+Math.random()*8,Math.random()*24-12));
  }
  zombies.forEach(function(zm){
    if(zm.dead){zm.respT-=dt;if(zm.respT<=0){zm.dead=false;zm.hp=50;zm.g.visible=true;drawLabel(zm.bar,50);zm.g.position.copy(zm.home)}return}
    var best=null,bd=13;
    var cand=[{p:MY.pos,id:null}].concat(Object.keys(remote).map(function(id){return {p:remote[id].g.position,id:id}}));
    cand.forEach(function(c){var d=c.p.distanceTo(zm.g.position);if(d<bd){bd=d;best=c}});
    var tx,tz;
    if(best){tx=best.p.x;tz=best.p.z}else{
      if(zm.g.position.distanceTo(zm.tgt)<2)zm.tgt.set(zm.home.x+Math.random()*16-8,0,zm.home.z+Math.random()*16-8);
      tx=zm.tgt.x;tz=zm.tgt.z;
    }
    var dx=tx-zm.g.position.x,dz=tz-zm.g.position.z,d=Math.hypot(dx,dz)||1;
    var sp=best?2.6:1.2;
    if(!best||bd>1.5){
      zm.g.position.x+=dx/d*sp*dt;
      zm.g.position.z+=dz/d*sp*dt;
      zm.g.rotation.y=Math.atan2(dx,dz);
      zm.walk+=dt*6;
      var sw=Math.sin(zm.walk)*0.55;
      zm.parts.lLeg.rotation.x=sw;zm.parts.rLeg.rotation.x=-sw;
      zm.parts.lArm.rotation.x=-1.35+Math.sin(zm.walk)*0.15;
      zm.parts.rArm.rotation.x=-1.35-Math.sin(zm.walk)*0.15;
    }
    zm.atkCd-=dt;
    if(best&&bd<1.9&&zm.atkCd<=0){
      zm.atkCd=1.0;
      if(best.id===null&&!MY.god&&!MY.dead){MY.hp-=10;MY.lastHit=now;drawLabel(MY.label,MY.hp);checkMyDeath("a Dummy")}
    }
  });
}

/* ---------- PROJECTILES & FX ---------- */
function updateFx(dt){
  for(var i=projectiles.length-1;i>=0;i--){
    var p=projectiles[i];
    p.v.y-=6*dt;
    p.m.position.addScaledVector(p.v,dt);
    p.life-=dt;
    var hit=p.life<=0||p.m.position.y<=0.1;
    if(!hit){
      collide(p.m.position,0.3);
      if(p.m.position.y<=0.1)hit=true;
    }
    if(hit){explode(p.m.position.clone());G.scene.remove(p.m);projectiles.splice(i,1)}
  }
  for(i=fx.length-1;i>=0;i--){
    var f=fx[i];f.t+=dt;
    if(f.kind==="tracer"){if(f.t>0.09){G.scene.remove(f.m);fx.splice(i,1)}}
    else{
      f.m.scale.setScalar(1+f.t*10);
      f.m.material.opacity=Math.max(0,0.85-f.t*2);
      if(f.t>0.45){G.scene.remove(f.m);fx.splice(i,1)}
    }
  }
}

/* ---------- MAIN LOOP ---------- */
var camD0=0;
function updatePlayer(dt){
  var now=nowSec();
  if(MY.dead){
    MY.respawnT-=dt;
    if(MY.respawnT<=0)respawn();
    return;
  }
  // input dir
  var ix=0,iz=0;
  if(keys.KeyW)iz-=1;if(keys.KeyS)iz+=1;
  if(keys.KeyA)ix-=1;if(keys.KeyD)ix+=1;
  if(joy.on){ix+=joy.dx;iz+=joy.dy}
  var mag=Math.hypot(ix,iz);
  if(mag>1){ix/=mag;iz/=mag}
  var moving=mag>0.12;
  var sp=MY.speed;
  var sin=Math.sin(MY.yaw),cos=Math.cos(MY.yaw);
  var wx=ix*cos+iz*sin, wz=-ix*sin+iz*cos;
  if(MY.fly){
    MY.vy=0;
    if(keys.Space)MY.pos.y+=sp*1.2*dt;
    if(keys.ShiftLeft)MY.pos.y-=sp*1.2*dt;
    MY.pos.x+=wx*sp*1.6*dt;MY.pos.z+=wz*sp*1.6*dt;
    MY.pos.y=Math.max(0,MY.pos.y);
  }else{
    MY.pos.x+=wx*sp*dt;MY.pos.z+=wz*sp*dt;
    MY.vy-=20*dt;
    MY.pos.y+=MY.vy*dt;
    var gh=groundHeightAt(MY.pos.x,MY.pos.z,MY.pos.y+0.1);
    if(MY.pos.y<=gh){MY.pos.y=gh;MY.vy=0;MY.onG=true}else MY.onG=false;
    if((keys.Space)&&MY.onG)MY.vy=8.5;
  }
  collide(MY.pos,0.55);
  MY.pos.x=Math.max(-140,Math.min(140,MY.pos.x));
  MY.pos.z=Math.max(-140,Math.min(140,MY.pos.z));
  MY.g.position.copy(MY.pos);
  MY.g.rotation.y=MY.yaw;
  // walk anim
  if(moving){MY.walk+=dt*9;var sw=Math.sin(MY.walk)*0.8;
    MY.parts.lLeg.rotation.x=sw;MY.parts.rLeg.rotation.x=-sw;
    if(MY.atkCd<=0){MY.parts.lArm.rotation.x=sw*0.7;MY.parts.rArm.rotation.x=-sw*0.7;}
  }else{MY.parts.lLeg.rotation.x*=0.8;MY.parts.rLeg.rotation.x*=0.8;}
  if(MY.atkCd>0){MY.atkCd-=dt;MY.parts.rArm.rotation.x=Math.max(-2.2,MY.parts.rArm.rotation.x+dt*9)}
  // hp regen
  if(MY.hp<100&&now-MY.lastHit>5){MY.hp=Math.min(100,MY.hp+6*dt);drawLabel(MY.label,MY.hp)}
  $("hpbar").style.width=Math.max(0,MY.hp)+"%";
  netTick(dt);
}
function updateCamera(){
  var target=MY.pos.clone();target.y+=2.2;
  var cy=Math.cos(MY.pitch),dir=new THREE.Vector3(Math.sin(MY.yaw)*cy,Math.sin(MY.pitch),Math.cos(MY.yaw)*cy);
  var pos=target.clone().addScaledVector(dir,MY.camDist);
  if(pos.y<0.5)pos.y=0.5;
  G.camera.position.copy(pos);
  G.camera.lookAt(target);
}
function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(0.05,G.clock.getDelta());
  updatePlayer(dt);
  updateZombies(dt);
  updateFx(dt);
  updateCamera();
  clouds.forEach(function(c){c.g.position.x+=c.vx*dt;if(c.g.position.x>110)c.g.position.x=-110});
  if(rainOn){
    var pa=rainSys.geometry.attributes.position,arr=pa.array;
    for(var i=0;i<arr.length;i+=3){
      arr[i+1]-=28*dt;
      if(arr[i+1]<0){arr[i+1]=28;arr[i]=MY.pos.x+Math.random()*80-40;arr[i+2]=MY.pos.z+Math.random()*80-40}
    }
    pa.needsUpdate=true;
  }
  G.renderer.render(G.scene,G.camera);
}
</script>
